          $ref: "#/components/schemas/PlayerScope"
    PunishEntryDTO:
      required:
      - identifier
      - lifted
      - metaData
      - permanent
      - section
      - shortId
      - source
      - verified
      type: object
      properties:
        identifier:
          type: string
          description: the identifier of the punishment
        shortId:
          type: string
          description: "the short ID players quote, `#` and eight upper case hex characters"
        source:
          type: string
          description: "the source of the punishment: the staff member's `oid` for\
            \ punishments written with a token, the delegated in-game UUID for the\
            \ proxy's, or whatever was stored before SSO"
          format: uuid
        recordedByOid:
          type: string
          description: "the `oid` of the verified principal that wrote it, `null`\
            \ for punishments written before SSO"
          format: uuid
          nullable: true
        verified:
          type: boolean
          description: "whether `recordedByOid` is present: `false` marks a legacy,\
            \ unverified attribution"
        actorOid:
          type: string
          description: "the staff member the in-game `source` was linked to when it\
            \ was written, `null` for web writes, unlinked UUIDs and punishments from\
            \ before the link existed"
          format: uuid
          nullable: true
        actorName:
          type: string
          description: "the display name of `actorOid`, `null` when unknown, anonymized\
            \ or not looked up (profile listings carry only the `actorOid`)"
          nullable: true
        section:
          type: string
          description: the section it belongs to
        scope:
          type: string
          description: "the optional scope (e.g. event/community) it is restricted\
            \ to, or `null`"
          nullable: true
        permanent:
          type: boolean
          description: whether it is a permanent punishment issued by the system's
            escalation
        lifted:
          type: boolean
          description: whether it was revoked or lifted by a granted appeal
        createdAt:
          type: integer
          description: creation time in epoch millis
          format: int64
          nullable: true
        escalationGroup:
          type: string
          description: "the escalation group a template punishment counted towards,\
            \ else `null`"
          nullable: true
        stepIndex:
          type: integer
          description: "the zero-based escalation step that was applied, else `null`"
          format: int32
          nullable: true
        stepCount:
          type: integer
          description: "how many steps the template had when it was applied, else\
            \ `null`"
          format: int32
          nullable: true
        eloCost:
          type: integer
          description: "the ELO deducted when it was applied, else `null`"
          format: int32
          nullable: true
        template:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishTemplateResponse"
        evidenceCount:
          type: integer
          description: "how many valid evidence items the punishment has - the only\
            \ thing about evidence a player may learn; `null` where it was not computed\
            \ (profile listings), use `GET /punishment/{reference}/evidence/count`\
            \ there"
          format: int64
          nullable: true
        kind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishmentKind"
        kickScope:
          type: string
          description: "the scope a kick was applied at (`NETWORK`, `SERVER` or `SECTION`),\
            \ else `null`"
          nullable: true
        kickTarget:
          type: string
          description: "the server or section a scoped kick targeted, else `null`"
          nullable: true
        metaData:
          type: object
          additionalProperties:
            type: object
          description: the metadata of the punishment
      description: An applied punishment as it appears in profiles and apply results.
