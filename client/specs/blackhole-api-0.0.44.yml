openapi: 3.0.1
info:
  title: Blackhole API
  description: Simple ban management system
  contact:
    name: Management
    url: https://onelitefeather.net
    email: admin@onelitefeather.net
  license:
    name: Close Source
  version: 0.0.44
security:
- bearerAuth: []
paths:
  /admin/discord-link:
    get:
      tags:
      - Discord link
      summary: List Discord links
      description: Every staff and player link with the staff members' names. A Discord
        user id is never returned.
      operationId: listDiscordLinks
      responses:
        "200":
          description: "The links, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkListResponse"
  /admin/discord-link/{id}:
    delete:
      tags:
      - Discord link
      summary: Remove a Discord link
      description: Removes one link and with it the stored Discord user id.
      operationId: removeDiscordLink
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: There is no such link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /admin/import/punishments:
    get:
      tags:
      - Import
      summary: List imported punishments without a template
      description: "Groups the punishments imported from a vanilla ban list that are\
        \ linked to no template by their original reason, the largest group first."
      operationId: listImportedPunishmentGroups
      responses:
        "200":
          description: The groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentGroups"
  /admin/import/punishments/retemplate:
    post:
      tags:
      - Import
      summary: Link imported punishments to a template
      description: "Links imported punishments that have no template to a template,\
        \ either every one with an original reason or an explicit selection. Only\
        \ the template changes: no score, step, duration or section. Each change is\
        \ recorded on the case as punishment.retemplated with the caller as actor.\
        \ A punishment that already has a template is never overwritten, so repeating\
        \ a request changes nothing."
      operationId: retemplateImportedPunishments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportedPunishmentRetemplateRequest"
        required: true
      responses:
        "200":
          description: What was linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentRetemplateResponse"
        "400":
          description: "Neither or both of reason and identifiers, or the template\
            \ is in a mute section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
        "409":
          description: The template's section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
  /admin/staff-actor:
    get:
      tags:
      - Auth
      summary: List staff actors
      description: "Every verified staff principal the backend has seen, with the\
        \ display name kept for it (absent once anonymized), its kind and when it\
        \ was first and last seen. Most recently seen first."
      operationId: listStaffActors
      responses:
        "200":
          description: The known staff principals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorListResponse"
  /admin/staff-actor/{oid}/anonymize:
    post:
      tags:
      - Auth
      summary: Anonymize a staff actor
      description: "Clears the stored display name of a staff principal (leaving staff,\
        \ erasure request). The object id and every record that references it stay.\
        \ The action is audited with the admin's own object id."
      operationId: anonymizeStaffActor
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The display name was cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorAnonymizeResponse"
        "404":
          description: Unknown staff actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorError"
  /admin/staff-link:
    get:
      tags:
      - Staff link
      summary: List staff links
      description: "Every staff member's linked Minecraft account, with the staff\
        \ member's display name."
      operationId: listStaffLinks
      responses:
        "200":
          description: "The links, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkListResponse"
  /admin/staff-link/{oid}:
    delete:
      tags:
      - Staff link
      summary: Unlink a staff member
      description: Removes the link of any staff member. Actions already attributed
        to them stay attributed. Audited with the admin's own object id.
      operationId: unlinkStaffLink
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: That staff member has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /appeal:
    get:
      tags:
      - Appeal
      summary: Get all appeals
      description: Retrieves a paginated list of appeals
      operationId: getAppeals
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved appeals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealDTO"
    post:
      tags:
      - Appeal
      summary: Submit an appeal
      description: Submits an appeal against a punishment. Immediately evaluated against
        the eligibility checklist.
      operationId: submitAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionDTO"
        required: true
      responses:
        "200":
          description: Appeal submitted (status reflects whether it passed the eligibility
            checklist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Punishment not found
  /appeal-conditions:
    get:
      tags:
      - AppealConditions
      summary: The current appeal conditions
      description: The newest version of the conditions a player confirms before filing
        an appeal.
      operationId: currentAppealConditions
      responses:
        "200":
          description: The current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditions"
    post:
      tags:
      - AppealConditions
      summary: Save the appeal conditions as a new version
      description: Creates the next version; no version is ever overwritten.
      operationId: saveAppealConditions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealConditionsRequest"
      responses:
        "200":
          description: The new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditions"
        "400":
          description: "The text is empty, too long or has a control character"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
        "409":
          description: Another save took the version number; review and save again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
  /appeal-conditions/versions:
    get:
      tags:
      - AppealConditions
      summary: All versions of the appeal conditions
      description: "Every version, newest first. Versions are never changed or removed."
      operationId: listAppealConditionVersions
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealConditions"
  /appeal/{identifier}/review:
    post:
      tags:
      - Appeal
      summary: Review an appeal
      description: Decides an eligible appeal. Rejects self-review (the caller's oid
        matching the punishment's source or the principal that recorded it) and full
        lifts of SEVERE punishments (duration reduction only).
      operationId: reviewAppeal
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealReviewDTO"
        required: true
      responses:
        "200":
          description: Appeal decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Appeal not found
        "400":
          description: "Invalid decision, or a full lift was attempted on a SEVERE\
            \ punishment"
        "403":
          description: The caller issued the punishment (self-review)
        "409":
          description: "Appeal is not awaiting review, or the punishment is no longer\
            \ active"
        "422":
          description: "The playerMessage contains a UUID, an IP address or a Ban\
            \ ID; the appeal stays undecided"
  /auth/me:
    get:
      tags:
      - Auth
      summary: Who am I
      description: "The object id, display name and internal roles of the caller.\
        \ Answers 200 with an empty role list when the token is valid but maps to\
        \ no role, so a client can show a no-access page."
      operationId: getCurrentCaller
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: "No valid token, or the token has no object id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /case:
    get:
      tags:
      - Case
      summary: List cases
      description: "Lists cases, newest activity first. Every filter is optional.\
        \ punishmentState is ACTIVE, EXPIRED or LIFTED."
      operationId: listCases
      parameters:
      - name: status
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
      - name: assignee
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: tag
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: priority
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CasePriority"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: punishmentState
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: One page of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListPage"
        "400":
          description: A filter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}:
    get:
      tags:
      - Case
      summary: Get a case
      description: The case of a punishment with its metadata and up to 20 other punishments
        of the same player. A punishment without a case row reads as the default case
        (version 0); a read never creates one.
      operationId: getCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
    patch:
      tags:
      - Case
      summary: Change a case
      description: "Sets status, assignee, priority and tags. expectedVersion must\
        \ be the version that was read; a value equal to the current one changes nothing\
        \ and appends no event. Each change appends its event in the same statement."
      operationId: updateCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdateRequest"
        required: true
      responses:
        "200":
          description: The case after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: Invalid tags or no expectedVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: "The case was changed since expectedVersion, or the short id\
            \ is ambiguous"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "422":
          description: The assignee is not a known human staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/attachments:
    post:
      tags:
      - Case
      summary: Upload a file for a chat message
      description: "Stages one file (PNG, JPEG, WebP, PDF or UTF-8 text, at most 10\
        \ MiB) for the case's conversation as multipart form data. The type is detected\
        \ from the bytes, the file is virus scanned before it is stored, images lose\
        \ their metadata, and a PDF that names active content is refused. The answer\
        \ holds the attachmentId to send in attachmentIds of POST /case/{reference}/messages;\
        \ the player sees the file once that message is posted, and the panel must\
        \ warn the moderator before sending. A quota bounds how many files wait and\
        \ how many a case holds."
      operationId: uploadCaseAttachment
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The file was staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAttachmentStaged"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: "QUOTA: too many files wait or the case holds the maximum,\
            \ or the short id is ambiguous"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit, or an image has too many\
            \ pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: "The detected type is not allowed (video, archives, SVG, other)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "FILE_FLAGGED by the virus scanner, FILE_ACTIVE_CONTENT in\
            \ a PDF, or not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable (nothing
            is stored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /case/{reference}/ban-id/leak:
    post:
      tags:
      - Case
      summary: Mark the Ban ID leaked
      description: "Records ban_id.leak_marked with a reason code and sets the leak\
        \ state of the case. Marking an already leaked Ban ID changes nothing (changed:\
        \ false). Before an appeal the right to appeal is forfeited, after filing\
        \ the ticket is frozen for the player. The Ban ID itself is never in the request,\
        \ the response or the event."
      operationId: markCaseBanIdLeaked
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseBanIdLeakRequest"
        required: true
      responses:
        "200":
          description: "The leak is marked (changed: false when it already was)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBanIdLeakResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/ban-id/reissue:
    post:
      tags:
      - Case
      summary: Reissue the Ban ID
      description: "Replaces the Ban ID, raises its generation, clears the leak state\
        \ and records ban_id.reissued with the generation numbers. The old Ban ID\
        \ stops working at once. The new one is not returned: reveal it with GET /punishment/{reference}/ban-id."
      operationId: reissueCaseBanId
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseBanIdReissueRequest"
        required: true
      responses:
        "200":
          description: A new Ban ID was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBanIdReissueResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The punishment has no Ban ID yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "503":
          description: No free Ban ID could be drawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/events:
    get:
      tags:
      - Case
      summary: Live updates of a case
      description: "A text/event-stream with the same frames as the player's stream:\
        \ retry, ready {\"seq\"}, changed {\"seq\"} (id = seq) for every change of\
        \ the case, including internal notes and the player's seen marker, a keep-alive\
        \ every 15 seconds. The frames carry no content: after a changed event read\
        \ GET /case/{reference} or the timeline with the cursor. Token refresh is\
        \ the client's job: a stream is opened with a current token and ends after\
        \ its maximum lifetime."
      operationId: caseEvents
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The token is missing or invalid
        "403":
          description: The caller's role may not read cases
        "404":
          description: Unknown punishment
        "503":
          description: The replica holds its maximum of streams; poll instead
  /case/{reference}/evidence-shares:
    get:
      tags:
      - Case
      summary: List the shares of a case
      description: "Lists the shares oldest first with their state: ACTIVE, REVOKED,\
        \ or UNAVAILABLE when the evidence was deleted."
      operationId: listEvidenceShares
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareList"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
    post:
      tags:
      - Case
      summary: Share evidence with the player
      description: "Shows one chat capture (selected lines, at most 20) or one team\
        \ screenshot to the player of the case's appeal. confirmedMinimised must be\
        \ true. The share is one case event (evidence.shared) without content, and\
        \ can be revoked. An identical active share answers the existing one with\
        \ repeated: true."
      operationId: shareEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceShareRequest"
        required: true
      responses:
        "200":
          description: The share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShare"
        "400":
          description: NOT_CONFIRMED or BAD_SELECTION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "404":
          description: Unknown punishment or evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "409":
          description: "NO_APPEAL, FROZEN (Ban ID marked leaked) or NOT_VALID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "422":
          description: "NOT_SHAREABLE (anticheat, replay, link, transcript, video,\
            \ a player's own file) or PII_REJECTED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/evidence-shares/preview:
    post:
      tags:
      - Case
      summary: Preview what a share would show
      description: "Returns exactly the lines and labels (or the image facts) the\
        \ player would see for a selection of a chat capture: the appealing speaker\
        \ as You, the others as Player 2, Player 3, times as offsets, plain text.\
        \ Changes nothing."
      operationId: previewEvidenceShare
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSharePreviewRequest"
        required: true
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSharePreview"
        "400":
          description: "BAD_SELECTION: no lines, more than the maximum, a line twice\
            \ or outside, no valid appealing speaker"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "404":
          description: Unknown punishment or evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "409":
          description: "NOT_VALID: the evidence is lifted or revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "422":
          description: "NOT_SHAREABLE, or PII_REJECTED (a line holds a UUID or an\
            \ IP; only its index is named)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/evidence-shares/{shareId}/revoke:
    post:
      tags:
      - Case
      summary: Revoke a share
      description: "Withdraws a share at once: the player's next read shows an empty\
        \ card and the file route answers 404. It cannot take back what the player\
        \ already saw or saved. Revoking again changes nothing and answers the share\
        \ as revoked."
      operationId: revokeEvidenceShare
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceShareRevokeRequest"
        required: true
      responses:
        "200":
          description: "The share, revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShare"
        "404":
          description: Unknown punishment or share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/messages:
    post:
      tags:
      - Case
      summary: Reply to the player
      description: "Adds a message of 1 to 2000 characters that the player can read\
        \ (visibility is always PLAYER; a body field cannot change that, staff-internal\
        \ text is a note). It must not contain a UUID, an IP address or a Ban ID.\
        \ The optional Idempotency-Key makes a repeated post a no-op that answers\
        \ with the first message."
      operationId: postCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRequest"
        required: true
      responses:
        "200":
          description: "The message was stored (repeated: true when the key had posted\
            \ it before)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "400":
          description: Invalid text or Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/messages/{messageId}:
    put:
      tags:
      - Case
      summary: Correct a staff message
      description: "Appends a new version of a staff message; the earlier versions\
        \ stay. Only the verified author or an admin may, never a player's message,\
        \ and not once the message is deleted or redacted."
      operationId: editCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRequest"
        required: true
      responses:
        "200":
          description: The message was edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "403":
          description: "Not the author (and not an admin), or a player's message"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The message was deleted or redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
    delete:
      tags:
      - Case
      summary: Delete a staff message
      description: "Appends message.deleted: the player sees the message removed,\
        \ staff see its last text marked deleted. Same rules as an edit."
      operationId: deleteCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The message was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "403":
          description: "Not the author (and not an admin), or a player's message"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The message was already deleted or redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/messages/{messageId}/redact:
    post:
      tags:
      - Case
      summary: Redact a message
      description: "Removes the text of every version of a message for data protection,\
        \ keeping type, time, author kind and visibility, and appends message.redacted.\
        \ The reason is a code. Repeating it is harmless."
      operationId: redactCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRedactRequest"
        required: true
      responses:
        "200":
          description: The message was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageRedactResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/notes:
    post:
      tags:
      - Case
      summary: Add a note
      description: Adds an internal staff note of 1 to 4000 characters. It must not
        contain a UUID or an IP address.
      operationId: addCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}:
    put:
      tags:
      - Case
      summary: Edit a note
      description: Appends a new version of the note; the earlier versions stay. Only
        the verified author or an admin may edit.
      operationId: editCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "403":
          description: The caller is neither the author nor an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}/redact:
    post:
      tags:
      - Case
      summary: Redact a note
      description: "Removes the text of every version of a note for data protection,\
        \ keeping type, time and actor, and appends a note.redacted event. The reason\
        \ is a code. Repeating it is harmless."
      operationId: redactCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRedactRequest"
        required: true
      responses:
        "200":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRedactResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/participants/{participantId}/erase:
    post:
      tags:
      - Case
      summary: Erase a conversation participant
      description: Removes the Discord user id and the display name of the participant
        and marks it erased. The timeline keeps its structure with an anonymous author
        and its timestamps; the stored protocols are purged and regenerated. Message
        text is redacted separately. Erasing an erased participant changes nothing.
      operationId: eraseCaseParticipant
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: participantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The participant is erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantErased"
        "404":
          description: Unknown punishment or participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantError"
  /case/{reference}/protocol:
    get:
      tags:
      - Case
      summary: List the stored protocols of a case
      description: "The readable versions of the protocols of every appeal of the\
        \ case, newest first. A version that a redaction made unreadable is not listed."
      operationId: listCaseProtocols
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The readable versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolList"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/protocol/{evidenceId}:
    get:
      tags:
      - Case
      summary: Open the text of a stored protocol
      description: "The human-readable rendering of one version, addressed by its\
        \ evidence id. Writes a VIEWED audit entry. The response is never cached."
      operationId: openCaseProtocol
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolText"
        "404":
          description: "Unknown punishment, unknown protocol, or a version a redaction\
            \ made unreadable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/protocol/{evidenceId}/download:
    get:
      tags:
      - Case
      summary: Download a stored protocol
      description: "The text or the JSON of one version as an attachment, with X-Content-Type-Options:\
        \ nosniff, Content-Security-Policy: sandbox and Cache-Control: private, no-store.\
        \ Writes a DOWNLOADED audit entry."
      operationId: downloadCaseProtocol
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: "The file (Content-Disposition: attachment)"
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "404":
          description: "Unknown punishment, unknown protocol, or a version a redaction\
            \ made unreadable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/timeline:
    get:
      tags:
      - Case
      summary: Read the timeline of a case
      description: "Events in timeline order (occurredAt, then seq), 50 per page by\
        \ default and at most 200. Follow nextCursor for the next page. type may repeat\
        \ and takes exact types or the groups note, appeal, evidence, case and punishment."
      operationId: getCaseTimeline
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: type
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: actorTrust
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: from
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: to
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: order
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTimelinePage"
        "400":
          description: A filter or the cursor is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/transcript:
    get:
      tags:
      - Case
      summary: Export the transcript
      description: "The conversation and lifecycle of the case in order, as a JSON\
        \ or text attachment. Notes are left out unless includeNotes is set; redacted\
        \ entries are markers without text. Every export appends transcript.exported\
        \ (actor, format, entry count, no content) first. The response is never cached."
      operationId: exportCaseTranscript
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: includeNotes
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      responses:
        "200":
          description: "The transcript file (Content-Disposition: attachment, Cache-Control:\
            \ no-store)"
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/transcript/erase-player:
    post:
      tags:
      - Case
      summary: Erase the player's side of the conversation
      description: Redacts every message the player wrote in this case in one statement
        (staff messages stay) and appends message.redacted for each. The reason is
        a code.
      operationId: eraseCasePlayerMessages
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRedactRequest"
        required: true
      responses:
        "200":
          description: The player messages were redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTranscriptEraseResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /client-rule:
    get:
      tags:
      - ClientRule
      summary: List client rules
      description: "All rules, enabled or not, sorted by key. Refreshes the enabled\
        \ rules in the shared cache that proxies read."
      operationId: listClientRules
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRuleResponse"
    post:
      tags:
      - ClientRule
      summary: Create a client rule
      description: "Creates an enabled rule. The action defaults to NOTIFY and the\
        \ scope to GLOBAL. Brand, channel and mod values are chosen by the client\
        \ and can be faked, so a TEMPLATE action on them needs acknowledgedSpoofable.\
        \ Admins only."
      operationId: createClientRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleCreateRequest"
        required: true
      responses:
        "200":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "400":
          description: "Invalid rule, unknown section or template"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
        "409":
          description: A rule with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
  /client-rule/catalogue:
    get:
      tags:
      - ClientRule
      summary: Get the client rule catalogue
      description: "The merged view of all live proxy snapshots, for the rule editor.\
        \ available is false when none is known or the cache is down."
      operationId: getClientRuleCatalogue
      responses:
        "200":
          description: The merged catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueResponse"
    put:
      tags:
      - ClientRule
      summary: Report a proxy's client rule catalogue
      description: "Replaces the calling proxy's snapshot of the brands, channels,\
        \ commands and protocol versions it has seen. Brands and channels seen from\
        \ fewer than three distinct players are dropped. It expires unless the proxy\
        \ reports again. Proxy tokens only."
      operationId: reportClientRuleCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleCatalogueReportRequest"
        required: true
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueStored"
        "400":
          description: Invalid name or snapshot too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueError"
  /client-rule/hit:
    post:
      tags:
      - ClientRule
      summary: Report a client rule hit
      description: "Stores the hit without any client trait and counts it on the rule.\
        \ For a TEMPLATE rule the backend applies the rule's template once while the\
        \ player has no active punishment from that rule, and never for a bypassed\
        \ player. Proxy tokens only."
      operationId: reportClientRuleHit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleHitCreateRequest"
        required: true
      responses:
        "200":
          description: Hit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitRecorded"
        "400":
          description: Malformed owner or server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
        "404":
          description: No enabled rule has that key; nothing is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /client-rule/hits:
    get:
      tags:
      - ClientRule
      summary: Rule hits of one player
      description: "The newest hits of a player over all rules, newest first (at most\
        \ 500, default 100)."
      operationId: listClientRuleHitsOfOwner
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHits"
        "400":
          description: owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /client-rule/{key}:
    get:
      tags:
      - ClientRule
      summary: Get a client rule
      operationId: getClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
    put:
      tags:
      - ClientRule
      summary: Update a client rule
      description: "Replaces every editable field of the rule, including whether it\
        \ is enabled. The body key must equal the path key. Admins only."
      operationId: updateClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleUpdateRequest"
        required: true
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "400":
          description: "Invalid rule, unknown section or template"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
    delete:
      tags:
      - ClientRule
      summary: Delete a client rule
      description: "Removes the rule with its patterns, servers and sections. Admins\
        \ only."
      operationId: deleteClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The removed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
  /client-rule/{key}/hits:
    get:
      tags:
      - ClientRule
      summary: Hits of one rule
      description: "The newest hits of a rule, newest first (at most 500, default\
        \ 100). Hits expire after the retention period."
      operationId: listClientRuleHits
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHits"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /cloudnet/catalogue:
    get:
      tags:
      - CloudNet
      summary: Get the CloudNet catalogue
      description: The merged view of all live proxy snapshots. available is false
        when none is known or the cache is down.
      operationId: getCloudNetCatalogue
      responses:
        "200":
          description: The merged catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueResponse"
    put:
      tags:
      - CloudNet
      summary: Report a proxy's CloudNet catalogue
      description: "Replaces the calling proxy's snapshot of CloudNet tasks, groups\
        \ and services. It expires after 15 minutes unless the proxy reports again.\
        \ Proxy tokens only."
      operationId: reportCloudNetCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueReportRequest"
        required: true
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueStored"
        "400":
          description: Invalid name or snapshot too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Dashboard summary
      description: "Active punishments per section, open reports, pending appeals,\
        \ escalations of the last 7 days and the latest automatic permanent punishments"
      operationId: getDashboardSummary
      responses:
        "200":
          description: The current summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
  /discord/leak-check:
    post:
      tags:
      - Discord tickets
      summary: Verify Ban ID look-alikes found in a public channel
      description: "Called by the Discord bot only. Candidates that are a current\
        \ Ban ID mark the case leaked (reason POSTED_PUBLIC, source DISCORD_BOT, the\
        \ poster as an opaque participant); the answer counts matches and never names\
        \ a punishment. A candidate that is no Ban ID causes nothing and is not stored\
        \ or logged."
      operationId: checkDiscordLeak
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLeakCheckRequest"
        required: true
      responses:
        "200":
          description: How many candidates matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLeakCheckResult"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLeakCheckError"
  /discord/link/confirm:
    post:
      tags:
      - Discord link
      summary: Confirm a Discord link code
      description: "Called by the Discord bot only. Binds the Discord user (the one\
        \ who typed /link) to the staff member or player the code was issued to, replacing\
        \ any earlier link of either side. A wrong, expired or already used code is\
        \ answered identically with INVALID_CODE."
      operationId: confirmDiscordLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLinkConfirmRequest"
        required: true
      responses:
        "200":
          description: The link now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkConfirmResponse"
        "400":
          description: "The Discord user id is malformed, or the code is invalid,\
            \ expired or used (kind INVALID_CODE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
        "409":
          description: A concurrent confirmation took the account; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /discord/link/{discordUserId}:
    get:
      tags:
      - Discord link
      summary: What a Discord user is linked to
      description: "Called by the Discord bot for /whoami: the kinds of link this\
        \ Discord user has and, for a staff link, the staff member's name."
      operationId: lookupDiscordLink
      parameters:
      - name: discordUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The links of the Discord user, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkWhoamiResponse"
    delete:
      tags:
      - Discord link
      summary: Unlink a Discord user
      description: "Called by the Discord bot for /unlink: removes every link of the\
        \ Discord user and with it the stored Discord user id."
      operationId: unlinkDiscordUser
      parameters:
      - name: discordUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The links were removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: The Discord user has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /discord/notifications/appeal/{identifier}:
    get:
      tags:
      - Discord notifications
      summary: Facts for an appeal notification
      description: "Called by the Discord bot only, after an appeal.submitted or appeal.resolved\
        \ event. Returns the appellant's name when one was recorded (otherwise a short\
        \ pseudonymous reference), the section, a shortened statement, the status\
        \ and the punishment identifier for the case link. Never a Ban ID."
      operationId: getAppealNotification
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The appeal facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordAppealNotification"
        "404":
          description: There is no such appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordNotificationError"
  /discord/notifications/report/{identifier}:
    get:
      tags:
      - Discord notifications
      summary: Facts for a report notification
      description: "Called by the Discord bot only, after a report.created or report.resolved\
        \ event. Returns the reported player's name when one was recorded (otherwise\
        \ a short pseudonymous reference), the category, a shortened description and\
        \ the status. Never a raw UUID."
      operationId: getReportNotification
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The report facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordReportNotification"
        "404":
          description: There is no such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordNotificationError"
  /discord/staff-links:
    get:
      tags:
      - Discord tickets
      summary: Live staff links
      description: "The Discord accounts of staff members with a live link, for the\
        \ bot's channel access reconcile: only these accounts, when they also hold\
        \ the staff role, may be in ticket channels."
      operationId: listDiscordStaffLinks
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStaffLinksResponse"
  /discord/tickets:
    get:
      tags:
      - Discord tickets
      summary: List tickets
      description: "Tickets in the given states, oldest first; without a state the\
        \ pending, open, closing and closed ones. The bot reads them at start to catch\
        \ up."
      operationId: listDiscordTickets
      parameters:
      - name: state
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TicketState"
      responses:
        "200":
          description: The tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketList"
    post:
      tags:
      - Discord tickets
      summary: Open a ticket with a private Ban ID
      description: "The Ban ID is checked exactly like the portal login. A wrong,\
        \ unknown, leaked or already bound Ban ID all answer 404 NOT_ELIGIBLE, so\
        \ the reply is no oracle. An open appeal is reused; otherwise a statement\
        \ (1 to 2000 characters) files one under the portal's rules, and an appeal\
        \ that is not possible yet answers 409 NOT_YET with availableFrom and records\
        \ nothing. The user who already has the ticket gets it again with created\
        \ false. The ticket starts PENDING_CHANNEL; ticket.opened is on the timeline."
      operationId: openDiscordTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketOpenRequest"
        required: true
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketOpened"
        "400":
          description: "Malformed request, or no statement / an invalid statement\
            \ (STATEMENT_REQUIRED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: "NOT_ELIGIBLE: the uniform failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "NOT_YET: the appeal is possible from availableFrom"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}:
    get:
      tags:
      - Discord tickets
      summary: Read a ticket
      operationId: getDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicket"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
    patch:
      tags:
      - Discord tickets
      summary: "Report the channel, change the state or the freeze"
      description: "Reports the channel id (PENDING_CHANNEL becomes OPEN), mirrors\
        \ the freeze, moves the state (OPEN to CLOSING to CLOSED, CLOSED to ARCHIVED,\
        \ ARCHIVED to DELETED) or reports that a person deleted the channel (channelGone).\
        \ ARCHIVED needs a stored protocol and DELETED a current one, both answered\
        \ 409 PROTOCOL_REQUIRED otherwise. Repeating a change that is already true\
        \ is a no-op."
      operationId: patchDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketPatchRequest"
        required: true
      responses:
        "200":
          description: The ticket afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicket"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "INVALID_STATE, PROTOCOL_REQUIRED or CHANNEL_TAKEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/attachments:
    post:
      tags:
      - Discord tickets
      summary: Store a file the channel sent
      description: "Only the bound player and verified staff may send a file; anyone\
        \ else gets 403 FILE_NOT_ACCEPTED. The file goes through the chat pipeline\
        \ (scan, type, size, sanitising) and is stored bound to the case, idempotent\
        \ per Discord attachment id: a replay answers the same attachmentId. The bot\
        \ then ingests the message naming that attachmentId. The Discord id is not\
        \ stored."
      operationId: uploadDiscordTicketAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  nullable: true
                discordAttachmentId:
                  type: string
                authorDiscordUserId:
                  type: string
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The stored file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketAttachment"
        "400":
          description: "A file the pipeline refused (TOO_LARGE, UNSUPPORTED_TYPE,\
            \ INVALID_FILE, FILE_FLAGGED, FILE_ACTIVE_CONTENT) or a malformed request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "403":
          description: "FILE_NOT_ACCEPTED: the author is neither the bound player\
            \ nor verified staff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "QUOTA, or the channel is deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: "The scanner or the store is unavailable: nothing was stored,\
            \ retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/attachments/{attachmentId}:
    get:
      tags:
      - Discord tickets
      summary: Fetch a file of the ticket's case
      description: "A file of a message the player can see, or the image of an active\
        \ share, of this ticket's case. Served with the chat headers (inline only\
        \ for PNG, JPEG and WebP; nosniff; sandbox; no-store). Anything else is 404."
      operationId: getDiscordTicketAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown ticket or file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/close:
    post:
      tags:
      - Discord tickets
      summary: Close with the completeness proof
      description: "Accepted only when count and lastMessageId equal the backend's\
        \ own tally of the channel's messages: records ticket.transcript_complete\
        \ and, in the same request, generates and stores the protocol, answering its\
        \ version. A mismatch answers 409 TRANSCRIPT_MISMATCH and records nothing.\
        \ 503 when the protocol could not be stored (the event stays; repeat the call,\
        \ it is idempotent). protocolVersion is null while the appeal is undecided:\
        \ do not archive then."
      operationId: closeDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketCloseRequest"
        required: true
      responses:
        "200":
          description: The transcript is complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketClosed"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: TRANSCRIPT_MISMATCH (with the backend's tally) or INVALID_STATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The protocol could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/links:
    post:
      tags:
      - Discord tickets
      summary: Report a relay
      description: "Advances the ticket's relayed_seq to at least seq and, for a posted\
        \ message, links the case message to the Discord message. The cursor only\
        \ moves forward; linking twice changes nothing."
      operationId: linkDiscordTicketMessage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketLinkRequest"
        required: true
      responses:
        "200":
          description: The cursor afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketLinked"
        "400":
          description: Half a link or a malformed id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/messages:
    post:
      tags:
      - Discord tickets
      summary: Ingest the messages of the channel
      description: "Records what was written in the channel, idempotent by Discord\
        \ message id: a new message becomes message.added (channel DISCORD, the Discord\
        \ timestamp as time), a known one with a different text message.edited, a\
        \ reported deletion message.deleted (contentUnavailable when it was never\
        \ recorded). With complete true and presentMessageIds, recorded messages missing\
        \ from the channel are recorded as deleted (detectedAtCatchup). Never post\
        \ the bot's own messages."
      operationId: ingestDiscordTicketMessages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordIngestRequest"
        required: true
      responses:
        "200":
          description: What was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordIngestResult"
        "400":
          description: Malformed batch (nothing was recorded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: The channel is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/outbox:
    get:
      tags:
      - Discord tickets
      summary: Events to relay into the channel
      description: "The player-visible events of the case after afterSeq (the ticket's\
        \ relayed_seq when omitted), with their text, in order. A message written\
        \ in Discord is never in it. Acknowledge each with POST .../links."
      operationId: getDiscordTicketOutbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: afterSeq
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordOutbox"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/protocol/ensure:
    post:
      tags:
      - Discord tickets
      summary: Make sure the protocol is current
      description: "Regenerates the protocol when the conversation changed since the\
        \ stored version (forced, no settle delay) and answers the current version.\
        \ Call it before deleting a channel; the delete is refused with 409 PROTOCOL_REQUIRED\
        \ otherwise."
      operationId: ensureDiscordTicketProtocol
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketProtocolEnsured"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "PROTOCOL_REQUIRED: the appeal is undecided or the transcript\
            \ is not verified complete"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The protocol could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /elo/chat:
    post:
      tags:
      - Elo
      summary: Score a chat message for toxicity
      description: "Scores a chat message; if flagged, records evidence (a hash, never\
        \ the raw text) and applies a delta in the configured chat section"
      operationId: submitChatSignal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloChatSignalRequest"
        required: true
      responses:
        "200":
          description: Scoring result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloChatSignalResponse"
  /elo/{owner}:
    get:
      tags:
      - Elo
      summary: Get a player's current ELO standing
      description: The player's score in every enabled section with that section's
        thresholds. A section the player was never scored in reports its base score.
      operationId: getEloProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current ELO standing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloProfileResponse"
  /elo/{owner}/adjust:
    post:
      tags:
      - Elo
      summary: Adjust a player's score by hand
      description: "Applies a signed delta to the player's score in one section, recorded\
        \ as a MANUAL_ADJUSTMENT and subject to the same soft and permanent threshold\
        \ rules as any other delta. The adjusting staff member is the caller of the\
        \ token."
      operationId: adjustElo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloAdjustRequest"
        required: true
      responses:
        "200":
          description: The score change and any automatic punishment it caused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloAdjustResponse"
        "400":
          description: Invalid adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "404":
          description: Unknown section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "409":
          description: The section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
  /elo/{owner}/history:
    get:
      tags:
      - Elo
      summary: Get a player's ELO history
      description: "The audit trail of ELO changes for this owner, optionally restricted\
        \ to one section"
      operationId: getEloHistory
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: section
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated ELO event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloEventResponse"
  /evasion/fingerprint:
    post:
      tags:
      - Evasion
      summary: Submit the client traits of a player for the client fingerprint
      description: "The proxy sends the brand, the registered plugin channels and\
        \ the legacy mod list. The backend hashes them with its own fingerprint key\
        \ and stores only the keyed hash with the hashed owner; the raw values are\
        \ never stored, logged or returned. Generic traits (plain vanilla, fabric,\
        \ forge, neoforge) are not stored. Proxy tokens only."
      operationId: submitClientFingerprint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFingerprintCreateRequest"
        required: true
      responses:
        "200":
          description: Processed; stored is false for generic traits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintResponse"
        "400":
          description: "Malformed owner, oversized brand or list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintError"
        "503":
          description: BLACKHOLE_FINGERPRINT_KEY is not configured - client fingerprinting
            is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintError"
  /evasion/record:
    post:
      tags:
      - Evasion
      summary: Record a login sighting for ban-evasion detection
      description: Computes a keyed hash of the IP (never stores it raw) and checks
        whether multiple distinct owners share it recently
      operationId: recordEvasionSighting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvasionRecordDTO"
        required: true
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
        "503":
          description: blackhole.evasion.ip-salt is not configured - evasion detection
            is disabled
  /evasion/{owner}/sightings:
    get:
      tags:
      - Evasion
      summary: List evasion sightings for a player
      description: "The other owners that shared a hashed network address with this\
        \ owner inside the detection window. Only owner hashes are returned, never\
        \ an IP or its token."
      operationId: listEvasionSightings
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The linked owners, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvasionSightingsResponse"
        "400":
          description: The owner is not a 128 character hex hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvasionSightingsError"
  /evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of an owner
      description: "Lists every evidence item of an owner hash, for data-subject access\
        \ requests. Lifted and revoked evidence is hidden unless includeInactive is\
        \ true; asking for it is audited."
      operationId: listOwnerEvidence
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    post:
      tags:
      - Evidence
      summary: Attach evidence
      description: "Attaches an anticheat record, chat excerpt, replay link or other\
        \ link to a punishment, given by its identifier or short id, or sent ahead\
        \ of the punishment under an owner hash and a correlation id (pass the same\
        \ id as evidenceCorrelationId when applying the punishment). Files go through\
        \ /evidence/file."
      operationId: attachEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceCreateRequest"
        required: true
      responses:
        "200":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: "Invalid request, target or payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: The payload is larger than the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: The payload contains personal data (a UUID or IP address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/file:
    post:
      tags:
      - Evidence
      summary: Upload an evidence file
      description: "Uploads a screenshot (PNG, JPEG) or video (MP4, WebM) as multipart\
        \ form data. Send the text fields (punishment, or owner and correlationId;\
        \ sourceSystem; capturedAt; description; onBehalfOf) before the file part.\
        \ The type is detected from the file's bytes, images are re-encoded without\
        \ metadata, and the file is virus scanned before it is stored."
      operationId: uploadEvidenceFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                punishment:
                  type: string
                  nullable: true
                owner:
                  type: string
                  nullable: true
                correlationId:
                  type: string
                  nullable: true
                sourceSystem:
                  type: string
                  nullable: true
                capturedAt:
                  type: integer
                  format: int64
                  nullable: true
                description:
                  type: string
                  nullable: true
                onBehalfOf:
                  type: string
                  format: uuid
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: Invalid request or target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit for its type, or has too\
            \ many pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: The file's detected type is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "The virus scanner flagged the file, or it is not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/owner/{owner}:
    delete:
      tags:
      - Evidence
      summary: Delete all evidence of an owner
      description: Deletes every evidence item and file of an owner hash (data-subject
        erasure). Same required reason and per-item audit as deleting one item.
      operationId: deleteOwnerEvidence
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted; the count may be zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: "The reason is missing or invalid, or the owner is not a hash;\
            \ nothing was deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; deletion stopped at the first
            file it could not delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}:
    get:
      tags:
      - Evidence
      summary: Get one evidence item
      description: "The metadata and payload of one evidence item, whatever its status."
      operationId: getEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    delete:
      tags:
      - Evidence
      summary: Delete an evidence item
      description: "Deletes one item and its file. A reason (ERASURE_REQUEST, WRONG_EVIDENCE,\
        \ OTHER) is required and recorded, with the optional note, in the audit trail.\
        \ Nothing is erased automatically for data-subject requests: the operator\
        \ decides each one."
      operationId: deleteEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: The reason is missing or invalid; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; the item was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}/content:
    get:
      tags:
      - Evidence
      summary: Download an evidence file
      description: "Streams the stored file through the backend (there are no presigned\
        \ links). Supports a single HTTP Range so videos can be scrubbed. Sent with\
        \ nosniff, a sandboxing Content-Security-Policy and no-store; images and videos\
        \ are served inline, so the type is the detected one."
      operationId: downloadEvidenceFile
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Unknown evidence, or it has no file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "416":
          description: The range starts behind the end of the file
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /inbox:
    get:
      tags:
      - Inbox
      summary: Inbox
      description: "What needs attention: appeal chats awaiting a team reply, open appeals,\
        \ open reports and open cases without an assignee. Each section has its count\
        \ and its oldest 10 items."
      operationId: getInbox
      responses:
        "200":
          description: The four sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "503":
          description: The inbox could not be read; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxError"
  /kick:
    post:
      tags:
      - Kick
      summary: Kick a player
      description: "Takes one player off the network, a server or a section and records\
        \ it as a KICK in the player's history. A kick is a moment, not a sanction:\
        \ it is never active, cannot be undone, and counts as an earlier step for\
        \ escalation. The request answers at once; nothing is delivered yet. The proxies\
        \ are told over the event bus and report back, so poll GET /kick/{id} for\
        \ PENDING, DELIVERED, NOT_ON_TARGET or NOT_ONLINE. The Idempotency-Key header\
        \ is required and derives the kick: a repeat answers the same kick with repeated\
        \ true and writes nothing. A player who is permanently banned in the target\
        \ section is kicked all the same; the answer carries a warning and the ban\
        \ is unchanged. The staff member is the caller of the token."
      operationId: kickPlayer
      parameters:
      - name: Idempotency-Key
        in: header
        description: "1 to 80 characters of letters, digits, '.', '_', ':' and '-';\
          \ required"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KickCreateRequest"
        required: true
      responses:
        "202":
          description: The kick was written and the proxies were told
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickAccepted"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, reason 1 to\
            \ 200 characters without a UUID, IP address or Ban ID, Idempotency-Key\
            \ missing or malformed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
        "409":
          description: "The target section is disabled, or the Idempotency-Key was\
            \ already used for a different kick"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
        "422":
          description: "KICK_TARGET_INVALID: a scoped kick without a target, a target\
            \ that is no server name or section, or a target on a network kick"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"

  /kick/mass:
    post:
      tags:
      - Kick
      summary: Kick everybody from a server or section
      description: "One audited admin action. It writes a single record and no punishment,\
        \ case or ELO for any player. The proxies are told over the event bus; poll\
        \ GET /kick/{id} for DELIVERED with deliveredCount, or NO_PROXY_ANSWER once\
        \ the deadline passed. The Idempotency-Key header is required."
      operationId: kickMass
      parameters:
      - name: Idempotency-Key
        in: header
        description: "1 to 80 characters of letters, digits, '.', '_', ':' and '-';\
          \ required"
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KickMassCreateRequest"
        required: true
      responses:
        "202":
          description: The action was written and the proxies were told
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickAccepted"
        "400":
          description: "Invalid request (reason, Idempotency-Key)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
        "409":
          description: "The target section is disabled, or the Idempotency-Key was\
            \ already used for a different action"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
        "422":
          description: "KICK_TARGET_INVALID: the scope is not SERVER or SECTION, or\
            \ the target is missing or unknown"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"

  /kick/{id}:
    get:
      tags:
      - Kick
      summary: Get a kick and how it went
      description: "The status is derived when read: PENDING before the deadline,\
        \ DELIVERED as soon as a proxy reports a move, NOT_ON_TARGET when a proxy\
        \ found the player but not on the target, NOT_ONLINE at or after the deadline\
        \ when no proxy found the player. A mass kick is DELIVERED or, after the deadline\
        \ with no answer, NO_PROXY_ANSWER. The proxy reads the reason here before\
        \ it shows the screen."
      operationId: getKick
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The kick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickResponse"
        "404":
          description: No such kick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
  /kick/{id}/deliveries:
    post:
      tags:
      - Kick
      summary: Report what a proxy did about a kick
      description: "Called by a proxy after it acted on the kick event, or found nothing\
        \ to act on. Idempotent per kick and proxy: answering again keeps one record.\
        \ Only the proxy may call it."
      operationId: acknowledgeKick
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KickAck"
        required: true
      responses:
        "204":
          description: Stored
        "400":
          description: Invalid proxyId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"
        "404":
          description: No such kick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickError"

  /player-discord-link/code:
    post:
      tags:
      - Discord link
      summary: Issue a Discord link code for a player
      description: "Called by the Velocity proxy only. Issues a short-lived, single-use\
        \ code for the player identified by the hashed owner, to type as /link in\
        \ Discord. A new code replaces the player's previous one. The code is stored\
        \ only as a hash."
      operationId: issuePlayerDiscordLinkCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLinkPlayerCodeRequest"
        required: true
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkCodeResponse"
        "400":
          description: The owner is missing or not a sha-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /player/resolve/{name}:
    get:
      tags:
      - Player
      description: "Resolve a player name to a UUID via the configured resolver chain\
        \ (Otis, Mojang, NameMC)"
      operationId: resolvePlayer
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The player was resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveResponse"
        "404":
          description: No resolver could find a player with that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveError"
  /profile:
    get:
      tags:
      - PunishProfile
      description: Get all existing punishment profiles
      operationId: getProfiles
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishProfileResponse"
    post:
      tags:
      - PunishProfile
      description: Add a new profile for punishments
      operationId: addProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The profile which was added to the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /profile/delete/{owner}:
    delete:
      tags:
      - PunishProfile
      description: Delete a punish profile via uuid
      operationId: removeProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The deleted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/update/{owner}:
    post:
      tags:
      - PunishProfile
      description: Update a punishment profile
      operationId: updateProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}:
    get:
      tags:
      - PunishProfile
      description: Get a profile by id
      operationId: getById
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The profile which matches with the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileDTO"
        "404":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}/session:
    post:
      tags:
      - PunishProfile
      description: Records session telemetry (protocol version / client brand) for
        the dashboard
      operationId: updateSessionInfo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInfoDTO"
        required: true
      responses:
        "200":
          description: Session info recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /public/appeal:
    get:
      tags:
      - Public
      summary: The appeal
      description: "The open appeal, else the latest: status, decision and, for a\
        \ shortened punishment, the new expiry. The internal decision note is never\
        \ returned. Not for a leaked Ban ID (403)."
      operationId: publicAppeal
      responses:
        "200":
          description: The appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppeal"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NO_APPEAL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    post:
      tags:
      - Public
      summary: File the appeal
      description: "Files the appeal with a statement of 1 to 2000 characters through\
        \ the eligibility checklist. An appeal that is not eligible is not recorded:\
        \ 409 NOT_ELIGIBLE (with availableFrom when the player only has to wait),\
        \ FORFEITED or FROZEN after a leak. conditionsVersion must be the current\
        \ version of the appeal conditions, else 409 CONDITIONS_CHANGED. At most one\
        \ appeal is open."
      operationId: publicFileAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAppealRequest"
        required: true
      responses:
        "200":
          description: The filed appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppeal"
        "400":
          description: "The statement is empty, too long or has control characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "409":
          description: "FORFEITED, FROZEN, NOT_ELIGIBLE or CONDITIONS_CHANGED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "The statement looks like a UUID, an IP address or a Ban ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/appeal/conditions:
    get:
      tags:
      - Public
      summary: The appeal conditions
      description: "The current appeal conditions: a version number and a plain text.\
        \ The player confirms them before filing and sends the version back as conditionsVersion;\
        \ a changed version answers 409 CONDITIONS_CHANGED. Any session scope may\
        \ read them."
      operationId: publicAppealConditions
      responses:
        "200":
          description: The current conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppealConditions"
        "401":
          description: The session is missing or expired
  /public/appeal/protocol:
    get:
      tags:
      - Public
      summary: The appeal protocol
      description: "The player's own copy of the conversation of a decided appeal,\
        \ rendered on demand from the same player-visible entries as the conversation\
        \ (you, the moderation team, the system; no staff names, no staff-only entries),\
        \ as a text or JSON attachment. Not for a leaked Ban ID (403); 409 NOT_DECIDED\
        \ while no appeal is decided."
      operationId: publicAppealProtocol
      parameters:
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: "The file (Content-Disposition: attachment, Cache-Control:\
            \ no-store)"
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NOT_DECIDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/attachments:
    post:
      tags:
      - Public
      summary: Upload a chat file
      description: "Stages one file for the open appeal (PNG, JPEG, WebP, PDF or UTF-8\
        \ text, at most 10 MiB) as multipart form data. The type comes from the bytes,\
        \ the file is scanned before it is stored, and images lose their metadata.\
        \ The answer holds the attachmentId to send in attachmentIds of POST /public/messages.\
        \ A staged file is visible to nobody until a message names it; an unsent one\
        \ is removed after the pending lifetime."
      operationId: publicUploadAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The file was staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAttachmentStaged"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NO_APPEAL or QUOTA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "413":
          description: TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "415":
          description: UNSUPPORTED_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "FILE_FLAGGED, FILE_ACTIVE_CONTENT or INVALID_FILE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the scanner or the store cannot answer; nothing\
            \ was stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/attachments/{id}:
    get:
      tags:
      - Public
      summary: Download a chat file
      description: "The file of a message of this conversation (the attachmentId)\
        \ or the image of an active share (the shareId). Images are inline; every\
        \ other file is an attachment. Another punishment's id, a removed message,\
        \ a withdrawn share and an unknown id all answer 404."
      operationId: publicDownloadAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The file (X-Content-Type-Options: nosniff, Content-Security-Policy:\
            \ sandbox, Cache-Control: private, no-store)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    delete:
      tags:
      - Public
      summary: Remove a staged chat file
      description: Removes a file of the open appeal that no message has sent yet.
        A sent file is not found here.
      operationId: publicDeleteAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The staged file was removed
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "200":
          description: publicDeleteAttachment 200 response
          content:
            application/json:
              schema:
                type: object
  /public/conversation:
    get:
      tags:
      - Public
      summary: The conversation
      description: "The entries the player may see, after the seq cursor: player-visible\
        \ messages (edits folded into the current text, deleted ones marked removed)\
        \ and the markers APPEAL_FILED, APPEAL_DECIDED, FROZEN and FORFEITED. No staff\
        \ names and no staff-only entries. Not for a leaked Ban ID (403)."
      operationId: publicConversation
      parameters:
      - name: cursor
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConversation"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/conversation/events:
    get:
      tags:
      - Public
      summary: Live updates of the conversation
      description: "A text/event-stream: retry (once), ready {\"seq\"} on connect,\
        \ changed {\"seq\"} (id = seq) after every change the player may read, expired\
        \ {} and then the end when the session ends, replaced {} when another stream\
        \ of the same session opens, and a keep-alive comment every 15 seconds. No\
        \ text, name or file name is ever sent: after a changed event the client reads\
        \ GET /public/conversation with its cursor. Last-Event-ID below the current\
        \ seq gets a changed right after ready. One stream per session; the stream\
        \ ends after its maximum lifetime and the client reconnects."
      operationId: publicConversationEvents
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the replica holds its maximum of streams; poll\
            \ instead"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/messages:
    post:
      tags:
      - Public
      summary: Post a message
      description: Adds a message of 1 to 2000 characters to the open appeal. The
        optional Idempotency-Key makes a double submit a no-op. 409 NO_APPEAL (nothing
        is open) or FROZEN (the Ban ID is marked leaked).
      operationId: publicPostMessage
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicMessageRequest"
        required: true
      responses:
        "200":
          description: "The message was stored (repeated: true when the key had posted\
            \ it before)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMessage"
        "400":
          description: "The text is empty, too long or has control characters, or\
            \ the key is malformed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "409":
          description: NO_APPEAL or FROZEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "The text looks like a UUID, an IP address or a Ban ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/punishment:
    get:
      tags:
      - Public
      summary: The facts of the punishment
      description: "An allow-list: reference, type, reason, section, times, state,\
        \ evidence count and the appeal summary. Never an owner hash, a staff name,\
        \ an ELO value, a note or evidence content. Works for every scope."
      operationId: publicPunishment
      responses:
        "200":
          description: The facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPunishment"
        "401":
          description: The session is missing or expired
  /public/session:
    get:
      tags:
      - Public
      summary: Read the session
      description: "The CSRF value, the absolute expiry and the scope of the session\
        \ behind the token."
      operationId: publicSession
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSession"
        "401":
          description: The session is missing or expired
    post:
      tags:
      - Public
      summary: Log in with the Ban ID
      description: "Creates a player session for the Ban ID in the body. A wrong,\
        \ unknown, malformed or not yet issued Ban ID all answer 401 INVALID_BAN_ID\
        \ with the same body. A Ban ID that staff marked leaked logs in with scope\
        \ LIMITED. The token is returned once and only its hash is stored."
      operationId: publicLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLoginRequest"
        required: true
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLogin"
        "401":
          description: "INVALID_BAN_ID, always the same"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    delete:
      tags:
      - Public
      summary: Log out
      description: Deletes the session; the token stops working at once.
      operationId: publicLogout
      responses:
        "204":
          description: The session is gone
        "401":
          description: The session is missing or expired
        "200":
          description: publicLogout 200 response
          content:
            application/json:
              schema:
                type: object
  /punishment:
    get:
      tags:
      - Punishment
      summary: Get all punishments
      description: Retrieves a paginated list of all punishment entries in the system
      operationId: getPunishments
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
  /punishment/active:
    get:
      tags:
      - Punishment
      summary: List active punishments across players
      description: "Lists every punishment that currently holds a player's active\
        \ slot and has not ended, newest first by default. Every filter is optional.\
        \ kind is MUTE, BAN or SERVER; section is a section key (a CloudNet target\
        \ section is a SERVER section whose targetKind is CLOUDNET_TASK, CLOUDNET_GROUP\
        \ or CLOUDNET_SERVICE); permanent selects permanent or temporary punishments;\
        \ expiresBefore (epoch milliseconds) keeps temporary punishments that end\
        \ before it; automatic selects those the ELO system applied; actor is the\
        \ staff member's oid. sort is CREATED or EXPIRES (a permanent punishment sorts\
        \ as the latest), direction ASC or DESC. Players appear as their hashed owner\
        \ only; no raw UUID, IP address or ban ID is returned."
      operationId: listActivePunishments
      parameters:
      - name: kind
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EnforcementKind"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: targetKind
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ServerTargetKind"
      - name: permanent
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      - name: expiresBefore
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: automatic
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      - name: actor
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: sort
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ActivePunishmentSort"
      - name: direction
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/SortDirection"
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: One page of active punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePunishmentPage"
        "400":
          description: A filter or the page is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePunishmentError"
  /punishment/apply:
    post:
      tags:
      - Punishment
      summary: Apply a punishment template
      description: "Applies a template to a player: creates a temporary punishment\
        \ in the template's section with the duration and ELO cost of the escalation\
        \ step the player has reached, deducts the cost, and reports the step, the\
        \ score before and after, and any permanent escalation it caused. The staff\
        \ member is the caller of the token; only the proxy may send onBehalfOf (the\
        \ in-game staff member's UUID)."
      operationId: applyPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: Punishment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentApplyResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/lookup:
    post:
      tags:
      - Punishment
      summary: Find a punishment by Ban ID
      description: "Finds the punishment a Ban ID belongs to. The Ban ID is a credential,\
        \ so it goes in the request body and never in a URL or query. Anything that\
        \ matches nothing, malformed or unknown, answers the same 404 without the\
        \ input in it. The response is never cacheable (Cache-Control: no-store)."
      operationId: findPunishmentByBanId
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentLookupRequest"
        required: true
      responses:
        "200":
          description: The punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentLookupResponse"
        "404":
          description: No punishment has this Ban ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/preview:
    post:
      tags:
      - Punishment
      summary: Preview applying a template
      description: "Answers what applying the template would do right now - the escalation\
        \ step, its cost, the resulting score and whether the player would be punished\
        \ permanently - without changing anything. Takes the same request as /punishment/apply\
        \ and fails with the same errors."
      operationId: previewPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: What applying the template would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentPreviewResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/revoke:
    post:
      tags:
      - Punishment
      summary: Revoke the active punishment of a section
      description: Moves the player's active punishment in the section into history.
        Revoking a permanent punishment resets the player's score in that section
        to the section's pardon score.
      operationId: revokePunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentRevokeRequest"
        required: true
      responses:
        "200":
          description: Punishment revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentRevokeResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, onBehalfOf\
            \ from a caller that is not the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: The player has no active punishment in that section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/short/{shortId}:
    get:
      tags:
      - Punishment
      summary: Find punishments by short ID
      description: "Finds the punishments whose short ID (the # and eight hex characters\
        \ players are shown, e.g. #A1B2C3D4) matches. The # is optional and the case\
        \ is ignored. Short IDs are four bytes and can collide, so the result is a\
        \ list: empty if nothing matches, several if they collide."
      operationId: findPunishmentsByShortId
      parameters:
      - name: shortId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The matching punishments, possibly none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
        "400":
          description: "Not a short ID (exactly eight hex characters, optionally after\
            \ #)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/{reference}/ban-id:
    get:
      tags:
      - Punishment
      summary: Reveal the Ban ID of a punishment
      description: "Returns the current Ban ID of a punishment: the eight character\
        \ credential the player uses for the appeal portal. For moderators and the\
        \ proxy (it shows the value on the ban screen); never cacheable (Cache-Control:\
        \ no-store). The reference is the full identifier, or a legacy short id when\
        \ it is unambiguous. The Ban ID is part of no other response."
      operationId: revealBanId
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The current Ban ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdResponse"
        "404":
          description: "Unknown punishment, or its Ban ID has not been issued yet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
        "503":
          description: The stored Ban ID cannot be read with the configured key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
  /punishment/{reference}/evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of a punishment
      description: "Lists the evidence of a punishment (identifier or short id), oldest\
        \ first. Lifted and revoked evidence is hidden unless includeInactive is true;\
        \ asking for it is audited."
      operationId: listPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /punishment/{reference}/evidence/count:
    get:
      tags:
      - Evidence
      summary: Count the valid evidence of a punishment
      description: "The number of valid evidence items of a punishment: the only thing\
        \ a player may be told. Lifted and revoked evidence is not counted."
      operationId: countPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCount"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /report:
    get:
      tags:
      - Report
      summary: Get all reports
      description: "Retrieves a paginated list of reports. With reportedHash only\
        \ the reports against that player are listed, newest first."
      operationId: getReports
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: reportedHash
        in: query
        description: Only the reports against this player (owner hash)
        required: false
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Successfully retrieved reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDTO"
    post:
      tags:
      - Report
      summary: Submit a report
      description: Submits a player report. Rate-limited per reporterHash within a
        configurable time window.
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestDTO"
        required: true
      responses:
        "200":
          description: Report successfully submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "429":
          description: Rate limit exceeded for this reporter
  /report/feedback/{identifier}/ack:
    post:
      tags:
      - Report
      summary: Acknowledge report feedback
      description: "Deletes a message after it was shown to the reporter. Acknowledging\
        \ an unknown or already deleted message succeeds as well, so the call can\
        \ be repeated safely."
      operationId: acknowledgeReportFeedback
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The message is gone
        "200":
          description: acknowledgeReportFeedback 200 response
  /report/feedback/{owner}:
    get:
      tags:
      - Report
      summary: Get the pending report feedback of a reporter
      description: "Returns the messages that tell the reporter what became of their\
        \ resolved reports and have not expired yet, oldest first. A message says\
        \ whether action was taken, never which punishment."
      operationId: getPendingReportFeedback
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The pending messages, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFeedbackList"
  /report/{identifier}:
    get:
      tags:
      - Report
      summary: Get a report
      description: Retrieves one report by its identifier.
      operationId: getReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /report/{identifier}/resolve:
    post:
      tags:
      - Report
      summary: Resolve a report
      description: "Resolves a report, optionally applying a punishment template to\
        \ the reported player. The resolver and the punishment source are the caller\
        \ of the token."
      operationId: resolveReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolutionDTO"
        required: true
      responses:
        "200":
          description: Report successfully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "400":
          description: "A template was given for a report that is not ACTIONED, or\
            \ the template or its section does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "409":
          description: "The report is already resolved, the template's section is\
            \ disabled, or the player is already permanently punished there"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /section:
    get:
      tags:
      - Section
      summary: List punishment sections
      description: "All sections, enabled or not, sorted by key."
      operationId: listSections
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
    post:
      tags:
      - Section
      summary: Create a punishment section
      description: "Creates an enabled section with its own ELO score, thresholds\
        \ and enforcement kind. A SERVER section lists glob patterns (targetKind PATTERN,\
        \ the default) or exact CloudNet task, group or service names."
      operationId: createSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionCreateRequest"
        required: true
      responses:
        "200":
          description: Section created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "409":
          description: A section with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/update:
    post:
      tags:
      - Section
      summary: Update a punishment section
      description: "Replaces every editable field of an existing section, including\
        \ whether it is enabled."
      operationId: updateSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdateRequest"
        required: true
      responses:
        "200":
          description: Section updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}:
    get:
      tags:
      - Section
      summary: Get a punishment section
      operationId: getSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}/disable:
    post:
      tags:
      - Section
      summary: Disable a punishment section
      description: Rejects new template applications and score deltas for the section.
        Existing active punishments stay enforced until they expire or are lifted.
      operationId: disableSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Section disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /staff-discord-link/code:
    post:
      tags:
      - Discord link
      summary: Issue a Discord link code
      description: "Issues the signed-in staff member a short-lived, single-use code\
        \ (8 characters, shown as ABCD-EFGH) to type as /link in Discord. A new code\
        \ replaces the caller's previous one. Only a signed-in person can link; a\
        \ service principal gets 403. The code is returned only here and stored only\
        \ as a hash."
      operationId: issueStaffDiscordLinkCode
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkCodeResponse"
        "403":
          description: The caller is not a signed-in person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /staff-discord-link/me:
    get:
      tags:
      - Discord link
      summary: Own Discord link status
      description: Whether the caller has a linked Discord account. Never contains
        a code or a Discord id.
      operationId: getOwnStaffDiscordLink
      responses:
        "200":
          description: The link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkStatusResponse"
    delete:
      tags:
      - Discord link
      summary: Unlink own Discord account
      description: Removes the caller's Discord link and with it the stored Discord
        user id.
      operationId: unlinkOwnStaffDiscordLink
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: The caller has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /staff-link/by-minecraft/{uuid}:
    get:
      tags:
      - Staff link
      summary: Who is a Minecraft account
      description: "Called by the Velocity proxy for /blackhole whoami: whether the\
        \ account is linked and to which staff member."
      operationId: lookupStaffLinkByMinecraft
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link status of the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkLookupResponse"
  /staff-link/code:
    post:
      tags:
      - Staff link
      summary: Issue a Minecraft link code
      description: "Issues the signed-in staff member a short-lived, single-use code\
        \ (8 characters, shown as ABCD-EFGH) to type in game with /blackhole link.\
        \ A new code replaces the caller's previous one. Only a signed-in person can\
        \ link; a service principal gets 403. The code is returned only here and stored\
        \ only as a hash."
      operationId: issueStaffLinkCode
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkCodeResponse"
        "403":
          description: The caller is not a signed-in person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/confirm:
    post:
      tags:
      - Staff link
      summary: Confirm a link code
      description: "Called by the Velocity proxy only. Binds the Minecraft UUID in\
        \ onBehalfOf (the player who typed the code) to the staff member the code\
        \ was issued to, replacing any earlier link of either side. A wrong, expired\
        \ or already used code is answered identically with INVALID_CODE."
      operationId: confirmStaffLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLinkConfirmRequest"
        required: true
      responses:
        "200":
          description: The link now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkConfirmResponse"
        "400":
          description: "onBehalfOf is missing, or the code is invalid, expired or\
            \ used (kind INVALID_CODE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
        "409":
          description: A concurrent confirmation took the account; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/me:
    get:
      tags:
      - Staff link
      summary: Own Minecraft link status
      description: Whether the caller has a linked Minecraft account. Never contains
        a code.
      operationId: getOwnStaffLink
      responses:
        "200":
          description: The link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkStatusResponse"
    delete:
      tags:
      - Staff link
      summary: Unlink own Minecraft account
      description: Removes the caller's link. Actions already attributed to the caller
        stay attributed.
      operationId: unlinkOwnStaffLink
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: The caller has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-profile/me:
    get:
      tags:
      - Staff profile
      summary: Own staff profile
      description: The caller's display name and avatar choice. An account without
        a name has none; the name is never copied from the sign-in.
      operationId: getOwnStaffProfile
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileResponse"
        "403":
          description: The caller is a service principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
    put:
      tags:
      - Staff profile
      summary: Save own staff profile
      description: Sets the display name (2 to 32 characters, unique ignoring case,
        no reserved words or markup) and the avatar mode. The staff notice must be
        acknowledged before the first save.
      operationId: saveOwnStaffProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileUpdateRequest"
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileResponse"
        "400":
          description: The avatar mode is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "403":
          description: The caller is a service principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "409":
          description: Another staff member already uses the name (kind NAME_TAKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "422":
          description: The name breaks a rule (NAME_NOT_ALLOWED) or the notice was not
            acknowledged (NOTICE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
  /public/staff-avatar/{avatarKey}:
    get:
      tags:
      - Public
      summary: A staff head
      description: The 64 px head of a linked staff account, by its keyed avatar key.
        The key reveals neither the Minecraft UUID nor the account. Served to players
        through the portal only; cached for a day.
      operationId: getStaffAvatar
      parameters:
      - name: avatarKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The head as PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No head for this key; the client shows initials
  /template:
    get:
      tags:
      - Punishment Templates
      summary: Get all punishment templates
      description: Retrieves a paginated list of all punishment templates in the system
      operationId: getAllTemplates
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplatePage"
    post:
      tags:
      - Punishment Templates
      summary: Create punishment template
      description: Creates a temporary punishment template in a section. The escalation
        group defaults to the key.
      operationId: addTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateCreateRequest"
        required: true
      responses:
        "200":
          description: Template successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: "Invalid template (also when an identifier is supplied, or\
            \ the section is unknown)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: A template with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/delete/{identifier}:
    delete:
      tags:
      - Punishment Templates
      summary: Delete punishment template
      description: Deletes a punishment template by its identifier
      operationId: deleteTemplate
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: At least one punishment still references this template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/update:
    post:
      tags:
      - Punishment Templates
      summary: Update punishment template
      description: Replaces every editable field of an existing template.
      operationId: updateTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateUpdateRequest"
        required: true
      responses:
        "200":
          description: Template successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: Invalid template (also when the identifier is missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: Another template already uses this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/{identifier}:
    get:
      tags:
      - Punishment Templates
      summary: Get punishment template by ID
      description: Retrieves a specific punishment template by its identifier
      operationId: getTemplateById
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
components:
  schemas:
    ActivePunishmentError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    ActivePunishmentItem:
      required:
      - automatic
      - createdAt
      - owner
      - permanent
      - punishmentId
      - section
      - shortId
      type: object
      properties:
        owner:
          type: string
        punishmentId:
          type: string
        shortId:
          type: string
        section:
          type: string
        sectionName:
          type: string
          nullable: true
        kind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EnforcementKind"
        targetKind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ServerTargetKind"
        templateKey:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        automatic:
          type: boolean
        createdAt:
          type: integer
          format: int64
        expiresAt:
          type: integer
          format: int64
          nullable: true
        permanent:
          type: boolean
        caseStatus:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
        actorName:
          type: string
          nullable: true
    ActivePunishmentPage:
      required:
      - items
      - page
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivePunishmentItem"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalSize:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ActivePunishmentSort:
      type: string
      enum:
      - CREATED
      - EXPIRES
    ActorKind:
      type: string
      enum:
      - HUMAN
      - SERVICE
    ActorTrust:
      type: string
      enum:
      - VERIFIED
      - UNVERIFIED
      - SYSTEM
      - PLAYER
    AppealConditions:
      required:
      - createdAt
      - text
      - version
      type: object
      properties:
        version:
          type: integer
          format: int32
        text:
          type: string
        createdAt:
          type: string
    AppealConditionsError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    AppealConditionsRequest:
      type: object
      properties:
        text:
          type: string
          nullable: true
    AppealDTO:
      required:
      - appellantHash
      - createdAt
      - eligibilityCheckResult
      - evidenceCount
      - identifier
      - metaData
      - punishmentIdentifier
      - statement
      - status
      - updatedAt
      - verified
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        punishmentIdentifier:
          type: string
        appellantHash:
          type: string
        statement:
          type: string
        status:
          $ref: "#/components/schemas/AppealStatus"
        eligibilityCheckResult:
          type: object
          additionalProperties:
            type: object
        decidedBy:
          type: string
          format: uuid
          nullable: true
        recordedByOid:
          type: string
          format: uuid
          nullable: true
        verified:
          type: boolean
        decisionNote:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        evidenceCount:
          type: integer
          format: int64
        metaData:
          type: object
          additionalProperties:
            type: object
    AppealReviewDTO:
      required:
      - decision
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/AppealStatus"
        decisionNote:
          maxLength: 2000
          type: string
          nullable: true
        newExpirationAt:
          type: integer
          format: int64
          nullable: true
        playerMessage:
          maxLength: 2000
          minLength: 1
          type: string
          nullable: true
    AppealStatus:
      type: string
      enum:
      - SUBMITTED
      - ELIGIBLE_PENDING_REVIEW
      - IN_REVIEW
      - GRANTED_FULL_LIFT
      - GRANTED_DURATION_REDUCTION
      - DENIED
      - INELIGIBLE
    AppealSubmissionDTO:
      required:
      - appellantHash
      - punishmentIdentifier
      - statement
      type: object
      properties:
        punishmentIdentifier:
          minLength: 1
          type: string
        appellantHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: appellantHash must be a sha-512 hash
        statement:
          maxLength: 2000
          minLength: 1
          type: string
    AuthError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    AuthMeResponse:
      required:
      - oid
      - roles
      type: object
      properties:
        oid:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
    BanIdError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    BanIdLeakReason:
      type: string
      enum:
      - POSTED_PUBLIC
      - SHARED
      - FOUND
      - OTHER
    BanIdReissueReason:
      type: string
      enum:
      - NOT_PLAYERS_FAULT
      - OTHER
      - KEY_ROTATION
    BanIdResponse:
      required:
      - banId
      type: object
      properties:
        banId:
          type: string
    CaseActorInfo:
      required:
      - trust
      type: object
      properties:
        oid:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          nullable: true
        trust:
          $ref: "#/components/schemas/ActorTrust"
    CaseBanIdLeakRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/BanIdLeakReason"
    CaseBanIdLeakResponse:
      required:
      - changed
      type: object
      properties:
        changed:
          type: boolean
    CaseBanIdReissueRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/BanIdReissueReason"
    CaseBanIdReissueResponse:
      required:
      - generation
      type: object
      properties:
        generation:
          type: integer
          format: int32
    CaseConversationError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/CaseErrorKind"
    CaseError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/CaseErrorKind"
    CaseErrorKind:
      type: string
      enum:
      - VALIDATION
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - UNPROCESSABLE
      - UNAVAILABLE
    CaseEventOrigin:
      type: string
      enum:
      - LIVE
      - BACKFILLED
      - RECONSTRUCTED
    CaseListItem:
      required:
      - lastActivityAt
      - priority
      - punishmentCreatedAt
      - punishmentIdentifier
      - punishmentState
      - shortId
      - status
      - tags
      type: object
      properties:
        punishmentIdentifier:
