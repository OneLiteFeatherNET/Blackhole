          $ref: "#/components/schemas/KickStatus"
        deadlineAt:
          type: integer
          description: "when the status stops being `PENDING`, epoch milliseconds"
          format: int64
        warnings:
          type: array
          description: "things staff should know, such as a ban the kick does not\
            \ change"
          items:
            type: string
        repeated:
          type: boolean
          description: "whether the `Idempotency-Key` was already used: nothing was\
            \ written"
      description: "The kick was written and the proxies were told. Nothing is delivered\
        \ yet: poll `GET /kick/{id}`."
