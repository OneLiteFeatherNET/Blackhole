      type: object
      properties:
        proxyId:
          type: string
          description: the configured name of the proxy
        found:
          type: boolean
          description: "whether the player was connected to that proxy (a mass kick:\
            \ whether anybody was on the target)"
        moved:
          type: boolean
          description: "whether the player was moved or disconnected (a mass kick:\
            \ whether at least one player was)"
      description: What one proxy did about a kick.
    KickCreateRequest:
      required:
      - owner
      - reason
      type: object
      properties:
        owner:
          type: string
          description: the hashed player
        scope:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/KickScope"
        target:
          type: string
          description: "the server name or section key for `SERVER` and `SECTION`,\
            \ absent for `NETWORK`"
          nullable: true
        reason:
          type: string
          description: "why, 1 to 200 characters, shown to the player; no UUID, IP\
            \ address or Ban ID"
      description: Kick one player. The `Idempotency-Key` header (not a field) makes
        a repeat answer the same kick.
    KickError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    KickKind:
      type: string
      description: What a kick record is.
      enum:
      - PLAYER
      - MASS
      x-enum-descriptions:
      - "One player, kept as a `KICK` punishment row in that player's history."
      - "Everybody on a server or section: one audited action, no per-player record."
    KickMassCreateRequest:
      required:
      - reason
      - scope
      - target
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/KickScope"
        target:
          type: string
          description: the server name or section key
        reason:
          type: string
          description: "why, 1 to 200 characters; no UUID, IP address or Ban ID"
      description: "Kick everybody from a server or section. One audited action; no\
        \ punishment, case or ELO is written."
    KickResponse:
      required:
      - createdAt
      - deadlineAt
      - deliveredCount
      - id
      - kind
      - reason
      - scope
      - status
      type: object
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/KickKind"
        owner:
          type: string
          description: the hashed player; absent for a mass kick
          nullable: true
        scope:
          $ref: "#/components/schemas/KickScope"
        target:
          type: string
          description: the server or section; absent for a network kick
          nullable: true
        reason:
          type: string
        actor:
          type: string
          description: "the display name of the staff member, if known"
          nullable: true
        createdAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/KickStatus"
        deliveredCount:
          type: integer
          description: how many proxies delivered the kick
          format: int32
        deadlineAt:
          type: integer
          description: "when the status stops being `PENDING`, epoch milliseconds"
          format: int64
      description: A kick and how it went so far.
    KickScope:
      type: string
      description: Where a kick takes the player from.
      enum:
      - NETWORK
      - SERVER
      - SECTION
      x-enum-descriptions:
      - Off the whole network. The default when a request names no scope.
      - Off one backend server.
      - Off every server a section covers.
    KickStatus:
      type: string
      description: "How a kick went. Never stored: it is derived each time the kick\
        \ is read from the deadline, the current time and the acknowledgements the\
        \ proxies stored, so #NOT_ONLINE can never appear before the deadline and\
        \ two backend replicas always agree."
      enum:
      - PENDING
      - DELIVERED
      - NOT_ON_TARGET
      - NOT_ONLINE
      - NO_PROXY_ANSWER
      x-enum-descriptions:
      - No proxy has found the player yet and the deadline has not passed.
      - "At least one proxy moved the player (a mass kick: at least one proxy answered,\
        \ or moved players)."
      - "A proxy found the player, but not on the target, so nothing was moved."
      - The deadline passed and no proxy found the player. Not proof that the player
        is offline.
      - A mass kick whose deadline passed with no proxy answering at all.
