      - STAFF_PROFILE_REQUIRED
      - UNAVAILABLE
      x-enum-descriptions:
      - The request is malformed or breaks a rule of its own (400).
      - The caller may not do this to this note (403).
      - "The punishment, case or note does not exist (404)."
      - "The case changed since the caller read it, a short id is ambiguous, or the\
        \ note is redacted (409)."
      - "The request is understood but names something unknown, such as an assignee\
        \ who is no staff member (422)."
      - "The staff account has no display name yet, so nothing it writes may reach\
        \ a player (409)."
      - "Something the request needs cannot be produced right now, such as a free\
        \ Ban ID candidate (503)."
