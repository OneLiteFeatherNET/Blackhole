        screen for each one. A DENY without a reason is read as a VPN policy refusal
        by proxies that predate this field.
      enum:
      - VPN_POLICY
      - AREA_BAN
      - GUARD_STRICT
      - GUARD_LOCKDOWN
      x-enum-descriptions:
      - The VPN or hosting policy of the classification refused the address.
      - An active area ban covers the login's ASN or country.
      - "The join guard is STRICT or LOCKDOWN and the address is a VPN, hosting or\
        \ proxy address."
      - The join guard is LOCKDOWN and the owner is not a known player.
