      type: object
      properties:
        detectionEnabled:
          type: boolean
          description: "False when blackhole.evasion.ip-salt is unset: nothing is\
            \ recorded, so an empty list means nothing"
        windowDays:
          type: integer
          description: Length of the detection window in days; only sightings inside
            it are correlated
          format: int32
        linkedOwners:
          type: array
          description: "Linked owners, most recently seen first, at most 50"
          items:
            $ref: "#/components/schemas/EvasionLinkedOwner"
        truncated:
          type: boolean
          description: True when more owners matched than are listed
        clientFingerprintEnabled:
          type: boolean
          description: "False when BLACKHOLE_FINGERPRINT_KEY is unset outside dev\
            \ and test: no client fingerprint is recorded or compared"
        clientWindowDays:
          type: integer
          description: Length of the client fingerprint window in days
          format: int32
    EvidenceCount:
