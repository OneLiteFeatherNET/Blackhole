          $ref: "#/components/schemas/EnforcementKind"
        score:
          type: integer
          format: int32
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
      description: "One section's score of a player, with the thresholds that decide\
        \ what happens when it drops."
    EnforcementKind:
      type: string
      description: "How a section's punishments are enforced. The kinds are an enum,\
        \ not data, because the proxy has to implement each of them: a new section\
        \ of an existing kind needs no code change, a new kind does."
      enum:
      - MUTE
      - BAN
      - SERVER
      x-enum-descriptions:
      - The player cannot chat.
      - The player cannot join the network.
      - The player cannot connect to backend servers matching the section's patterns.
    ErrorKind:
      type: string
      description: "Why an expected failure happened, carried by a resource's `Error`\
        \ variant so a controller can map it 1:1 to a status without re-deriving the\
        \ cause."
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - UNAUTHORIZED
      - FORBIDDEN
      - INVALID_CODE
      - UNAVAILABLE
      - NAME_NOT_ALLOWED
      - NOTICE_REQUIRED
      - NAME_TAKEN
      - STAFF_PROFILE_REQUIRED
      - KICK_TARGET_INVALID
      - WARN_STEP_REQUIRED
      - ROLLBACK_SELECTOR_INVALID
      - ROLLBACK_TOO_LARGE
      - FORBIDDEN_POLICY
      - FORBIDDEN_DURATION
      - TARGET_EXEMPT
      - FORBIDDEN_KIND
      - IP_BAN_NOT_ALLOWED
      x-enum-descriptions:
      - The request is malformed or breaks a business rule of its own (400).
      - The addressed resource does not exist (404).
      - The request is valid but conflicts with current state (409).
      - The caller's credentials do not identify them well enough for this request
        (401).
      - The caller is identified but may not do this (403).
      - "A staff link code is wrong, expired or already used; deliberately one answer\
        \ for all three (400)."
      - "A dependency the request needs, such as the shared cache, is down; the caller\
        \ may retry (503)."
      - A staff display name breaks a rule of its own (422).
      - The staff notice was not acknowledged before the display name was saved (422).
      - "Another staff member already uses this display name, ignoring case and normalisation\
        \ (409)."
      - A staff account without a display name may not write anything a player can
        see (409).
      - "A kick's scope and target do not fit: a scoped kick without a target, a target\
        \ that is no server or section (422)."
      - "A warning was asked for, but the template's ladder reached a step that is\
        \ not a warning (422)."
      - "A rollback's selector is not a human staff actor, such as the proxy's service\
        \ principal (400)."
      - A rollback's preview matches more punishments than the configured maximum;
        narrow the window (422).
      - Only an admin may set a login policy to DENY (403).
      - Only an admin may exempt a player for good; a moderator's exemption is at
        most 90 days (403).
      - The player is exempt from punishment and the actor's rank does not outrank
        the exemption (409).
      - Only an admin may ban a country; a moderator may ban one ASN for up to seven
        days (403).
      - "An IP ban names a range that may not be banned: too wide, or protected (422)."
    ErrorResponse:
      type: object
      properties:
        The error message:
          type: string
          description: the error message
      description: The error response when something went wrong on profile requests
    EvasionLinkedOwner:
