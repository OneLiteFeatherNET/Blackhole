          nullable: true
        status:
          type: string
          description: "OPEN, UNDER_REVIEW, ACTIONED or DISMISSED"
        createdAt:
          type: integer
          description: epoch millis
          format: int64
        updatedAt:
          type: integer
          description: epoch millis
          format: int64
    DiscordStaffLink:
