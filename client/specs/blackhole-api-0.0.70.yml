        servers:
          type: array
          nullable: true
          items:
            type: string
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        softDuration:
          type: string
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
        permanentReason:
          minLength: 1
          type: string
        decayPerDay:
          type: integer
          format: int32
          nullable: true
    SectionError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    SectionResponse:
      required:
      - baseScore
      - decayPerDay
      - displayName
      - enabled
      - enforcement
      - key
      - pardonScore
      - permanentReason
      - permanentThreshold
      - servers
      - targetKind
      type: object
      properties:
        key:
          type: string
        displayName:
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        targetKind:
          $ref: "#/components/schemas/ServerTargetKind"
        servers:
          type: array
          items:
            type: string
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        softDuration:
          type: string
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
        permanentReason:
          type: string
        decayPerDay:
          type: integer
          format: int32
        enabled:
          type: boolean
    SectionUpdateRequest:
      required:
      - baseScore
      - decayPerDay
      - displayName
      - enabled
      - enforcement
      - key
      - pardonScore
      - permanentReason
      - permanentThreshold
      type: object
      properties:
        key:
          minLength: 1
          type: string
        displayName:
          minLength: 1
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        targetKind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ServerTargetKind"
        servers:
          type: array
          nullable: true
          items:
            type: string
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        softDuration:
          type: string
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
        permanentReason:
          minLength: 1
          type: string
        decayPerDay:
          type: integer
          format: int32
        enabled:
          type: boolean
    ServerTargetKind:
      type: string
      description: "What the entries of a SERVER section's `servers` list mean. Stored\
        \ as a string; the allowed values are enforced here, not by the database."
      enum:
      - PATTERN
      - CLOUDNET_TASK
      - CLOUDNET_GROUP
      - CLOUDNET_SERVICE
      x-enum-descriptions:
      - "Glob patterns over the Velocity server name (the default, and what every\
        \ older section is)."
      - Exact names of CloudNet tasks.
      - Exact names of CloudNet groups.
      - Exact names of CloudNet services (a service name can belong to another instance
        after a restart).
    SessionError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    SessionInfoDTO:
      required:
      - owner
      type: object
      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        protocolVersion:
          type: integer
          format: int32
          nullable: true
        clientBrand:
          maxLength: 64
          type: string
          nullable: true
      description: "Session telemetry captured at login/brand-negotiation time (Phase\
        \ 7's dashboard enrichment). Both fields are optional and merged, not overwritten,\
        \ into the profile's existing session info - `protocolVersion` arrives at\
        \ login, `clientBrand` arrives slightly later as a separate plugin-channel\
        \ negotiation, so a single caller rarely has both at once."
    SessionOutcome:
      type: string
      description: Whether the ban check let the login through.
      enum:
      - ALLOWED
      - DENIED
    SessionPage:
      required:
      - hasMore
      - page
      - sessions
      - size
      type: object
      properties:
        sessions:
          type: array
          description: the sessions on this page
          items:
            $ref: "#/components/schemas/SessionResponse"
        page:
          type: integer
          description: the zero-based page
          format: int32
        size:
          type: integer
          description: the page size
          format: int32
        hasMore:
          type: boolean
          description: whether a next page exists
      description: "One page of a player's sessions, newest first."
    SessionResponse:
      required:
      - ip
      - outcome
      - owner
      - playerName
      - playerUuid
      - sessionId
      - startedAt
      type: object
      properties:
        sessionId:
          type: string
        owner:
          type: string
        playerUuid:
          type: string
        playerName:
          type: string
        ip:
          type: string
        asn:
          type: integer
          format: int64
          nullable: true
        asOrg:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        clientBrand:
          type: string
          nullable: true
        clientVersion:
          type: string
          nullable: true
        protocolVersion:
          type: integer
          format: int32
          nullable: true
        virtualHost:
          type: string
          nullable: true
        outcome:
          $ref: "#/components/schemas/SessionOutcome"
        startedAt:
          type: integer
          format: int64
        endedAt:
          type: integer
          format: int64
          nullable: true
      description: One stored session.
    SessionStartRequest:
      required:
      - ip
      - outcome
      - owner
      - playerName
      - playerUuid
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
          description: the proxy's random UUID for this connection; the repeat key
            of the report
        owner:
          type: string
          description: "the hashed player, 128 hex characters"
        playerUuid:
          type: string
          description: the player's raw UUID
        playerName:
          type: string
          description: "the name seen at login, 1 to 16 characters"
        ip:
          type: string
          description: "the client's IPv4 or IPv6 address, as written"
        protocolVersion:
          type: integer
          description: "the protocol version the client connected with, when known"
          format: int32
          nullable: true
        virtualHost:
          type: string
          description: "the host the client typed, without the port, when known"
          nullable: true
        outcome:
          $ref: "#/components/schemas/SessionOutcome"
      description: "One login attempt, reported after the ban check."
    SessionUpdateRequest:
      required:
      - ended
      type: object
      properties:
        clientBrand:
          type: string
          description: "the brand the client announced, at most 64 characters"
          nullable: true
        clientVersion:
          type: string
          description: "the client version, at most 64 characters"
          nullable: true
        ended:
          type: boolean
          description: true when the player disconnected; the first end report is
            kept
      description: "The client brand and version, and the disconnect."
    ShareRevokeReason:
      type: string
