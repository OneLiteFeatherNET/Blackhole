          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        ip:
          minLength: 1
          type: string
    EvasionSightingDTO.Via:
      type: string
      description: The signal behind a link between two owners
      enum:
      - IP
      - CLIENT
      - BOTH
      x-enum-descriptions:
      - A shared hashed network address.
      - "A shared client fingerprint only: the same client setup, which a shared modpack\
        \ also explains."
      - Both.
    EvasionSightingsError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    EvasionSightingsResponse:
      required:
