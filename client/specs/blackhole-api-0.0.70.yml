          description: whether a press would be allowed now (fresh MODERATOR or ADMIN
            snapshot)
      description: "The staff member behind a Discord account, for the bot's staff\
        \ lookup before a button press. Never carries the Discord id."
    DiscordTicket:
      required:
      - appealId
      - createdAt
      - frozen
      - id
      - ingestedCursor
      - leaked
      - relayedSeq
      - state
      - ticketNo
      - transcriptComplete
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketNo:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/TicketState"
        appealId:
          type: string
          format: uuid
        channelId:
          type: string
          nullable: true
        guildId:
          type: string
          nullable: true
        playerDiscordUserId:
          type: string
          description: "the bound player's Discord user id, `null` once the participant\
            \ was erased"
          nullable: true
        leaked:
          type: boolean
          description: whether the case's Ban ID is marked leaked (the ticket must
            then be frozen)
        frozen:
          type: boolean
          description: the freeze the bot reported
        ingestedCursor:
          type: string
          description: "the highest Discord message id recorded, \"0\" when none"
        relayedSeq:
          type: integer
          description: the highest case event `seq` relayed to the channel
          format: int64
        transcriptComplete:
          type: boolean
          description: whether `ticket.transcript_complete` exists
        transcriptCount:
          type: integer
          format: int32
          nullable: true
        transcriptLastMessageId:
          type: string
          nullable: true
        protocolVersion:
          type: integer
          description: "the stored protocol version of the appeal, `null` when none"
          format: int32
          nullable: true
        createdAt:
          type: integer
          format: int64
      description: A ticket.
    DiscordTicketAttachment:
      required:
      - attachmentId
      - contentType
      - name
      - provenance
      - size
      type: object
      properties:
        attachmentId:
          type: string
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        width:
          type: integer
          format: int32
          nullable: true
        height:
          type: integer
          format: int32
          nullable: true
        provenance:
          type: string
          description: '`PLAYER` or `STAFF`'
      description: "A file the backend accepted from the channel: the evidence behind\
        \ the message's `attachmentId`."
    DiscordTicketCloseRequest:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          description: the messages the channel holds that the bot ingests (not its
            own)
          format: int32
        lastMessageId:
          type: string
          description: "the highest of their Discord ids, `null` or \"0\" for an empty\
            \ channel"
          nullable: true
        onBehalfOf:
          type: string
          description: "the staff member who closes the ticket from Discord, `null`\
            \ for the bot's own close; the close is then recorded under that member\
            \ once the appeal is decided"
          format: uuid
          nullable: true
      description: "The completeness proof of a closing ticket, sent after a full\
        \ rescan."
    DiscordTicketClosed:
      required:
      - protocol
      - ticket
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/DiscordTicket"
        protocolVersion:
          type: integer
          description: the stored protocol version; `null` while the appeal is not
            decided yet (the bot must not archive then)
          format: int32
          nullable: true
        protocol:
          type: string
          description: "what the generator did: `STORED`, `UNCHANGED` or `NOT_DECIDED`"
      description: The ticket closed with a verified transcript.
    DiscordTicketError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
        code:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/DiscordTicketErrorCode"
        availableFrom:
          type: integer
          description: "with Code#NOT_YET: epoch millis from which the player may\
            \ file"
          format: int64
          nullable: true
        backendCount:
          type: integer
          description: "with Code#TRANSCRIPT_MISMATCH: the backend's own tally"
          format: int32
          nullable: true
        backendLastMessageId:
          type: string
          description: "with Code#TRANSCRIPT_MISMATCH: the backend's highest message\
            \ id"
          nullable: true
      description: An expected failure.
    DiscordTicketErrorCode:
      type: string
      description: "Why a request was refused, beyond the HTTP status: a stable code\
        \ the bot switches on."
      enum:
      - NOT_ELIGIBLE
      - NOT_YET
      - STATEMENT_REQUIRED
      - INVALID_STATE
      - TRANSCRIPT_MISMATCH
      - PROTOCOL_REQUIRED
      - CHANNEL_TAKEN
      - FILE_NOT_ACCEPTED
      - TOO_LARGE
      - UNSUPPORTED_TYPE
      - FILE_FLAGGED
      - FILE_ACTIVE_CONTENT
      - INVALID_FILE
      - QUOTA
      x-enum-descriptions:
      - "A wrong, unknown, leaked or already bound Ban ID. One answer for all, so\
        \ the reply is no oracle."
      - The player may file only from `availableFrom`.
      - No appeal is open and no statement was given.
      - The ticket is not in a state the request needs.
      - The count or the last message id differs from the backend's tally.
      - "No stored (current) protocol: the ticket must not be archived or deleted."
      - The channel is already used by another ticket.
      - A file was sent by someone who is neither the bound player nor verified staff.
      - A file is larger than the chat limit.
      - "A file is not one of the chat types (PNG, JPEG, WebP, PDF, TXT)."
      - The scanner flagged the file.
      - "The file carries active content, or is an active document in disguise."
      - The bytes do not match the type or are malformed.
      - Too many files are kept for this ticket.
    DiscordTicketLinkRequest:
      required:
      - seq
      type: object
      properties:
        seq:
          type: integer
          description: the OutboxItem#seq() handled (also for an item that needed
            nothing)
          format: int64
        messageId:
          type: string
          description: "for an `ADD`: the case message that was posted"
          format: uuid
          nullable: true
        discordMessageId:
          type: string
          description: "for an `ADD`: the Discord message the bot created"
          nullable: true
      description: "Reports a relay, which advances the ticket's `relayed_seq`."
    DiscordTicketLinked:
      required:
      - relayedSeq
      type: object
      properties:
        relayedSeq:
          type: integer
          format: int64
      description: The ticket's `relayed_seq` after a link.
    DiscordTicketList:
      required:
      - tickets
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/DiscordTicket"
      description: "Tickets in some states, oldest first."
    DiscordTicketOpenRequest:
      required:
      - banId
      - discordUserId
      type: object
      properties:
        discordUserId:
          type: string
          description: the Discord user id of the person at the modal
        displayName:
          type: string
          description: "a name snapshot for the panel, optional"
          nullable: true
        banId:
          type: string
          description: "as typed, with or without `#`"
        statement:
          type: string
          description: 1 to 2000 characters; needed when no appeal is open
          nullable: true
      description: Opens a ticket for the Discord user. The Ban ID is checked exactly
        like the portal login.
    DiscordTicketOpened:
      required:
      - appealFiled
      - created
      - ticket
      type: object
      properties:
        ticket:
