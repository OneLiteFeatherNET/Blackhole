      summary: Record a login attempt
      description: "The proxy reports a login after its ban check, with the outcome.\
        \ The session id is the proxy's random UUID for the connection: a repeat returns\
        \ the stored record and writes nothing. The raw IP and player UUID are stored;\
        \ the IP is enriched offline with its ASN and country. Proxy tokens only."
      operationId: recordPlayerSession
      requestBody:
