          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
        "404":
          description: "No such session, or blackhole.intel.enabled is false"
  /ipban:
    get:
      tags:
      - IP bans
      summary: List the newest IP bans
      description: "The newest IP bans, active or not, up to 200. Shows the clear\
        \ address: staff only."
      operationId: listIpBans
      parameters:
      - name: limit
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: The bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanListResponse"
    post:
      tags:
      - IP bans
      summary: Ban an IP address or range
      description: "Holds one IPv4 or IPv6 address, or a CIDR range, at the firewall,\
        \ which pulls it from the feeds. A moderator may ban for at most blackhole.ipban.moderator-max-duration;\
        \ an administrator may ban permanently. A range wider than /16 (IPv4) or /32\
        \ (IPv6), and any protected network, is refused."
      operationId: createIpBan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpBanCreateRequest"
        required: true
      responses:
        "201":
          description: The ban was stored; warnings name a wider active ban that covers
            it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanResponse"
        "400":
          description: "Invalid address, reason, source or expiry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanError"
        "403":
          description: "FORBIDDEN_DURATION: a moderator asked for a permanent or too\
            \ long ban"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanError"
        "409":
          description: "ALREADY_BANNED: an active ban already holds this range"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanError"
        "422":
          description: IPBAN_RANGE_TOO_WIDE or IPBAN_PROTECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanError"
        "200":
          description: createIpBan 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpBanDTO"
  /ipban/active:
