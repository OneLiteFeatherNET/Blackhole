      description: Logs in. The Ban ID travels in this body and nowhere else.
    PublicMessage:
      required:
      - messageId
      - repeated
      type: object
      properties:
        messageId:
          type: string
        repeated:
          type: boolean
          description: whether the same `Idempotency-Key` had posted this message
            before and nothing was added
    PublicMessageRequest:
      type: object
      properties:
        text:
          type: string
          description: "1 to 2000 characters of Markdown (a small subset, see the\
            \ conversation entry), without a UUID, an IP address or a Ban ID; may\
            \ be absent when the message has at least one file"
          nullable: true
        attachmentIds:
          type: array
          description: "up to five files uploaded with `POST /public/attachments`\
            \ for this appeal, each sent once"
          nullable: true
          items:
            type: string
            format: uuid
      description: Posts a message to the team.
    PublicPunishment:
      required:
      - appeal
      - createdAt
      - evidenceCount
      - expiresAt
      - permanent
      - reason
      - reference
      - section
      - state
      - type
      type: object
      properties:
        reference:
          type: string
          description: "the pseudonymous label of the case (the punishment identifier),\
            \ what the player may quote to the team"
        type:
          type: string
          description: "the kind of enforcement of the section, such as `BAN` or `MUTE`"
        reason:
          type: string
          description: the reason text of the template
        section:
          type: string
          description: the display name of the section
        createdAt:
          type: string
          description: an ISO instant
        permanent:
          type: boolean
        expiresAt:
          type: string
          description: "an ISO instant, null for a permanent punishment"
          nullable: true
        state:
          $ref: "#/components/schemas/PublicPunishmentDTO.State"
        evidenceCount:
          type: integer
          description: how many valid evidence items the team holds; the count only
          format: int64
        appeal:
          $ref: "#/components/schemas/PublicAppealSummary"
    PublicPunishmentDTO.AppealState:
      type: string
      description: Where the player's right to appeal stands.
      enum:
      - NOT_YET
      - AVAILABLE
      - OPEN
      - DECIDED
      - COOLDOWN
      - FORFEITED
      - FROZEN
      x-enum-descriptions:
      - The minimum waiting time has not passed.
      - The player may file now.
      - An appeal is open.
      - The right is used up or the punishment is over.
      - A repeat appeal has to wait.
      - "The Ban ID was marked leaked before any appeal: the right is gone."
      - "The Ban ID was marked leaked while an appeal is open: the player side can\
        \ no longer write."
    PublicPunishmentDTO.State:
      type: string
      description: Where the punishment stands.
      enum:
      - ACTIVE
      - EXPIRED
      - LIFTED
      - REVOKED
    PublicSession:
      required:
      - csrf
      - expiresAt
      - scope
      type: object
      properties:
        csrf:
          type: string
        expiresAt:
          type: string
        scope:
          $ref: "#/components/schemas/PlayerScope"
      description: "The session behind the request, for the portal's bootstrap."
    PunishEntryDTO:
      required:
      - identifier
      - lifted
      - metaData
      - permanent
      - section
      - shortId
      - source
      - verified
      type: object
      properties:
        identifier:
          type: string
          description: the identifier of the punishment
        shortId:
          type: string
          description: "the short ID players quote, `#` and eight upper case hex characters"
        source:
          type: string
          description: "the source of the punishment: the staff member's `oid` for\
            \ punishments written with a token, the delegated in-game UUID for the\
            \ proxy's, or whatever was stored before SSO"
          format: uuid
        recordedByOid:
          type: string
          description: "the `oid` of the verified principal that wrote it, `null`\
            \ for punishments written before SSO"
          format: uuid
          nullable: true
        verified:
          type: boolean
          description: "whether `recordedByOid` is present: `false` marks a legacy,\
            \ unverified attribution"
        actorOid:
          type: string
          description: "the staff member the in-game `source` was linked to when it\
            \ was written, `null` for web writes, unlinked UUIDs and punishments from\
            \ before the link existed"
          format: uuid
          nullable: true
        actorName:
          type: string
          description: "the display name of `actorOid`, `null` when unknown, anonymized\
            \ or not looked up (profile listings carry only the `actorOid`)"
          nullable: true
        section:
          type: string
          description: the section it belongs to
        scope:
          type: string
          description: "the optional scope (e.g. event/community) it is restricted\
            \ to, or `null`"
          nullable: true
        permanent:
          type: boolean
          description: whether it is a permanent punishment issued by the system's
            escalation
        lifted:
          type: boolean
          description: whether it was revoked or lifted by a granted appeal
        createdAt:
          type: integer
          description: creation time in epoch millis
          format: int64
          nullable: true
        escalationGroup:
          type: string
          description: "the escalation group a template punishment counted towards,\
            \ else `null`"
          nullable: true
        stepIndex:
          type: integer
          description: "the zero-based escalation step that was applied, else `null`"
          format: int32
          nullable: true
        stepCount:
          type: integer
          description: "how many steps the template had when it was applied, else\
            \ `null`"
          format: int32
          nullable: true
        eloCost:
          type: integer
          description: "the ELO deducted when it was applied, else `null`"
          format: int32
          nullable: true
        template:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishTemplateResponse"
        evidenceCount:
          type: integer
          description: "how many valid evidence items the punishment has - the only\
            \ thing about evidence a player may learn; `null` where it was not computed\
            \ (profile listings), use `GET /punishment/{reference}/evidence/count`\
            \ there"
          format: int64
          nullable: true
        kind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishmentKind"
        kickScope:
          type: string
          description: "the scope a kick was applied at (`NETWORK`, `SERVER` or `SECTION`),\
            \ else `null`"
          nullable: true
        kickTarget:
          type: string
          description: "the server or section a scoped kick targeted, else `null`"
          nullable: true
        acknowledgedAt:
          type: integer
          format: int64
          nullable: true
        metaData:
          type: object
          additionalProperties:
            type: object
          description: the metadata of the punishment
      description: An applied punishment as it appears in profiles and apply results.
    PunishProfileDTO:
      required:
      - active
      - metaData
      - owner
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        active:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PunishEntryDTO"
        history:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PunishEntryDTO"
        metaData:
          type: object
          additionalProperties:
            type: object
    PunishProfileRequestDTO:
      required:
      - metaData
      - owner
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        active:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PunishEntryDTO"
          nullable: true
        history:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PunishEntryDTO"
        metaData:
          type: object
          additionalProperties:
            type: object
      description: Request body for creating/updating a punishment profile.
    PunishProfileResponse:
      type: object
    PunishTemplateCreateRequest:
      required:
      - key
      - reason
      - section
      - steps
      type: object
      properties:
        key:
          minLength: 1
          type: string
        reason:
          minLength: 1
          type: string
        section:
          minLength: 1
          type: string
        escalationGroup:
          type: string
          nullable: true
        escalationWindow:
          type: string
          nullable: true
        warnWindow:
          type: string
          nullable: true
        steps:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PunishTemplateStep"
        metaData:
          type: object
          additionalProperties:
            type: object
          nullable: true
        publicReason:
          maxLength: 200
          type: string
          nullable: true
      description: "Unknown properties are rejected, so a client that sends an `identifier`\
        \ on create gets a 400 instead of having it silently ignored."
    PunishTemplateError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    PunishTemplatePage:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        content:
          type: array
          description: the templates of this page
          items:
            $ref: "#/components/schemas/PunishTemplateResponse"
        totalSize:
          type: integer
          description: the number of templates across all pages
          format: int64
        totalPages:
          type: integer
          description: the number of pages
          format: int32
        pageNumber:
          type: integer
          description: the zero-based number of this page
          format: int32
        size:
          type: integer
          description: the requested page size
          format: int32
        offset:
          type: integer
          description: the index of the first template of this page
          format: int64
        numberOfElements:
          type: integer
          description: the number of templates on this page
          format: int32
        empty:
          type: boolean
          description: whether this page has no templates
      description: "Documents the body of `GET /template`: the JSON Micronaut Data's\
        \ `Page` serialises to, with the templates under `content`. Never instantiated\
        \ - the controller returns the `Page` itself, so this exists only to give\
        \ the published spec the real shape instead of a bare array."
    PunishTemplateResponse:
      required:
      - escalationGroup
      - identifier
      - key
      - metaData
      - reason
      - section
      - steps
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        key:
          type: string
        reason:
          type: string
        section:
          type: string
        escalationGroup:
          type: string
        escalationWindow:
          type: string
          nullable: true
        warnWindow:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PunishTemplateStep"
        metaData:
          type: object
          additionalProperties:
            type: object
        publicReason:
          type: string
          nullable: true
    PunishTemplateStep:
      required:
      - eloCost
      type: object
      properties:
        duration:
          type: string
          nullable: true
        eloCost:
          type: integer
          format: int32
        kind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/StepKind"
    PunishTemplateUpdateRequest:
      required:
      - identifier
      - key
      - reason
      - section
      - steps
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        key:
          minLength: 1
          type: string
        reason:
          minLength: 1
          type: string
        section:
          minLength: 1
          type: string
        escalationGroup:
          type: string
          nullable: true
        escalationWindow:
          type: string
          nullable: true
        warnWindow:
          type: string
          nullable: true
        steps:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PunishTemplateStep"
        metaData:
          type: object
          additionalProperties:
            type: object
          nullable: true
        publicReason:
          maxLength: 200
          type: string
          nullable: true
    PunishmentApplyRequest:
      required:
      - owner
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        templateKey:
          type: string
          nullable: true
        templateId:
          type: string
          format: uuid
          nullable: true
        onBehalfOf:
          type: string
          description: the Minecraft UUID of the in-game staff member the proxy acts
            for; accepted only from the `PROXY` role (HTTP 400 otherwise)
          format: uuid
          nullable: true
        evidenceCorrelationId:
          maxLength: 64
          type: string
          description: the key evidence was sent under before this punishment existed;
            the pending evidence of this owner with that key is attached to the new
            punishment
          nullable: true
        scope:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/KickScope"
        target:
          type: string
          description: the server name or section key for a `SERVER` or `SECTION`
            scope
          nullable: true
        warningOnly:
          type: boolean
          description: "`true` for `/warn`: the step the ladder reached must be a\
            \ `WARN` step, otherwise nothing is applied (HTTP 422 `WARN_STEP_REQUIRED`)"
          nullable: true
        playerUuid:
          maxLength: 64
          type: string
          nullable: true
        exemptionOverride:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExemptionOverride"
      description: Apply a template to a player. Exactly one of `templateKey` and
        `templateId` is required. The staff member is the caller of the verified token;
        there is no client-supplied source.
    PunishmentApplyResponse:
      required:
      - enforcement
      - punishment
      - scoreAfter
      - scoreBefore
      - section
      - step
      - stepCount
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        section:
          type: string
          description: the section it belongs to
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        step:
          type: integer
          description: "the escalation step that was applied, starting at 1"
          format: int32
        stepCount:
          type: integer
          description: how many steps the template has
          format: int32
        scoreBefore:
          type: integer
          description: the section score before the ELO cost
          format: int32
        scoreAfter:
          type: integer
          description: the section score after the ELO cost
          format: int32
        escalation:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishmentEscalation"
      description: The result of applying a template.
    PunishmentError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    PunishmentEscalation:
      required:
      - punishment
      - resultingScore
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        resultingScore:
          type: integer
          description: the section score that triggered it
          format: int32
      description: A permanent punishment the system applied because a deduction left
        the score too low.
    PunishmentKind:
      type: string
      description: "What a punishment row is: a real punishment, or a kick or a warning\
        \ that never stays active. A kick ends the moment it is delivered; a warning\
        \ waits until the player acknowledges it."
      enum:
      - PUNISHMENT
      - KICK
      - WARN
    PunishmentLookupRequest:
      type: object
      properties:
        banId:
          type: string
          description: "the Ban ID as typed, with or without `#`, in any case; a credential,\
            \ so it is a body field and is never printed"
          nullable: true
      description: Staff look up a punishment by the Ban ID a player quotes.
    PunishmentLookupResponse:
      required:
      - punishment
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
    PunishmentPreviewResponse:
      required:
      - eloCost
      - enforcement
      - escalatesToPermanent
      - permanentThreshold
      - scoreAfter
      - scoreBefore
      - section
      - step
      - stepCount
      type: object
      properties:
        section:
          type: string
          description: the section the template belongs to
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        step:
          type: integer
          description: "the escalation step that would apply, starting at 1"
          format: int32
        stepCount:
          type: integer
          description: how many steps the template has
          format: int32
        duration:
          type: string
          description: the ISO-8601 duration of the step; absent for a kick step
          nullable: true
        eloCost:
          type: integer
          description: the ELO the step would deduct
          format: int32
        scoreBefore:
          type: integer
          description: the section score now
          format: int32
        scoreAfter:
          type: integer
          description: the section score after the deduction
          format: int32
        permanentThreshold:
          type: integer
          description: the section's permanent threshold
          format: int32
        escalatesToPermanent:
          type: boolean
          description: whether the deduction would leave the score below that threshold
      description: "What applying a template would do right now, without doing it:\
        \ the escalation step the server selects, its cost and whether the cost would\
        \ push the player into a permanent punishment."
    PunishmentRevokeRequest:
      required:
      - owner
      - section
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        section:
          minLength: 1
          type: string
        onBehalfOf:
          type: string
          description: the Minecraft UUID of the in-game staff member the proxy acts
            for; accepted only from the `PROXY` role (HTTP 400 otherwise)
          format: uuid
          nullable: true
      description: Revoke the active punishment of a section. The revoking staff member
        is the caller of the verified token.
    PunishmentRevokeResponse:
      required:
      - punishment
      - section
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        section:
          type: string
          description: the section it belonged to
        scoreReset:
          type: integer
          description: "the section score after a permanent punishment was pardoned,\
            \ else `null`"
          format: int32
          nullable: true
      description: The result of revoking a section's active punishment.
    ReportCategory:
      type: string
      description: What kind of behavior a report is about.
      enum:
      - CHAT_ABUSE
      - CHEATING
      - GRIEFING
      - OTHER
    ReportDTO:
      required:
      - category
      - createdAt
      - metaData
      - reportedHash
      - reporterHash
      - updatedAt
      - verified
      type: object
      properties:
        identifier:
          type: string
          description: "the identifier of the report, `null` when submitting"
          format: uuid
          nullable: true
        reporterHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reporting player
          x-pattern-message: reporterHash must be a sha-512 hash
        reportedHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reported player
          x-pattern-message: reportedHash must be a sha-512 hash
        category:
          $ref: "#/components/schemas/ReportCategory"
        description:
          maxLength: 1000
          type: string
          description: a bounded free-text description
          nullable: true
        evidenceReferences:
          type: array
          description: optional references to `PunishmentEvidenceEntity` entries
          nullable: true
          items:
            type: string
            format: uuid
        status:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ReportStatus"
        createdAt:
          type: integer
          description: epoch millis when the report was submitted
          format: int64
        updatedAt:
          type: integer
          description: epoch millis of the last status change
          format: int64
        resolvedBy:
          type: string
          description: "the staff identity that resolved this report, if resolved:\
            \ the resolver's `oid` for reports resolved with a token, whatever was\
            \ stored before SSO otherwise"
          format: uuid
          nullable: true
        recordedByOid:
          type: string
          description: "the `oid` of the verified principal that resolved it, `null`\
            \ while open and for reports resolved before SSO"
          format: uuid
          nullable: true
        verified:
          type: boolean
          description: whether the resolution is attributed to a verified principal;
            `false` for an open report and for one resolved before SSO
        resolutionNote:
          maxLength: 1000
          type: string
          description: "a note explaining the resolution, if resolved"
          nullable: true
        metaData:
          type: object
          additionalProperties:
            type: object
          description: extensible metadata
      description: A player report. `status`/`createdAt`/`updatedAt`/`resolvedBy`/
        `resolutionNote` are server-controlled - a submission simply leaves them unset/default.
    ReportErrorDTO:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
          description: what went wrong
        kind:
          $ref: "#/components/schemas/ErrorKind"
      description: "The body of a failed report resolution, so every expected failure\
        \ is distinguishable by its message and kind instead of a bare status code."
    ReportFeedbackList:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: the messages that have not expired
          items:
            $ref: "#/components/schemas/ReportFeedbackResponse"
      description: "The messages waiting for one reporter, oldest first."
    ReportFeedbackResponse:
      required:
      - category
      - createdAt
      - expiresAt
      - identifier
      - outcome
      - reportIdentifier
      type: object
      properties:
        identifier:
          type: string
          description: "the message, which the proxy acknowledges after showing it"
          format: uuid
        reportIdentifier:
          type: string
          description: the report it is about
          format: uuid
        category:
          $ref: "#/components/schemas/ReportCategory"
        outcome:
          $ref: "#/components/schemas/ReportStatus"
        createdAt:
          type: integer
          description: "when the report was resolved, epoch millis"
          format: int64
        expiresAt:
          type: integer
          description: "when the message is dropped if nobody acknowledged it, epoch\
            \ millis"
          format: int64
      description: One waiting message.
    ReportRequestDTO:
      required:
      - category
      - metaData
      - reportedHash
      - reporterHash
      type: object
      properties:
        reporterHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reporting player
          x-pattern-message: reporterHash must be a sha-512 hash
        reportedHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reported player
          x-pattern-message: reportedHash must be a sha-512 hash
        category:
          $ref: "#/components/schemas/ReportCategory"
        description:
          maxLength: 1000
          type: string
          description: a bounded free-text description
          nullable: true
        evidenceReferences:
          type: array
          description: optional references to `PunishmentEvidenceEntity` entries
          nullable: true
          items:
            type: string
            format: uuid
        metaData:
          type: object
          additionalProperties:
            type: object
          description: extensible metadata
      description: "Request body for submitting a player report. `status`/`createdAt`/\
        \ `updatedAt`/`resolvedBy`/`resolutionNote` are server-controlled and have\
        \ no place here - see ReportDTO, the response type, for those."
    ReportResolutionDTO:
      required:
      - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
        resolutionNote:
          maxLength: 1000
          type: string
          description: an optional note explaining the decision
          nullable: true
        punishmentTemplateId:
          type: string
          description: an optional template to apply to the reported player
          format: uuid
          nullable: true
      description: "Request body for resolving a report. Providing `punishmentTemplateId`\
        \ applies that template to the reported player as part of the same resolution\
        \ - the report system's actual integration point with punishments. The resolver,\
        \ and the source of an applied punishment, is the caller of the verified token;\
        \ the request carries no actor."
    ReportStatus:
      type: string
      description: The lifecycle state of a report.
      enum:
      - OPEN
      - UNDER_REVIEW
      - ACTIONED
      - DISMISSED
    RollbackCancelled:
      required:
      - jobId
      - state
      type: object
      properties:
        jobId:
          type: string
          description: the job identifier
          format: uuid
        state:
          type: string
          description: '`CANCELLED`'
      description: The job was cancelled. Items already revoked stay revoked; the
        pending ones are not processed.
    RollbackDTO:
      type: object
      description: Rolling back the punishments one staff actor issued in a time window
    RollbackError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    RollbackExecuteRequest:
      required:
      - includeMarks
      - reason
      - suspendLink
      type: object
      properties:
        reason:
          type: string
          description: "the justification, 1 to 500 characters, shown in the audit\
            \ trail"
        suspendLink:
          type: boolean
          description: whether to remove the Minecraft link of the staff member before
            the items run
        includeMarks:
          type: boolean
          description: whether the frozen kicks are marked as rolled back; otherwise
            they are skipped and nothing changes
      description: Confirm a previewed rollback. The `Idempotency-Key` header (not
        a field) makes a repeat answer the same job.
    RollbackPreviewRequest:
      required:
      - windowFrom
      - windowTo
      type: object
      properties:
        staffOid:
          type: string
          description: "the HUMAN staff actor, or null"
          format: uuid
          nullable: true
        minecraftUuid:
          type: string
          description: "the unlinked in-game account, or null"
          format: uuid
          nullable: true
        windowFrom:
          type: integer
          description: "the window start, epoch milliseconds, inclusive"
          format: int64
        windowTo:
          type: integer
          description: "the window end, epoch milliseconds, inclusive"
          format: int64
      description: "Preview a rollback. Exactly one selector: a staff member's `oid`,\
        \ or the Minecraft UUID of an unlinked in-game account."
    RollbackPreviewResponse:
      required:
      - alreadyInactive
      - byKind
      - bySection
      - jobId
      - kicks
      - players
      - previewExpiresAt
      - revocable
      - state
      type: object
      properties:
        jobId:
          type: string
          description: the job identifier
          format: uuid
        state:
          type: string
          description: '`PREVIEW`'
        previewExpiresAt:
          type: integer
          description: "when the preview stops being startable, epoch milliseconds"
          format: int64
        revocable:
          type: integer
          description: how many punishments would be revoked
          format: int32
        alreadyInactive:
          type: integer
          description: how many matching punishments are already lifted or ended and
            are not revoked
          format: int32
        players:
          type: integer
          description: how many distinct (hashed) players the revocable punishments
            belong to
          format: int32
        kicks:
          type: integer
          description: how many kicks in the window are frozen for a history mark
            (a kick is never revoked)
          format: int32
        byKind:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: the revocable count per punishment kind
        bySection:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: the revocable count per section key
      description: The frozen preview. Nothing has been revoked; the job is `PREVIEW`
        until it is started or it expires.
    RollbackProgress:
      required:
      - items
      - jobId
      - state
      type: object
      properties:
        jobId:
          type: string
          description: the job identifier
          format: uuid
        state:
          type: string
          description: "`PREVIEW`, `RUNNING`, `COMPLETED` or `CANCELLED`"
        items:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "the item count per state: `PENDING`, `REVOKED`, `SKIPPED`,\
            \ `FAILED`"
      description: "How a job is going: its state and how many items are in each state."
    RollbackStarted:
      required:
      - jobId
      - repeated
      - state
      type: object
      properties:
        jobId:
          type: string
          description: the job identifier
          format: uuid
        state:
          type: string
          description: "`RUNNING`, or the job's current state for a repeat"
        repeated:
          type: boolean
          description: "whether the `Idempotency-Key` was already used: nothing was\
            \ written"
      description: "The rollback was started, or the same start was repeated."
    SectionCreateRequest:
      required:
      - baseScore
      - displayName
      - enforcement
      - key
      - pardonScore
      - permanentReason
      - permanentThreshold
      type: object
      properties:
        key:
          minLength: 1
          type: string
        displayName:
          minLength: 1
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        targetKind:
          nullable: true
          allOf:
