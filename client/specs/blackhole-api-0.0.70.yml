  /profile/{owner}/session:
    post:
      tags:
      - PunishProfile
      summary: "Records session telemetry (Phase 7's dashboard enrichment: Java/Bedrock\
        \ protocol version and client brand) into the profile's existing metaData,\
        \ so the already-existing profile listing/get endpoints surface it without\
        \ a separate dashboard endpoint."
      description: Records session telemetry (protocol version / client brand) for
        the dashboard
      operationId: updateSessionInfo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInfoDTO"
        required: true
      responses:
        "200":
          description: Session info recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /proxy/capabilities:
    get:
      tags:
      - Proxy
      summary: Get the SignedVelocity state of every proxy
      description: Each proxy's last report. A proxy whose last report is older than
        the stale window is unknown. Staff panel only.
      operationId: getProxyCapabilities
      responses:
        "200":
          description: The last state of every proxy that has reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyCapabilityResponse"
    put:
      tags:
      - Proxy
      summary: Report a proxy's SignedVelocity state
      description: "Replaces the calling proxy's last report of whether SignedVelocity\
        \ is loaded on it. Without it the proxy cannot cancel a muted player's signed\
        \ chat, so the admin panel warns while any proxy lacks it. Proxy tokens only."
      operationId: reportProxyCapabilities
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyCapabilityReportRequest"
        required: true
      responses:
        "204":
          description: Report stored
        "400":
          description: Invalid proxy id or SignedVelocity version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyCapabilityError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyCapabilityError"
        "200":
          description: reportProxyCapabilities 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyCapabilityDTO"
  /public/appeal:
    get:
      tags:
      - Public
      summary: The appeal
      description: "The open appeal, else the latest: status, decision and, for a\
        \ shortened punishment, the new expiry. The internal decision note is never\
        \ returned. Not for a leaked Ban ID (403)."
      operationId: publicAppeal
      responses:
        "200":
          description: The appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppeal"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NO_APPEAL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    post:
      tags:
      - Public
      summary: File the appeal
      description: "Files the appeal with a statement of 1 to 2000 characters through\
        \ the eligibility checklist. An appeal that is not eligible is not recorded:\
        \ 409 NOT_ELIGIBLE (with availableFrom when the player only has to wait),\
        \ FORFEITED or FROZEN after a leak. conditionsVersion must be the current\
        \ version of the appeal conditions, else 409 CONDITIONS_CHANGED. At most one\
        \ appeal is open."
      operationId: publicFileAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAppealRequest"
        required: true
      responses:
        "200":
          description: The filed appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppeal"
        "400":
          description: "The statement is empty, too long or has control characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "403":
          description: "CHALLENGE_FAILED: no valid solved challenge for appeal; nothing\
            \ is recorded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: "FORFEITED, FROZEN, NOT_ELIGIBLE or CONDITIONS_CHANGED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "The statement looks like a UUID, an IP address or a Ban ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the replay store did not answer; no appeal is\
            \ filed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/appeal/conditions:
    get:
      tags:
      - Public
      summary: The appeal conditions
      description: "The current appeal conditions: a version number and a plain text.\
        \ The player confirms them before filing and sends the version back as conditionsVersion;\
        \ a changed version answers 409 CONDITIONS_CHANGED. Any session scope may\
        \ read them."
      operationId: publicAppealConditions
      responses:
        "200":
          description: The current conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAppealConditions"
        "401":
          description: The session is missing or expired
  /public/appeal/protocol:
    get:
      tags:
      - Public
      summary: The appeal protocol
      description: "The player's own copy of the conversation of a decided appeal,\
        \ rendered on demand from the same player-visible entries as the conversation\
        \ (you, the moderation team, the system; no staff names, no staff-only entries),\
        \ as a text or JSON attachment. Not for a leaked Ban ID (403); 409 NOT_DECIDED\
        \ while no appeal is decided."
      operationId: publicAppealProtocol
      parameters:
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: "The file (Content-Disposition: attachment, Cache-Control:\
            \ no-store)"
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NOT_DECIDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/attachments:
    post:
      tags:
      - Public
      summary: Upload a chat file
      description: "Stages one file for the open appeal (PNG, JPEG, WebP, PDF or UTF-8\
        \ text, at most 10 MiB) as multipart form data. The type comes from the bytes,\
        \ the file is scanned before it is stored, and images lose their metadata.\
        \ The answer holds the attachmentId to send in attachmentIds of POST /public/messages.\
        \ A staged file is visible to nobody until a message names it; an unsent one\
        \ is removed after the pending lifetime."
      operationId: publicUploadAttachment
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The file was staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAttachmentStaged"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "409":
          description: NO_APPEAL or QUOTA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "413":
          description: TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "415":
          description: UNSUPPORTED_TYPE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "FILE_FLAGGED, FILE_ACTIVE_CONTENT or INVALID_FILE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the scanner or the store cannot answer; nothing\
            \ was stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/attachments/{id}:
    get:
      tags:
      - Public
      summary: Download a chat file
      description: "The file of a message of this conversation (the attachmentId)\
        \ or the image of an active share (the shareId). Images are inline; every\
        \ other file is an attachment. Another punishment's id, a removed message,\
        \ a withdrawn share and an unknown id all answer 404."
      operationId: publicDownloadAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The file (X-Content-Type-Options: nosniff, Content-Security-Policy:\
            \ sandbox, Cache-Control: private, no-store)"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    delete:
      tags:
      - Public
      summary: Remove a staged chat file
      description: Removes a file of the open appeal that no message has sent yet.
        A sent file is not found here.
      operationId: publicDeleteAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The staged file was removed
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "200":
          description: publicDeleteAttachment 200 response
          content:
            application/json:
              schema:
                type: object
  /public/bans:
    get:
      summary: List the public bans
      description: "One keyset page of the listed sanctions. Entries carry the player\
        \ hash, never a raw identifier."
      operationId: publicBanList
      parameters:
      - name: limit
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: cursor
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: kind
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: status
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: playerHash
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBanPage"
        "400":
          description: A query parameter or the cursor is not valid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
        "401":
          description: "Missing, malformed or wrong Basic credentials"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
        "403":
          description: The request did not arrive over HTTPS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
      security:
      - basicAuth: []
  /public/bans/summary:
    get:
      summary: Count the public bans per reason
      description: Counts per public reason and kind. Counts below the configured
        minimum are suppressed.
      operationId: publicBanSummary
      responses:
        "200":
          description: The counts of the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBanSummary"
        "401":
          description: "Missing, malformed or wrong Basic credentials"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
        "403":
          description: The request did not arrive over HTTPS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
      security:
      - basicAuth: []
  /public/bans/{hash}:
    get:
      summary: Read one public ban
      description: "One listed sanction by its entry hash. Unknown, malformed and\
        \ expired-out-of-window hashes are not found."
      operationId: publicBanEntry
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBanEntry"
        "401":
          description: "Missing, malformed or wrong Basic credentials"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
        "403":
          description: The request did not arrive over HTTPS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
        "404":
          description: No entry matches the hash
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicBanError"
      security:
      - basicAuth: []
  /public/bans/{hash}/{rest}:
    get:
      operationId: unrouted
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: rest
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: unrouted 200 response
          content:
            application/json:
              schema:
                type: object
  /public/challenge:
    get:
      tags:
      - Public
      summary: The proof-of-work challenge
      description: "A signed ALTCHA challenge for the purpose sign-in or appeal, to\
        \ be solved in the browser and sent back in the altcha field of the sign-in\
        \ or the filing. Each solution works once. Anonymous; it needs no store, so\
        \ it answers while the replay store is down. Answers {enabled: false} when\
        \ the check is switched off (dev and test only)."
      operationId: publicChallenge
      parameters:
      - name: purpose
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: "The challenge to solve, or {enabled: false}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChallenge"
        "400":
          description: "UNKNOWN_PURPOSE: the purpose is missing or is not sign-in\
            \ or appeal"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/conversation:
    get:
      tags:
      - Public
      summary: The conversation
      description: "The entries the player may see, after the seq cursor: player-visible\
        \ messages (edits folded into the current text, deleted ones marked removed)\
        \ and the markers APPEAL_FILED, APPEAL_DECIDED, FROZEN and FORFEITED. No staff\
        \ names and no staff-only entries. Not for a leaked Ban ID (403)."
      operationId: publicConversation
      parameters:
      - name: cursor
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConversation"
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/conversation/events:
    get:
      tags:
      - Public
      summary: Live updates of the conversation
      description: "A text/event-stream: retry (once), ready {\"seq\"} on connect,\
        \ changed {\"seq\"} (id = seq) after every change the player may read, expired\
        \ {} and then the end when the session ends, replaced {} when another stream\
        \ of the same session opens, and a keep-alive comment every 15 seconds. No\
        \ text, name or file name is ever sent: after a changed event the client reads\
        \ GET /public/conversation with its cursor. Last-Event-ID below the current\
        \ seq gets a changed right after ready. One stream per session; the stream\
        \ ends after its maximum lifetime and the client reconnects."
      operationId: publicConversationEvents
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The session is missing or expired
        "403":
          description: The Ban ID is marked leaked
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the replica holds its maximum of streams; poll\
            \ instead"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/messages:
    post:
      tags:
      - Public
      summary: Post a message
      description: Adds a message of 1 to 2000 characters to the open appeal. The
        optional Idempotency-Key makes a double submit a no-op. 409 NO_APPEAL (nothing
        is open) or FROZEN (the Ban ID is marked leaked).
      operationId: publicPostMessage
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicMessageRequest"
        required: true
      responses:
        "200":
          description: "The message was stored (repeated: true when the key had posted\
            \ it before)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMessage"
        "400":
          description: "The text is empty, too long or has control characters, or\
            \ the key is malformed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "401":
          description: The session is missing or expired
        "409":
          description: NO_APPEAL or FROZEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "422":
          description: "The text looks like a UUID, an IP address or a Ban ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
  /public/punishment:
    get:
      tags:
      - Public
      summary: The facts of the punishment
      description: "An allow-list: reference, type, reason, section, times, state,\
        \ evidence count and the appeal summary. Never an owner hash, a staff name,\
        \ an ELO value, a note or evidence content. Works for every scope."
      operationId: publicPunishment
      responses:
        "200":
          description: The facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPunishment"
        "401":
          description: The session is missing or expired
  /public/session:
    get:
      tags:
      - Public
      summary: Read the session
      description: "The CSRF value, the absolute expiry and the scope of the session\
        \ behind the token."
      operationId: publicSession
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSession"
        "401":
          description: The session is missing or expired
    post:
      tags:
      - Public
      summary: Log in with the Ban ID
      description: "Creates a player session for the Ban ID in the body. The altcha\
        \ field must carry a solved challenge for sign-in: a missing, wrong, expired\
        \ or reused one answers 403 CHALLENGE_FAILED before the Ban ID is read. A\
        \ wrong, unknown, malformed or not yet issued Ban ID all answer 401 INVALID_BAN_ID\
        \ with the same body. A Ban ID that staff marked leaked logs in with scope\
        \ LIMITED. The token is returned once and only its hash is stored."
      operationId: publicLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLoginRequest"
        required: true
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLogin"
        "401":
          description: "INVALID_BAN_ID, always the same"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "403":
          description: "CHALLENGE_FAILED: no valid solved challenge for sign-in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
        "503":
          description: "UNAVAILABLE: the replay store did not answer; no session is\
            \ created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicError"
    delete:
      tags:
      - Public
      summary: Log out
      description: Deletes the session; the token stops working at once.
      operationId: publicLogout
      responses:
        "204":
          description: The session is gone
        "401":
          description: The session is missing or expired
        "200":
          description: publicLogout 200 response
          content:
            application/json:
              schema:
                type: object
  /public/staff-avatar/{avatarKey}:
    get:
      tags:
      - Public
      summary: A staff head
      description: "The 64 px head of a linked staff account, by its keyed avatar\
        \ key. The key reveals neither the Minecraft UUID nor the account. Served\
        \ to players through the portal only; cached for a day."
      operationId: getStaffAvatar
      parameters:
      - name: avatarKey
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The head as PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No head for this key; the client shows initials
  /punishment:
    get:
      tags:
      - Punishment
      summary: Get all punishments
      description: Retrieves a paginated list of all punishment entries in the system
      operationId: getPunishments
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
  /punishment/active:
    get:
      tags:
      - Punishment
      summary: List active punishments across players
      description: "Lists every punishment that currently holds a player's active\
        \ slot and has not ended, newest first by default. Every filter is optional.\
        \ kind is MUTE, BAN or SERVER; section is a section key (a CloudNet target\
        \ section is a SERVER section whose targetKind is CLOUDNET_TASK, CLOUDNET_GROUP\
        \ or CLOUDNET_SERVICE); permanent selects permanent or temporary punishments;\
        \ expiresBefore (epoch milliseconds) keeps temporary punishments that end\
        \ before it; automatic selects those the ELO system applied; actor is the\
        \ staff member's oid. sort is CREATED or EXPIRES (a permanent punishment sorts\
        \ as the latest), direction ASC or DESC. Players appear as their hashed owner\
        \ only; no raw UUID, IP address or ban ID is returned."
      operationId: listActivePunishments
      parameters:
      - name: kind
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EnforcementKind"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: targetKind
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ServerTargetKind"
      - name: permanent
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      - name: expiresBefore
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: automatic
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      - name: actor
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: sort
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ActivePunishmentSort"
      - name: direction
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/SortDirection"
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: One page of active punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePunishmentPage"
        "400":
          description: A filter or the page is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePunishmentError"
  /punishment/apply:
    post:
      tags:
      - Punishment
      summary: Apply a punishment template
      description: "Applies a template to a player: creates a temporary punishment\
        \ in the template's section with the duration and ELO cost of the escalation\
        \ step the player has reached, deducts the cost, and reports the step, the\
        \ score before and after, and any permanent escalation it caused. The staff\
        \ member is the caller of the token; only the proxy may send onBehalfOf (the\
        \ in-game staff member's UUID)."
      operationId: applyPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: Punishment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentApplyResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "422":
          description: "WARN_STEP_REQUIRED: warningOnly was set but the step the ladder\
            \ reached is no warning; KICK_TARGET_INVALID: a kick step's scope and\
            \ target do not fit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/lookup:
    post:
      tags:
      - Punishment
      summary: Find a punishment by Ban ID
      description: "Finds the punishment a Ban ID belongs to. The Ban ID is a credential,\
        \ so it goes in the request body and never in a URL or query. Anything that\
        \ matches nothing, malformed or unknown, answers the same 404 without the\
        \ input in it. The response is never cacheable (Cache-Control: no-store)."
      operationId: findPunishmentByBanId
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentLookupRequest"
        required: true
      responses:
        "200":
          description: The punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentLookupResponse"
        "404":
          description: No punishment has this Ban ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/preview:
    post:
      tags:
      - Punishment
      summary: Preview applying a template
      description: "Answers what applying the template would do right now - the escalation\
        \ step, its cost, the resulting score and whether the player would be punished\
        \ permanently - without changing anything. Takes the same request as /punishment/apply\
        \ and fails with the same errors."
      operationId: previewPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: What applying the template would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentPreviewResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/revoke:
    post:
      tags:
      - Punishment
      summary: Revoke the active punishment of a section
      description: Moves the player's active punishment in the section into history.
        Revoking a permanent punishment resets the player's score in that section
        to the section's pardon score.
      operationId: revokePunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentRevokeRequest"
        required: true
      responses:
        "200":
          description: Punishment revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentRevokeResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, onBehalfOf\
            \ from a caller that is not the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: The player has no active punishment in that section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/short/{shortId}:
    get:
      tags:
      - Punishment
      summary: Find punishments by short ID
      description: "Finds the punishments whose short ID (the # and eight hex characters\
        \ players are shown, e.g. #A1B2C3D4) matches. The # is optional and the case\
        \ is ignored. Short IDs are four bytes and can collide, so the result is a\
        \ list: empty if nothing matches, several if they collide."
      operationId: findPunishmentsByShortId
      parameters:
      - name: shortId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The matching punishments, possibly none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
        "400":
          description: "Not a short ID (exactly eight hex characters, optionally after\
            \ #)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/{reference}/ban-id:
    get:
      tags:
      - Punishment
      summary: Reveal the Ban ID of a punishment
      description: "Returns the current Ban ID of a punishment: the eight character\
        \ credential the player uses for the appeal portal. For moderators and the\
        \ proxy (it shows the value on the ban screen); never cacheable (Cache-Control:\
        \ no-store). The reference is the full identifier, or a legacy short id when\
        \ it is unambiguous. The Ban ID is part of no other response."
      operationId: revealBanId
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The current Ban ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdResponse"
        "404":
          description: "Unknown punishment, or its Ban ID has not been issued yet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
        "503":
          description: The stored Ban ID cannot be read with the configured key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BanIdError"
  /punishment/{reference}/evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of a punishment
      description: "Lists the evidence of a punishment (identifier or short id), oldest\
        \ first. Lifted and revoked evidence is hidden unless includeInactive is true;\
        \ asking for it is audited."
      operationId: listPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /punishment/{reference}/evidence/count:
    get:
      tags:
      - Evidence
      summary: Count the valid evidence of a punishment
      description: "The number of valid evidence items of a punishment: the only thing\
        \ a player may be told. Lifted and revoked evidence is not counted."
      operationId: countPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCount"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /report:
    get:
      tags:
      - Report
      summary: Get all reports
      description: "Retrieves a paginated list of reports. With reportedHash only\
        \ the reports against that player are listed, newest first."
      operationId: getReports
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: reportedHash
        in: query
        description: Only the reports against this player (owner hash)
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Successfully retrieved reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDTO"
    post:
      tags:
      - Report
      summary: Submit a report
      description: Submits a player report. Rate-limited per reporterHash within a
        configurable time window.
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestDTO"
        required: true
      responses:
        "200":
          description: Report successfully submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "429":
          description: Rate limit exceeded for this reporter
  /report/feedback/{identifier}/ack:
    post:
      tags:
      - Report
      summary: Acknowledge report feedback
      description: "Deletes a message after it was shown to the reporter. Acknowledging\
        \ an unknown or already deleted message succeeds as well, so the call can\
        \ be repeated safely."
      operationId: acknowledgeReportFeedback
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The message is gone
        "200":
          description: acknowledgeReportFeedback 200 response
  /report/feedback/{owner}:
    get:
      tags:
      - Report
      summary: Get the pending report feedback of a reporter
      description: "Returns the messages that tell the reporter what became of their\
        \ resolved reports and have not expired yet, oldest first. A message says\
        \ whether action was taken, never which punishment."
      operationId: getPendingReportFeedback
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The pending messages, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportFeedbackList"
  /report/{identifier}:
    get:
      tags:
      - Report
      summary: Get a report
      description: Retrieves one report by its identifier.
      operationId: getReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /report/{identifier}/resolve:
    post:
      tags:
      - Report
      summary: Resolve a report
      description: "Resolves a report, optionally applying a punishment template to\
        \ the reported player. The resolver and the punishment source are the caller\
        \ of the token."
      operationId: resolveReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolutionDTO"
        required: true
      responses:
        "200":
          description: Report successfully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "400":
          description: "A template was given for a report that is not ACTIONED, or\
            \ the template or its section does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "409":
          description: "The report is already resolved, the template's section is\
            \ disabled, or the player is already permanently punished there"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /section:
    get:
      tags:
      - Section
      summary: List punishment sections
      description: "All sections, enabled or not, sorted by key."
      operationId: listSections
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
    post:
      tags:
      - Section
      summary: Create a punishment section
      description: "Creates an enabled section with its own ELO score, thresholds\
        \ and enforcement kind. A SERVER section lists glob patterns (targetKind PATTERN,\
        \ the default) or exact CloudNet task, group or service names."
      operationId: createSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionCreateRequest"
        required: true
      responses:
        "200":
          description: Section created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "409":
          description: A section with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/update:
    post:
      tags:
      - Section
      summary: Update a punishment section
      description: "Replaces every editable field of an existing section, including\
        \ whether it is enabled."
      operationId: updateSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdateRequest"
        required: true
      responses:
        "200":
          description: Section updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}:
    get:
      tags:
      - Section
      summary: Get a punishment section
      operationId: getSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}/disable:
    post:
      tags:
      - Section
      summary: Disable a punishment section
      description: Rejects new template applications and score deltas for the section.
        Existing active punishments stay enforced until they expire or are lifted.
      operationId: disableSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Section disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /staff-discord-link/code:
    post:
      tags:
      - Discord link
      summary: Issue a Discord link code
      description: "Issues the signed-in staff member a short-lived, single-use code\
        \ (8 characters, shown as ABCD-EFGH) to type as /link in Discord. A new code\
        \ replaces the caller's previous one. Only a signed-in person can link; a\
        \ service principal gets 403. The code is returned only here and stored only\
        \ as a hash."
      operationId: issueStaffDiscordLinkCode
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkCodeResponse"
        "403":
          description: The caller is not a signed-in person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /staff-discord-link/me:
    get:
      tags:
      - Discord link
      summary: Own Discord link status
      description: Whether the caller has a linked Discord account. Never contains
        a code or a Discord id.
      operationId: getOwnStaffDiscordLink
      responses:
        "200":
          description: The link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkStatusResponse"
    delete:
      tags:
      - Discord link
      summary: Unlink own Discord account
      description: Removes the caller's Discord link and with it the stored Discord
        user id.
      operationId: unlinkOwnStaffDiscordLink
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: The caller has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /staff-link/by-minecraft/{uuid}:
    get:
      tags:
      - Staff link
      summary: Who is a Minecraft account
      description: "Called by the Velocity proxy for /blackhole whoami: whether the\
        \ account is linked and to which staff member."
      operationId: lookupStaffLinkByMinecraft
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link status of the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkLookupResponse"
  /staff-link/code:
    post:
      tags:
      - Staff link
      summary: Issue a Minecraft link code
      description: "Issues the signed-in staff member a short-lived, single-use code\
        \ (8 characters, shown as ABCD-EFGH) to type in game with /blackhole link.\
        \ A new code replaces the caller's previous one. Only a signed-in person can\
        \ link; a service principal gets 403. The code is returned only here and stored\
        \ only as a hash."
      operationId: issueStaffLinkCode
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkCodeResponse"
        "403":
          description: The caller is not a signed-in person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/confirm:
    post:
      tags:
      - Staff link
      summary: Confirm a link code
      description: "Called by the Velocity proxy only. Binds the Minecraft UUID in\
        \ onBehalfOf (the player who typed the code) to the staff member the code\
        \ was issued to, replacing any earlier link of either side. A wrong, expired\
        \ or already used code is answered identically with INVALID_CODE."
      operationId: confirmStaffLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLinkConfirmRequest"
        required: true
      responses:
        "200":
          description: The link now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkConfirmResponse"
        "400":
          description: "onBehalfOf is missing, or the code is invalid, expired or\
            \ used (kind INVALID_CODE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
        "409":
          description: A concurrent confirmation took the account; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/me:
    get:
      tags:
      - Staff link
      summary: Own Minecraft link status
      description: Whether the caller has a linked Minecraft account. Never contains
        a code.
      operationId: getOwnStaffLink
      responses:
        "200":
          description: The link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkStatusResponse"
    delete:
      tags:
      - Staff link
      summary: Unlink own Minecraft account
      description: Removes the caller's link. Actions already attributed to the caller
        stay attributed.
      operationId: unlinkOwnStaffLink
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: The caller has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-profile/me:
    get:
      tags:
      - Staff profile
      summary: Own staff profile
      description: "The caller's display name and avatar choice. An account without\
        \ a name has none: the name is never copied from the sign-in."
      operationId: getOwnStaffProfile
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileResponse"
        "403":
          description: The caller is a service principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
    put:
      tags:
      - Staff profile
      summary: Save own staff profile
      description: "Sets the display name (2 to 32 characters, unique ignoring case,\
        \ no reserved words or markup) and the avatar mode. The staff notice must\
        \ be acknowledged before the first save."
      operationId: saveOwnStaffProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileResponse"
        "400":
          description: The avatar mode is unknown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "403":
          description: The caller is a service principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "409":
          description: Another staff member already uses the name (kind NAME_TAKEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
        "422":
          description: The name breaks a rule (NAME_NOT_ALLOWED) or the notice was
            not acknowledged (NOTICE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfileError"
  /template:
    get:
      tags:
      - Punishment Templates
      summary: Get all punishment templates
      description: Retrieves a paginated list of all punishment templates in the system
      operationId: getAllTemplates
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplatePage"
    post:
      tags:
      - Punishment Templates
      summary: Create punishment template
      description: Creates a temporary punishment template in a section. The escalation
        group defaults to the key.
      operationId: addTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateCreateRequest"
        required: true
      responses:
        "200":
          description: Template successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: "Invalid template (also when an identifier is supplied, or\
            \ the section is unknown)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: A template with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/delete/{identifier}:
    delete:
      tags:
      - Punishment Templates
      summary: Delete punishment template
      description: Deletes a punishment template by its identifier
      operationId: deleteTemplate
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: At least one punishment still references this template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/update:
    post:
      tags:
      - Punishment Templates
      summary: Update punishment template
      description: Replaces every editable field of an existing template.
      operationId: updateTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateUpdateRequest"
        required: true
      responses:
        "200":
          description: Template successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: Invalid template (also when the identifier is missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: Another template already uses this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/{identifier}:
    get:
      tags:
      - Punishment Templates
      summary: Get punishment template by ID
      description: Retrieves a specific punishment template by its identifier
      operationId: getTemplateById
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /warn/pending:
    get:
      tags:
      - Warning
      summary: List a player's pending warnings
      description: "The warnings of one player that nobody has confirmed yet, oldest\
        \ first, at most limit (default 10, at most 50). A player with more pending\
        \ warnings sees the rest on the next login. Only the proxy may read it."
      operationId: listPendingWarnings
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
          description: "The hashed player, SHA-512 as 128 hex characters"
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          description: "At most this many warnings; 10 when absent, at most 50"
          format: int32
          nullable: true
      responses:
        "200":
          description: The pending warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningPending"
        "400":
          description: Invalid owner (a SHA-512 hash) or limit (1 to 50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningError"
  /warn/{id}:
    get:
      tags:
      - Warning
      summary: Get a warning
      description: "One warning with its reason, the staff member who gave it, when,\
        \ and when the player confirmed it (null while pending). The proxy reads the\
        \ reason here before it shows the warning in game."
      operationId: getWarning
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningResponse"
        "404":
          description: No such warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningError"
  /warn/{id}/acknowledge:
    post:
      tags:
      - Warning
      summary: Record the player's confirmation of a warning
      description: Called by the proxy when the player clicks Acknowledge. The first
        confirmation sets the time and is recorded on the case; a repeat keeps the
        first time and answers the same. A warning of another player is reported as
        unknown. Only the proxy may call it.
      operationId: acknowledgeWarning
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningAcknowledgeRequest"
        required: true
      responses:
        "204":
          description: The confirmation is stored
        "400":
          description: Invalid owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningError"
        "404":
          description: No such warning for this player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningError"
        "200":
          description: acknowledgeWarning 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarningDTO"
components:
  schemas:
    ActivePunishmentError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
