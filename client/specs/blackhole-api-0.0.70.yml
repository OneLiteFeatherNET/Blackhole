          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError"
  /intel/policy:
    get:
      tags:
      - Intel
      summary: "Read the login policy per VPN, hosting and proxy class"
      description: "One policy per class: ALLOW, FLAG or DENY. A class without a stored\
        \ row is FLAG."
      operationId: getIntelPolicies
      responses:
