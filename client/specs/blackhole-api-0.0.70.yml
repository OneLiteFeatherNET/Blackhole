openapi: 3.0.1
info:
  title: Blackhole API
  description: Simple ban management system
  contact:
    name: Management
    url: https://onelitefeather.net
    email: admin@onelitefeather.net
  license:
    name: Close Source
  version: 0.0.28
security:
- bearerAuth: []
paths:
  /admin/audit:
    get:
      tags:
      - Audit
      summary: List the staff audit log
      description: "Staff actions, newest first, one cursor page at a time. Filter\
        \ by action, actor or target. Read only: an entry is never edited or deleted\
        \ here. The cursor is opaque; pass the nextCursor of the previous page."
      operationId: listStaffAudit
      parameters:
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: cursor
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: action
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: actorOid
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: targetRef
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditError"
  /admin/audit/{auditId}:
    get:
      tags:
      - Audit
      summary: One staff audit entry
      description: "One entry of the audit log by its audit id, with the fields of\
        \ the list item. Read only."
      operationId: getStaffAuditEntry
      parameters:
      - name: auditId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditItem"
        "400":
          description: The audit id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditError"
        "404":
          description: "NOT_FOUND: there is no such entry"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditError"
  /admin/discord-link:
    get:
      tags:
      - Discord link
      summary: List Discord links
      description: Every staff and player link with the staff members' names. A Discord
        user id is never returned.
      operationId: listDiscordLinks
      responses:
        "200":
          description: "The links, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkListResponse"
  /admin/discord-link/{id}:
    delete:
      tags:
      - Discord link
      summary: Remove a Discord link
      description: Removes one link and with it the stored Discord user id.
      operationId: removeDiscordLink
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: There is no such link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /admin/import/punishments:
    get:
      tags:
      - Import
      summary: List imported punishments without a template
      description: "Groups the punishments imported from a vanilla ban list that are\
        \ linked to no template by their original reason, the largest group first."
      operationId: listImportedPunishmentGroups
      responses:
        "200":
          description: The groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentGroups"
  /admin/import/punishments/retemplate:
    post:
      tags:
      - Import
      summary: Link imported punishments to a template
      description: "Links imported punishments that have no template to a template,\
        \ either every one with an original reason or an explicit selection. Only\
        \ the template changes: no score, step, duration or section. Each change is\
        \ recorded on the case as punishment.retemplated with the caller as actor.\
        \ A punishment that already has a template is never overwritten, so repeating\
        \ a request changes nothing."
      operationId: retemplateImportedPunishments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportedPunishmentRetemplateRequest"
        required: true
      responses:
        "200":
          description: What was linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentRetemplateResponse"
        "400":
          description: "Neither or both of reason and identifiers, or the template\
            \ is in a mute section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
        "409":
          description: The template's section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedPunishmentError"
  /admin/rollback/preview:
    post:
      tags:
      - Rollback
      summary: Preview a rollback of one staff member's punishments
      description: "Counts what a rollback would undo for one staff member, or for\
        \ the Minecraft account of an unlinked in-game actor, in a time window. Nothing\
        \ is revoked. The matching revocable punishments are frozen into a job that\
        \ expires after the preview time-to-live. The admin who asks is the caller\
        \ of the token."
      operationId: previewRollback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackPreviewRequest"
        required: true
      responses:
        "201":
          description: The preview and its frozen job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackPreviewResponse"
        "400":
          description: "Invalid request, or the selector is a service principal such\
            \ as the proxy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "422":
          description: The preview matches more punishments than the maximum; narrow
            the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "200":
          description: previewRollback 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackDTO"
  /admin/rollback/{id}:
    get:
      tags:
      - Rollback
      summary: Get the progress of a rollback
      description: "The job's state and how many of its items are pending, revoked,\
        \ skipped or failed."
      operationId: getRollback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackProgress"
        "404":
          description: No such rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
  /admin/rollback/{id}/cancel:
    post:
      tags:
      - Rollback
      summary: Cancel a rollback
      description: Stops a preview or a running rollback before its next item. Items
        already revoked stay revoked.
      operationId: cancelRollback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The rollback was cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackCancelled"
        "404":
          description: No such rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "409":
          description: The rollback is already completed or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
  /admin/rollback/{id}/execute:
    post:
      tags:
      - Rollback
      summary: Start a previewed rollback
      description: "Confirms a preview with a reason and starts it. A scheduled runner\
        \ then revokes the frozen punishments one batch at a time, each through the\
        \ manual revoke path. The Idempotency-Key header is required; a repeat with\
        \ the same key answers the same job and writes nothing. Poll GET /admin/rollback/{id}\
        \ for progress."
      operationId: executeRollback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: 1 to 64 characters; required
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackExecuteRequest"
        required: true
      responses:
        "202":
          description: "The rollback is running, or the same start was repeated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackStarted"
        "400":
          description: "Missing Idempotency-Key, or a reason that is not 1 to 500\
            \ characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "404":
          description: No such rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "409":
          description: "The preview expired, or the rollback was already started"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackError"
        "200":
          description: executeRollback 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackDTO"
  /admin/staff-actor:
    get:
      tags:
      - Auth
      summary: List staff actors
      description: "Every verified staff principal the backend has seen, with the\
        \ display name kept for it (absent once anonymized), its kind and when it\
        \ was first and last seen. Most recently seen first."
      operationId: listStaffActors
      responses:
        "200":
          description: The known staff principals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorListResponse"
  /admin/staff-actor/{oid}:
    get:
      tags:
      - Auth
      summary: One staff actor
      description: "The known staff principal with this object id, with the fields\
        \ of the list item."
      operationId: getStaffActor
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The staff actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorItem"
        "400":
          description: The object id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorError"
        "404":
          description: "NOT_FOUND: unknown staff actor"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorError"
  /admin/staff-actor/{oid}/anonymize:
    post:
      tags:
      - Auth
      summary: Anonymize a staff actor
      description: "Clears the stored display name of a staff principal (leaving staff,\
        \ erasure request). The object id and every record that references it stay.\
        \ The action is audited with the admin's own object id."
      operationId: anonymizeStaffActor
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The display name was cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorAnonymizeResponse"
        "404":
          description: Unknown staff actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorError"
  /admin/staff-link:
    get:
      tags:
      - Staff link
      summary: List staff links
      description: "Every staff member's linked Minecraft account, with the staff\
        \ member's display name."
      operationId: listStaffLinks
      responses:
        "200":
          description: "The links, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkListResponse"
  /admin/staff-link/{oid}:
    delete:
      tags:
      - Staff link
      summary: Unlink a staff member
      description: Removes the link of any staff member. Actions already attributed
        to them stay attributed. Audited with the admin's own object id.
      operationId: unlinkStaffLink
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: That staff member has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /appeal:
    get:
      tags:
      - Appeal
      summary: Get all appeals
      description: Retrieves a paginated list of appeals
      operationId: getAppeals
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved appeals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealDTO"
    post:
      tags:
      - Appeal
      summary: Submit an appeal
      description: Submits an appeal against a punishment. Immediately evaluated against
        the eligibility checklist.
      operationId: submitAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionDTO"
        required: true
      responses:
        "200":
          description: Appeal submitted (status reflects whether it passed the eligibility
            checklist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Punishment not found
  /appeal-conditions:
    get:
      tags:
      - AppealConditions
      summary: The current appeal conditions
      description: The newest version of the conditions a player confirms before filing
        an appeal.
      operationId: currentAppealConditions
      responses:
        "200":
          description: The current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditions"
    post:
      tags:
      - AppealConditions
      summary: Save the appeal conditions as a new version
      description: Creates the next version; no version is ever overwritten.
      operationId: saveAppealConditions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealConditionsRequest"
        required: true
      responses:
        "200":
          description: The new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditions"
        "400":
          description: "The text is empty, too long or has a control character"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
        "409":
          description: Another save took the version number; review and save again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
  /appeal-conditions/versions:
    get:
      tags:
      - AppealConditions
      summary: All versions of the appeal conditions
      description: "Every version, newest first. Versions are never changed or removed."
      operationId: listAppealConditionVersions
      responses:
        "200":
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealConditions"
  /appeal-conditions/versions/{version}:
    get:
      tags:
      - AppealConditions
      summary: One version of the appeal conditions
      description: "The text of one saved version, by its number. A saved version\
        \ never changes."
      operationId: getAppealConditionVersion
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditions"
        "400":
          description: The version is not an integer of 1 or more
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
        "404":
          description: "NOT_FOUND: there is no such version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealConditionsError"
  /appeal/{identifier}:
    get:
      tags:
      - Appeal
      summary: Get one appeal
      description: "One appeal by its identifier, with its evidence count. Holds no\
        \ Ban ID and no raw player UUID."
      operationId: getAppeal
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "400":
          description: The identifier is not a UUID
        "404":
          description: There is no such appeal
  /appeal/{identifier}/review:
    post:
      tags:
      - Appeal
      summary: Review an appeal
      description: Decides an eligible appeal. Rejects self-review (the caller's oid
        matching the punishment's source or the principal that recorded it) and full
        lifts of SEVERE punishments (duration reduction only).
      operationId: reviewAppeal
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealReviewDTO"
        required: true
      responses:
        "200":
          description: Appeal decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Appeal not found
        "400":
          description: "Invalid decision, or a full lift was attempted on a SEVERE\
            \ punishment"
        "403":
          description: The caller issued the punishment (self-review)
        "409":
          description: "Appeal is not awaiting review, or the punishment is no longer\
            \ active"
        "422":
          description: "The playerMessage contains a UUID, an IP address or a Ban\
            \ ID; the appeal stays undecided"
  /area-bans:
    get:
      tags:
      - Area bans
      summary: List the area bans that apply now
      description: "Every unlifted ban of an ASN or a country that has not expired.\
        \ With includeInactive=true, the lifted and expired bans are listed too, newest\
        \ first."
      operationId: listAreaBans
      parameters:
      - name: includeInactive
        in: query
        description: true to include the lifted and expired bans
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: The area bans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanListResponse"
    post:
      tags:
      - Area bans
      summary: Ban an autonomous system or a country
      description: "A moderator may ban one ASN for up to seven days. An admin may\
        \ ban a country, or an ASN without a limit."
      operationId: createAreaBan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBanCreateRequest"
        required: true
      responses:
        "200":
          description: The ban applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanResponse"
        "400":
          description: "The kind, the value, the reason or the duration is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
        "403":
          description: "FORBIDDEN_KIND: a moderator asked for a country. FORBIDDEN_DURATION:\
            \ a moderator asked for a permanent ban, or one over seven days"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
        "409":
          description: "CONFLICT: the area is already banned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
  /area-bans/{id}:
    get:
      tags:
      - Area bans
      summary: One area ban
      description: "The area ban with this id, lifted and expired ones included. The\
        \ id is the one the list returns."
      operationId: getAreaBan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The area ban
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanResponse"
        "400":
          description: The id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
        "404":
          description: "NOT_FOUND: there is no such area ban"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
  /area-bans/{id}/lift:
    post:
      tags:
      - Area bans
      summary: Lift an area ban
      description: A reason is required. The ban stays in the history.
      operationId: liftAreaBan
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaBanLiftRequest"
        required: true
      responses:
        "200":
          description: The ban is lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanResponse"
        "400":
          description: The id or the reason is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
        "404":
          description: "NOT_FOUND: no such area ban"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
        "409":
          description: "CONFLICT: the ban is already lifted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaBanError"
  /auth/me:
    get:
      tags:
      - Auth
      summary: Who am I
      description: "The object id, display name and internal roles of the caller.\
        \ Answers 200 with an empty role list when the token is valid but maps to\
        \ no role, so a client can show a no-access page."
      operationId: getCurrentCaller
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: "No valid token, or the token has no object id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /case:
    get:
      tags:
      - Case
      summary: List cases
      description: "Lists cases, newest activity first. Every filter is optional.\
        \ punishmentState is ACTIVE, EXPIRED or LIFTED."
      operationId: listCases
      parameters:
      - name: status
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
      - name: assignee
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: tag
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: priority
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CasePriority"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: punishmentState
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: owner
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: One page of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListPage"
        "400":
          description: A filter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/bulk:
    post:
      tags:
      - Case
      summary: Change several cases
      description: "Applies one change (status, assignee, priority, tags to add or\
        \ remove) to 1 to 100 cases, each with its own expectedVersion. Each case\
        \ is changed on its own, with its event and audit entry; a conflict or failure\
        \ of one case does not stop the others. The answer has one item per case,\
        \ in request order. Not one transaction."
      operationId: bulkUpdateCases
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseBulkRequest"
        required: true
      responses:
        "200":
          description: One outcome per case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBulkResult"
        "400":
          description: "No case, more than 100, a duplicate, no change, or an invalid\
            \ tag; nothing changed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "422":
          description: The assignee is not a known human staff member; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/groups:
    get:
      tags:
      - Case
      summary: List players with cases
      description: "One group per player that has a case matching the filters, newest\
        \ activity first. openCount counts the cases whose status is not CLOSED, totalCount\
        \ all matching cases. Paging is over players. Expand a group with GET /case?owner=<owner>.\
        \ The filters are the same as the case list."
      operationId: listCaseGroups
      parameters:
      - name: status
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
      - name: assignee
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: tag
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: priority
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CasePriority"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: punishmentState
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: One page of groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseGroupPage"
        "400":
          description: A filter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}:
    get:
      tags:
      - Case
      summary: Get a case
      description: The case of a punishment with its metadata and up to 20 other punishments
        of the same player. A punishment without a case row reads as the default case
        (version 0); a read never creates one.
      operationId: getCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
    patch:
      tags:
      - Case
      summary: Change a case
      description: "Sets status, assignee, priority and tags. expectedVersion must\
        \ be the version that was read; a value equal to the current one changes nothing\
        \ and appends no event. Each change appends its event in the same statement."
      operationId: updateCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdateRequest"
        required: true
      responses:
        "200":
          description: The case after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: Invalid tags or no expectedVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: "The case was changed since expectedVersion, or the short id\
            \ is ambiguous"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "422":
          description: The assignee is not a known human staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/attachments:
    post:
      tags:
      - Case
      summary: Upload a file for a chat message
      description: "Stages one file (PNG, JPEG, WebP, PDF or UTF-8 text, at most 10\
        \ MiB) for the case's conversation as multipart form data. The type is detected\
        \ from the bytes, the file is virus scanned before it is stored, images lose\
        \ their metadata, and a PDF that names active content is refused. The answer\
        \ holds the attachmentId to send in attachmentIds of POST /case/{reference}/messages;\
        \ the player sees the file once that message is posted, and the panel must\
        \ warn the moderator before sending. A quota bounds how many files wait and\
        \ how many a case holds."
      operationId: uploadCaseAttachment
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The file was staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAttachmentStaged"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: "QUOTA: too many files wait or the case holds the maximum,\
            \ or the short id is ambiguous"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit, or an image has too many\
            \ pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: "The detected type is not allowed (video, archives, SVG, other)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "FILE_FLAGGED by the virus scanner, FILE_ACTIVE_CONTENT in\
            \ a PDF, or not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable (nothing
            is stored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /case/{reference}/ban-id/leak:
    post:
      tags:
      - Case
      summary: Mark the Ban ID leaked
      description: "Records ban_id.leak_marked with a reason code and sets the leak\
        \ state of the case. Marking an already leaked Ban ID changes nothing (changed:\
        \ false). Before an appeal the right to appeal is forfeited, after filing\
        \ the ticket is frozen for the player. The Ban ID itself is never in the request,\
        \ the response or the event."
      operationId: markCaseBanIdLeaked
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseBanIdLeakRequest"
        required: true
      responses:
        "200":
          description: "The leak is marked (changed: false when it already was)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBanIdLeakResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/ban-id/reissue:
    post:
      tags:
      - Case
      summary: Reissue the Ban ID
      description: "Replaces the Ban ID, raises its generation, clears the leak state\
        \ and records ban_id.reissued with the generation numbers. The old Ban ID\
        \ stops working at once. The new one is not returned: reveal it with GET /punishment/{reference}/ban-id."
      operationId: reissueCaseBanId
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseBanIdReissueRequest"
        required: true
      responses:
        "200":
          description: A new Ban ID was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBanIdReissueResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The punishment has no Ban ID yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "503":
          description: No free Ban ID could be drawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/events:
    get:
      tags:
      - Case
      summary: Live updates of a case
      description: "A text/event-stream with the same frames as the player's stream:\
        \ retry, ready {\"seq\"}, changed {\"seq\"} (id = seq) for every change of\
        \ the case, including internal notes and the player's seen marker, a keep-alive\
        \ every 15 seconds. The frames carry no content: after a changed event read\
        \ GET /case/{reference} or the timeline with the cursor. Token refresh is\
        \ the client's job: a stream is opened with a current token and ends after\
        \ its maximum lifetime."
      operationId: caseEvents
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The token is missing or invalid
        "403":
          description: The caller's role may not read cases
        "404":
          description: Unknown punishment
        "503":
          description: The replica holds its maximum of streams; poll instead
  /case/{reference}/evidence-shares:
    get:
      tags:
      - Case
      summary: List the shares of a case
      description: "Lists the shares oldest first with their state: ACTIVE, REVOKED,\
        \ or UNAVAILABLE when the evidence was deleted."
      operationId: listEvidenceShares
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareList"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
    post:
      tags:
      - Case
      summary: Share evidence with the player
      description: "Shows one chat capture (selected lines, at most 20) or one team\
        \ screenshot to the player of the case's appeal. confirmedMinimised must be\
        \ true. The share is one case event (evidence.shared) without content, and\
        \ can be revoked. An identical active share answers the existing one with\
        \ repeated: true."
      operationId: shareEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceShareRequest"
        required: true
      responses:
        "200":
          description: The share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShare"
        "400":
          description: NOT_CONFIRMED or BAD_SELECTION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "404":
          description: Unknown punishment or evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "409":
          description: "NO_APPEAL, FROZEN (Ban ID marked leaked) or NOT_VALID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "422":
          description: "NOT_SHAREABLE (anticheat, replay, link, transcript, video,\
            \ a player's own file) or PII_REJECTED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/evidence-shares/preview:
    post:
      tags:
      - Case
      summary: Preview what a share would show
      description: "Returns exactly the lines and labels (or the image facts) the\
        \ player would see for a selection of a chat capture: the appealing speaker\
        \ as You, the others as Player 2, Player 3, times as offsets, plain text.\
        \ Changes nothing."
      operationId: previewEvidenceShare
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSharePreviewRequest"
        required: true
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSharePreview"
        "400":
          description: "BAD_SELECTION: no lines, more than the maximum, a line twice\
            \ or outside, no valid appealing speaker"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "404":
          description: Unknown punishment or evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "409":
          description: "NOT_VALID: the evidence is lifted or revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
        "422":
          description: "NOT_SHAREABLE, or PII_REJECTED (a line holds a UUID or an\
            \ IP; only its index is named)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/evidence-shares/{shareId}/revoke:
    post:
      tags:
      - Case
      summary: Revoke a share
      description: "Withdraws a share at once: the player's next read shows an empty\
        \ card and the file route answers 404. It cannot take back what the player\
        \ already saw or saved. Revoking again changes nothing and answers the share\
        \ as revoked."
      operationId: revokeEvidenceShare
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceShareRevokeRequest"
        required: true
      responses:
        "200":
          description: "The share, revoked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShare"
        "404":
          description: Unknown punishment or share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceShareError"
  /case/{reference}/messages:
    post:
      tags:
      - Case
      summary: Reply to the player
      description: "Adds a message of 1 to 2000 characters that the player can read\
        \ (visibility is always PLAYER; a body field cannot change that, staff-internal\
        \ text is a note). It must not contain a UUID, an IP address or a Ban ID.\
        \ The optional Idempotency-Key makes a repeated post a no-op that answers\
        \ with the first message."
      operationId: postCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        schema:
          type: string
          nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRequest"
        required: true
      responses:
        "200":
          description: "The message was stored (repeated: true when the key had posted\
            \ it before)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "400":
          description: Invalid text or Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/messages/{messageId}:
    put:
      tags:
      - Case
      summary: Correct a staff message
      description: "Appends a new version of a staff message; the earlier versions\
        \ stay. Only the verified author or an admin may, never a player's message,\
        \ and not once the message is deleted or redacted."
      operationId: editCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRequest"
        required: true
      responses:
        "200":
          description: The message was edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "403":
          description: "Not the author (and not an admin), or a player's message"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The message was deleted or redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
    delete:
      tags:
      - Case
      summary: Delete a staff message
      description: "Appends message.deleted: the player sees the message removed,\
        \ staff see its last text marked deleted. Same rules as an edit."
      operationId: deleteCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The message was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageResponse"
        "403":
          description: "Not the author (and not an admin), or a player's message"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "409":
          description: The message was already deleted or redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/messages/{messageId}/redact:
    post:
      tags:
      - Case
      summary: Redact a message
      description: "Removes the text of every version of a message for data protection,\
        \ keeping type, time, author kind and visibility, and appends message.redacted.\
        \ The reason is a code. Repeating it is harmless."
      operationId: redactCaseMessage
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRedactRequest"
        required: true
      responses:
        "200":
          description: The message was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseMessageRedactResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment or message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/notes:
    post:
      tags:
      - Case
      summary: Add a note
      description: Adds an internal staff note of 1 to 4000 characters. It must not
        contain a UUID or an IP address.
      operationId: addCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}:
    put:
      tags:
      - Case
      summary: Edit a note
      description: Appends a new version of the note; the earlier versions stay. Only
        the verified author or an admin may edit.
      operationId: editCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "403":
          description: The caller is neither the author nor an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}/redact:
    post:
      tags:
      - Case
      summary: Redact a note
      description: "Removes the text of every version of a note for data protection,\
        \ keeping type, time and actor, and appends a note.redacted event. The reason\
        \ is a code. Repeating it is harmless."
      operationId: redactCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRedactRequest"
        required: true
      responses:
        "200":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRedactResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/participants/{participantId}/erase:
    post:
      tags:
      - Case
      summary: Erase a conversation participant
      description: Removes the Discord user id and the display name of the participant
        and marks it erased. The timeline keeps its structure with an anonymous author
        and its timestamps; the stored protocols are purged and regenerated. Message
        text is redacted separately. Erasing an erased participant changes nothing.
      operationId: eraseCaseParticipant
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: participantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The participant is erased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantErased"
        "404":
          description: Unknown punishment or participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseParticipantError"
  /case/{reference}/protocol:
    get:
      tags:
      - Case
      summary: List the stored protocols of a case
      description: "The readable versions of the protocols of every appeal of the\
        \ case, newest first. A version that a redaction made unreadable is not listed."
      operationId: listCaseProtocols
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The readable versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolList"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/protocol/{evidenceId}:
    get:
      tags:
      - Case
      summary: Open the text of a stored protocol
      description: "The human-readable rendering of one version, addressed by its\
        \ evidence id. Writes a VIEWED audit entry. The response is never cached."
      operationId: openCaseProtocol
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolText"
        "404":
          description: "Unknown punishment, unknown protocol, or a version a redaction\
            \ made unreadable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/protocol/{evidenceId}/download:
    get:
      tags:
      - Case
      summary: Download a stored protocol
      description: "The text or the JSON of one version as an attachment, with X-Content-Type-Options:\
        \ nosniff, Content-Security-Policy: sandbox and Cache-Control: private, no-store.\
        \ Writes a DOWNLOADED audit entry."
      operationId: downloadCaseProtocol
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: "The file (Content-Disposition: attachment)"
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
        "404":
          description: "Unknown punishment, unknown protocol, or a version a redaction\
            \ made unreadable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseProtocolError"
  /case/{reference}/ticket/freeze:
    put:
      tags:
      - Case
      summary: Lock or unlock the ticket channel
      description: Sets (frozen true) or clears (frozen false) the staff lock of the
        appeal ticket of the case. A repeated value changes nothing and answers the
        current state. A freeze made by the leak check cannot be unlocked by staff
        (409 FREEZE_BY_LEAK). The Discord bot names the staff member with onBehalfOf.
      operationId: setStaffTicketFreeze
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTicketFreezeRequest"
        required: true
      responses:
        "200":
          description: The state afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketResponse"
        "400":
          description: onBehalfOf from a caller that is not the Discord bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketError"
        "403":
          description: "The Discord bot named no staff member, or the staff member\
            \ has no live link or no fresh moderator role (STAFF_NOT_ELIGIBLE, STAFF_ROLE_STALE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketError"
        "404":
          description: "Unknown case, or the case has no open ticket"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketError"
        "409":
          description: "FREEZE_BY_LEAK: a leak freeze is not lifted by an unlock"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTicketError"
  /case/{reference}/timeline:
    get:
      tags:
      - Case
      summary: Read the timeline of a case
      description: "Events in timeline order (occurredAt, then seq), 50 per page by\
        \ default and at most 200. Follow nextCursor for the next page. type may repeat\
        \ and takes exact types or the groups note, appeal, evidence, case and punishment."
      operationId: getCaseTimeline
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: type
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: actorTrust
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: from
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: to
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: order
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTimelinePage"
        "400":
          description: A filter or the cursor is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/transcript:
    get:
      tags:
      - Case
      summary: Export the transcript
      description: "The conversation and lifecycle of the case in order, as a JSON\
        \ or text attachment. Notes are left out unless includeNotes is set; redacted\
        \ entries are markers without text. Every export appends transcript.exported\
        \ (actor, format, entry count, no content) first. The response is never cached."
      operationId: exportCaseTranscript
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: format
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: includeNotes
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      responses:
        "200":
          description: "The transcript file (Content-Disposition: attachment, Cache-Control:\
            \ no-store)"
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        "400":
          description: Unknown format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /case/{reference}/transcript/erase-player:
    post:
      tags:
      - Case
      summary: Erase the player's side of the conversation
      description: Redacts every message the player wrote in this case in one statement
        (staff messages stay) and appends message.redacted for each. The reason is
        a code.
      operationId: eraseCasePlayerMessages
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseMessageRedactRequest"
        required: true
      responses:
        "200":
          description: The player messages were redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTranscriptEraseResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseConversationError"
  /client-rule:
    get:
      tags:
      - ClientRule
      summary: List client rules
      description: "All rules, enabled or not, sorted by key. Refreshes the enabled\
        \ rules in the shared cache that proxies read."
      operationId: listClientRules
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientRuleResponse"
    post:
      tags:
      - ClientRule
      summary: Create a client rule
      description: "Creates an enabled rule. The action defaults to NOTIFY and the\
        \ scope to GLOBAL. Brand, channel and mod values are chosen by the client\
        \ and can be faked, so a TEMPLATE action on them needs acknowledgedSpoofable.\
        \ Admins only."
      operationId: createClientRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleCreateRequest"
        required: true
      responses:
        "200":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "400":
          description: "Invalid rule, unknown section or template"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
        "409":
          description: A rule with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
  /client-rule/catalogue:
    get:
      tags:
      - ClientRule
      summary: Get the client rule catalogue
      description: "The merged view of all live proxy snapshots, for the rule editor.\
        \ available is false when none is known or the cache is down."
      operationId: getClientRuleCatalogue
      responses:
        "200":
          description: The merged catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueResponse"
    put:
      tags:
      - ClientRule
      summary: Report a proxy's client rule catalogue
      description: "Replaces the calling proxy's snapshot of the brands, channels,\
        \ commands and protocol versions it has seen. Brands and channels seen from\
        \ fewer than three distinct players are dropped. It expires unless the proxy\
        \ reports again. Proxy tokens only."
      operationId: reportClientRuleCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleCatalogueReportRequest"
        required: true
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueStored"
        "400":
          description: Invalid name or snapshot too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleCatalogueError"
  /client-rule/hit:
    post:
      tags:
      - ClientRule
      summary: Report a client rule hit
      description: "Stores the hit without any client trait and counts it on the rule.\
        \ For a TEMPLATE rule the backend applies the rule's template once while the\
        \ player has no active punishment from that rule, and never for a bypassed\
        \ player. Proxy tokens only."
      operationId: reportClientRuleHit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleHitCreateRequest"
        required: true
      responses:
        "200":
          description: Hit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitRecorded"
        "400":
          description: Malformed owner or server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
        "404":
          description: No enabled rule has that key; nothing is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /client-rule/hits:
    get:
      tags:
      - ClientRule
      summary: Rule hits of one player
      description: "The newest hits of a player over all rules, newest first (at most\
        \ 500, default 100)."
      operationId: listClientRuleHitsOfOwner
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHits"
        "400":
          description: owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /client-rule/{key}:
    get:
      tags:
      - ClientRule
      summary: Get a client rule
      operationId: getClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
    put:
      tags:
      - ClientRule
      summary: Update a client rule
      description: "Replaces every editable field of the rule, including whether it\
        \ is enabled. The body key must equal the path key. Admins only."
      operationId: updateClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRuleUpdateRequest"
        required: true
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "400":
          description: "Invalid rule, unknown section or template"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
    delete:
      tags:
      - ClientRule
      summary: Delete a client rule
      description: "Removes the rule with its patterns, servers and sections. Admins\
        \ only."
      operationId: deleteClientRule
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The removed rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleError"
  /client-rule/{key}/hits:
    get:
      tags:
      - ClientRule
      summary: Hits of one rule
      description: "The newest hits of a rule, newest first (at most 500, default\
        \ 100). Hits expire after the retention period."
      operationId: listClientRuleHits
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHits"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRuleHitError"
  /cloudnet/catalogue:
    get:
      tags:
      - CloudNet
      summary: Get the CloudNet catalogue
      description: The merged view of all live proxy snapshots. available is false
        when none is known or the cache is down.
      operationId: getCloudNetCatalogue
      responses:
        "200":
          description: The merged catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueResponse"
    put:
      tags:
      - CloudNet
      summary: Report a proxy's CloudNet catalogue
      description: "Replaces the calling proxy's snapshot of CloudNet tasks, groups\
        \ and services. It expires after 15 minutes unless the proxy reports again.\
        \ Proxy tokens only."
      operationId: reportCloudNetCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueReportRequest"
        required: true
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueStored"
        "400":
          description: Invalid name or snapshot too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Dashboard summary
      description: "Active punishments per section, open reports, pending appeals,\
        \ escalations of the last 7 days and the latest automatic permanent punishments"
      operationId: getDashboardSummary
      responses:
        "200":
          description: The current summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
  /discord/leak-check:
    post:
      tags:
      - Discord tickets
      summary: Verify Ban ID look-alikes found in a public channel
      description: "Called by the Discord bot only. Candidates that are a current\
        \ Ban ID mark the case leaked (reason POSTED_PUBLIC, source DISCORD_BOT, the\
        \ poster as an opaque participant); the answer counts matches and never names\
        \ a punishment. A candidate that is no Ban ID causes nothing and is not stored\
        \ or logged."
      operationId: checkDiscordLeak
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLeakCheckRequest"
        required: true
      responses:
        "200":
          description: How many candidates matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLeakCheckResult"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLeakCheckError"
  /discord/link/confirm:
    post:
      tags:
      - Discord link
      summary: Confirm a Discord link code
      description: "Called by the Discord bot only. Binds the Discord user (the one\
        \ who typed /link) to the staff member or player the code was issued to, replacing\
        \ any earlier link of either side. A wrong, expired or already used code is\
        \ answered identically with INVALID_CODE."
      operationId: confirmDiscordLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordLinkConfirmRequest"
        required: true
      responses:
        "200":
          description: The link now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkConfirmResponse"
        "400":
          description: "The Discord user id is malformed, or the code is invalid,\
            \ expired or used (kind INVALID_CODE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
        "409":
          description: A concurrent confirmation took the account; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /discord/link/{discordUserId}:
    get:
      tags:
      - Discord link
      summary: What a Discord user is linked to
      description: "Called by the Discord bot for /whoami: the kinds of link this\
        \ Discord user has and, for a staff link, the staff member's name."
      operationId: lookupDiscordLink
      parameters:
      - name: discordUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The links of the Discord user, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkWhoamiResponse"
    delete:
      tags:
      - Discord link
      summary: Unlink a Discord user
      description: "Called by the Discord bot for /unlink: removes every link of the\
        \ Discord user and with it the stored Discord user id."
      operationId: unlinkDiscordUser
      parameters:
      - name: discordUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The links were removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkRemovedResponse"
        "404":
          description: The Discord user has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /discord/notifications/appeal/{identifier}:
    get:
      tags:
      - Discord notifications
      summary: Facts for an appeal notification
      description: "Called by the Discord bot only, after an appeal.submitted or appeal.resolved\
        \ event. Returns the appellant's name when one was recorded (otherwise a short\
        \ pseudonymous reference), the section, a shortened statement, the status\
        \ and the punishment identifier for the case link. Never a Ban ID."
      operationId: getAppealNotification
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The appeal facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordAppealNotification"
        "404":
          description: There is no such appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordNotificationError"
  /discord/notifications/report/{identifier}:
    get:
      tags:
      - Discord notifications
      summary: Facts for a report notification
      description: "Called by the Discord bot only, after a report.created or report.resolved\
        \ event. Returns the reported player's name when one was recorded (otherwise\
        \ a short pseudonymous reference), the category, a shortened description and\
        \ the status. Never a raw UUID."
      operationId: getReportNotification
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The report facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordReportNotification"
        "404":
          description: There is no such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordNotificationError"
  /discord/staff-links:
    get:
      tags:
      - Discord tickets
      summary: Live staff links
      description: "The Discord accounts of staff members with a live link, for the\
        \ bot's channel access reconcile: only these accounts, when they also hold\
        \ the staff role, may be in ticket channels."
      operationId: listDiscordStaffLinks
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStaffLinksResponse"
  /discord/staff-links/{discordUserId}:
    get:
      tags:
      - Discord tickets
      summary: Staff member of a Discord account
      description: "The staff member linked to this Discord user, with whether a press\
        \ would be allowed now. The bot asks once per press. The Discord id is in\
        \ the path only and never in the answer."
      operationId: lookupDiscordStaffLink
      parameters:
      - name: discordUserId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The linked staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStaffLookupResponse"
        "404":
          description: No live staff link for this Discord user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordLinkError"
  /discord/tickets:
    get:
      tags:
      - Discord tickets
      summary: List tickets
      description: "Tickets in the given states, oldest first; without a state the\
        \ pending, open, closing and closed ones. The bot reads them at start to catch\
        \ up."
      operationId: listDiscordTickets
      parameters:
      - name: state
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/TicketState"
      responses:
        "200":
          description: The tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketList"
    post:
      tags:
      - Discord tickets
      summary: Open a ticket with a private Ban ID
      description: "The Ban ID is checked exactly like the portal login. A wrong,\
        \ unknown, leaked or already bound Ban ID all answer 404 NOT_ELIGIBLE, so\
        \ the reply is no oracle. An open appeal is reused; otherwise a statement\
        \ (1 to 2000 characters) files one under the portal's rules, and an appeal\
        \ that is not possible yet answers 409 NOT_YET with availableFrom and records\
        \ nothing. The user who already has the ticket gets it again with created\
        \ false. The ticket starts PENDING_CHANNEL; ticket.opened is on the timeline."
      operationId: openDiscordTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketOpenRequest"
        required: true
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketOpened"
        "400":
          description: "Malformed request, or no statement / an invalid statement\
            \ (STATEMENT_REQUIRED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: "NOT_ELIGIBLE: the uniform failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "NOT_YET: the appeal is possible from availableFrom"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}:
    get:
      tags:
      - Discord tickets
      summary: Read a ticket
      operationId: getDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicket"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
    patch:
      tags:
      - Discord tickets
      summary: "Report the channel, change the state or the freeze"
      description: "Reports the channel id (PENDING_CHANNEL becomes OPEN), mirrors\
        \ the freeze, moves the state (OPEN to CLOSING to CLOSED, CLOSED to ARCHIVED,\
        \ ARCHIVED to DELETED) or reports that a person deleted the channel (channelGone).\
        \ ARCHIVED needs a stored protocol and DELETED a current one, both answered\
        \ 409 PROTOCOL_REQUIRED otherwise. Repeating a change that is already true\
        \ is a no-op."
      operationId: patchDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketPatchRequest"
        required: true
      responses:
        "200":
          description: The ticket afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicket"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "INVALID_STATE, PROTOCOL_REQUIRED or CHANNEL_TAKEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/attachments:
    post:
      tags:
      - Discord tickets
      summary: Store a file the channel sent
      description: "Only the bound player and verified staff may send a file; anyone\
        \ else gets 403 FILE_NOT_ACCEPTED. The file goes through the chat pipeline\
        \ (scan, type, size, sanitising) and is stored bound to the case, idempotent\
        \ per Discord attachment id: a replay answers the same attachmentId. The bot\
        \ then ingests the message naming that attachmentId. The Discord id is not\
        \ stored."
      operationId: uploadDiscordTicketAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  nullable: true
                discordAttachmentId:
                  type: string
                authorDiscordUserId:
                  type: string
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: The stored file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketAttachment"
        "400":
          description: "A file the pipeline refused (TOO_LARGE, UNSUPPORTED_TYPE,\
            \ INVALID_FILE, FILE_FLAGGED, FILE_ACTIVE_CONTENT) or a malformed request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "403":
          description: "FILE_NOT_ACCEPTED: the author is neither the bound player\
            \ nor verified staff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "QUOTA, or the channel is deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: "The scanner or the store is unavailable: nothing was stored,\
            \ retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/attachments/{attachmentId}:
    get:
      tags:
      - Discord tickets
      summary: Fetch a file of the ticket's case
      description: "A file of a message the player can see, or the image of an active\
        \ share, of this ticket's case. Served with the chat headers (inline only\
        \ for PNG, JPEG and WebP; nosniff; sandbox; no-store). Anything else is 404."
      operationId: getDiscordTicketAttachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown ticket or file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The file could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/close:
    post:
      tags:
      - Discord tickets
      summary: Close with the completeness proof
      description: "Accepted only when count and lastMessageId equal the backend's\
        \ own tally of the channel's messages: records ticket.transcript_complete\
        \ and, in the same request, generates and stores the protocol, answering its\
        \ version. A mismatch answers 409 TRANSCRIPT_MISMATCH and records nothing.\
        \ 503 when the protocol could not be stored (the event stays; repeat the call,\
        \ it is idempotent). protocolVersion is null while the appeal is undecided:\
        \ do not archive then."
      operationId: closeDiscordTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketCloseRequest"
        required: true
      responses:
        "200":
          description: The transcript is complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketClosed"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: TRANSCRIPT_MISMATCH (with the backend's tally) or INVALID_STATE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The protocol could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/links:
    post:
      tags:
      - Discord tickets
      summary: Report a relay
      description: "Advances the ticket's relayed_seq to at least seq and, for a posted\
        \ message, links the case message to the Discord message. The cursor only\
        \ moves forward; linking twice changes nothing."
      operationId: linkDiscordTicketMessage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordTicketLinkRequest"
        required: true
      responses:
        "200":
          description: The cursor afterwards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketLinked"
        "400":
          description: Half a link or a malformed id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/messages:
    post:
      tags:
      - Discord tickets
      summary: Ingest the messages of the channel
      description: "Records what was written in the channel, idempotent by Discord\
        \ message id: a new message becomes message.added (channel DISCORD, the Discord\
        \ timestamp as time), a known one with a different text message.edited, a\
        \ reported deletion message.deleted (contentUnavailable when it was never\
        \ recorded). With complete true and presentMessageIds, recorded messages missing\
        \ from the channel are recorded as deleted (detectedAtCatchup). Never post\
        \ the bot's own messages."
      operationId: ingestDiscordTicketMessages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordIngestRequest"
        required: true
      responses:
        "200":
          description: What was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordIngestResult"
        "400":
          description: Malformed batch (nothing was recorded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: The channel is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/outbox:
    get:
      tags:
      - Discord tickets
      summary: Events to relay into the channel
      description: "The player-visible events of the case after afterSeq (the ticket's\
        \ relayed_seq when omitted), with their text, in order. A message written\
        \ in Discord is never in it. Acknowledge each with POST .../links."
      operationId: getDiscordTicketOutbox
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: afterSeq
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: limit
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordOutbox"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /discord/tickets/{id}/protocol/ensure:
    post:
      tags:
      - Discord tickets
      summary: Make sure the protocol is current
      description: "Regenerates the protocol when the conversation changed since the\
        \ stored version (forced, no settle delay) and answers the current version.\
        \ Call it before deleting a channel; the delete is refused with 409 PROTOCOL_REQUIRED\
        \ otherwise."
      operationId: ensureDiscordTicketProtocol
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketProtocolEnsured"
        "404":
          description: Unknown ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "409":
          description: "PROTOCOL_REQUIRED: the appeal is undecided or the transcript\
            \ is not verified complete"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
        "503":
          description: The protocol could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordTicketError"
  /elo/chat:
    post:
      tags:
      - Elo
      summary: Score a chat message for toxicity
      description: "Scores a chat message; if flagged, records evidence (a hash, never\
        \ the raw text) and applies a delta in the configured chat section"
      operationId: submitChatSignal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloChatSignalRequest"
        required: true
      responses:
        "200":
          description: Scoring result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloChatSignalResponse"
  /elo/{owner}:
    get:
      tags:
      - Elo
      summary: Get a player's current ELO standing
      description: The player's score in every enabled section with that section's
        thresholds. A section the player was never scored in reports its base score.
      operationId: getEloProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current ELO standing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloProfileResponse"
  /elo/{owner}/adjust:
    post:
      tags:
      - Elo
      summary: Adjust a player's score by hand
      description: "Applies a signed delta to the player's score in one section, recorded\
        \ as a MANUAL_ADJUSTMENT and subject to the same soft and permanent threshold\
        \ rules as any other delta. The adjusting staff member is the caller of the\
        \ token."
      operationId: adjustElo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloAdjustRequest"
        required: true
      responses:
        "200":
          description: The score change and any automatic punishment it caused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloAdjustResponse"
        "400":
          description: Invalid adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "404":
          description: Unknown section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "409":
          description: The section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
  /elo/{owner}/history:
    get:
      tags:
      - Elo
      summary: Get a player's ELO history
      description: "The audit trail of ELO changes for this owner, optionally restricted\
        \ to one section"
      operationId: getEloHistory
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: section
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated ELO event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloEventResponse"
  /evasion/fingerprint:
    post:
      tags:
      - Evasion
      summary: Submit the client traits of a player for the client fingerprint
      description: "The proxy sends the brand, the registered plugin channels and\
        \ the legacy mod list. The backend hashes them with its own fingerprint key\
        \ and stores only the keyed hash with the hashed owner; the raw values are\
        \ never stored, logged or returned. Generic traits (plain vanilla, fabric,\
        \ forge, neoforge) are not stored. Proxy tokens only."
      operationId: submitClientFingerprint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFingerprintCreateRequest"
        required: true
      responses:
        "200":
          description: Processed; stored is false for generic traits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintResponse"
        "400":
          description: "Malformed owner, oversized brand or list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintError"
        "503":
          description: BLACKHOLE_FINGERPRINT_KEY is not configured - client fingerprinting
            is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientFingerprintError"
  /evasion/record:
    post:
      tags:
      - Evasion
      summary: Record a login sighting for ban-evasion detection
      description: Computes a keyed hash of the IP (never stores it raw) and checks
        whether multiple distinct owners share it recently
      operationId: recordEvasionSighting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvasionRecordDTO"
        required: true
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
        "503":
          description: blackhole.evasion.ip-salt is not configured - evasion detection
            is disabled
  /evasion/{owner}/sightings:
    get:
      tags:
      - Evasion
      summary: List evasion sightings for a player
      description: "The other owners that shared a hashed network address with this\
        \ owner inside the detection window. Only owner hashes are returned, never\
        \ an IP or its token."
      operationId: listEvasionSightings
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The linked owners, possibly none"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvasionSightingsResponse"
        "400":
          description: The owner is not a 128 character hex hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvasionSightingsError"
  /evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of an owner
      description: "Lists every evidence item of an owner hash, for data-subject access\
        \ requests. Lifted and revoked evidence is hidden unless includeInactive is\
        \ true; asking for it is audited."
      operationId: listOwnerEvidence
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    post:
      tags:
      - Evidence
      summary: Attach evidence
      description: "Attaches an anticheat record, chat excerpt, replay link or other\
        \ link to a punishment, given by its identifier or short id, or sent ahead\
        \ of the punishment under an owner hash and a correlation id (pass the same\
        \ id as evidenceCorrelationId when applying the punishment). Files go through\
        \ /evidence/file."
      operationId: attachEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceCreateRequest"
        required: true
      responses:
        "200":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: "Invalid request, target or payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: The payload is larger than the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: The payload contains personal data (a UUID or IP address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/file:
    post:
      tags:
      - Evidence
      summary: Upload an evidence file
      description: "Uploads a screenshot (PNG, JPEG) or video (MP4, WebM) as multipart\
        \ form data. Send the text fields (punishment, or owner and correlationId;\
        \ sourceSystem; capturedAt; description; onBehalfOf) before the file part.\
        \ The type is detected from the file's bytes, images are re-encoded without\
        \ metadata, and the file is virus scanned before it is stored."
      operationId: uploadEvidenceFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                punishment:
                  type: string
                  nullable: true
                owner:
                  type: string
                  nullable: true
                correlationId:
                  type: string
                  nullable: true
                sourceSystem:
                  type: string
                  nullable: true
                capturedAt:
                  type: integer
                  format: int64
                  nullable: true
                description:
                  type: string
                  nullable: true
                onBehalfOf:
                  type: string
                  format: uuid
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: Invalid request or target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit for its type, or has too\
            \ many pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: The file's detected type is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "The virus scanner flagged the file, or it is not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/owner/{owner}:
    delete:
      tags:
      - Evidence
      summary: Delete all evidence of an owner
      description: Deletes every evidence item and file of an owner hash (data-subject
        erasure). Same required reason and per-item audit as deleting one item.
      operationId: deleteOwnerEvidence
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted; the count may be zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: "The reason is missing or invalid, or the owner is not a hash;\
            \ nothing was deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; deletion stopped at the first
            file it could not delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}:
    get:
      tags:
      - Evidence
      summary: Get one evidence item
      description: "The metadata and payload of one evidence item, whatever its status."
      operationId: getEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    delete:
      tags:
      - Evidence
      summary: Delete an evidence item
      description: "Deletes one item and its file. A reason (ERASURE_REQUEST, WRONG_EVIDENCE,\
        \ OTHER) is required and recorded, with the optional note, in the audit trail.\
        \ Nothing is erased automatically for data-subject requests: the operator\
        \ decides each one."
      operationId: deleteEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: The reason is missing or invalid; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; the item was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}/content:
    get:
      tags:
      - Evidence
      summary: Download an evidence file
      description: "Streams the stored file through the backend (there are no presigned\
        \ links). Supports a single HTTP Range so videos can be scrubbed. Sent with\
        \ nosniff, a sandboxing Content-Security-Policy and no-store; images and videos\
        \ are served inline, so the type is the detected one."
      operationId: downloadEvidenceFile
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Unknown evidence, or it has no file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "416":
          description: The range starts behind the end of the file
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /exemption/report:
    post:
      tags:
      - Exemption
      summary: Report the permission exemption of an online player
      description: Called by the proxy at login and with each enforcement request.
        Replaces the permission rows of the owner; empty flags remove them. Linked-staff
        rows are not changed.
      operationId: reportPlayerExemption
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionReportRequest"
        required: true
      responses:
        "200":
          description: The status after the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionStatusResponse"
        "400":
          description: The owner or a flag is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
        "403":
          description: The caller is not the proxy
  /exemption/reviews:
    get:
      tags:
      - Exemption
      summary: Open exemption reviews
      description: "Automatic punishments held back for exempt players, oldest first.\
        \ Only an admin may decide them."
      operationId: listExemptionReviews
      responses:
        "200":
          description: The open reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionReviewListResponse"
  /exemption/reviews/{id}:
    get:
      tags:
      - Exemption
      summary: One exemption review
      description: "One item of the admin queue in any state: open, applied or dismissed.\
        \ Holds the owner hash and the section, never a name or an address."
      operationId: getExemptionReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionReviewResponse"
        "400":
          description: The id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
        "403":
          description: The caller is not an admin
        "404":
          description: "NOT_FOUND: there is no such review"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
  /exemption/reviews/{id}/apply:
    post:
      tags:
      - Exemption
      summary: Apply a held-back punishment
      description: "Places the punishment the review stands for, with the justification\
        \ recorded on it. The review is then applied."
      operationId: applyExemptionReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionReviewDecisionRequest"
        required: true
      responses:
        "200":
          description: "The review, now applied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionReviewResponse"
        "400":
          description: The justification is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
        "404":
          description: There is no such review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
        "409":
          description: "The review was decided already, or the punishment cannot be\
            \ placed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
  /exemption/reviews/{id}/dismiss:
    post:
      tags:
      - Exemption
      summary: Dismiss a held-back punishment
      description: Closes the review without a punishment. The score change stays.
      operationId: dismissExemptionReview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionReviewDecisionRequest"
        required: true
      responses:
        "200":
          description: "The review, now dismissed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionReviewResponse"
        "404":
          description: There is no such review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
        "409":
          description: The review was decided already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
  /exemption/{owner}:
    get:
      tags:
      - Exemption
      summary: Exemption of a player
      description: "Whether a player is exempt from punishment, from linked staff\
        \ or from the proxy's permission report, with the rank that protects them.\
        \ Never contains a UUID or a name."
      operationId: getPlayerExemption
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The exemption status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionStatusResponse"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExemptionDTO.Error"
  /firewall/feed/{token}/{feed}:
    get:
      operationId: feed
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: feed
        in: path
        required: true
        schema:
          type: string
      - name: comments
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: feed 200 response
          content:
            application/json:
              schema:
                type: string
  /guard/level:
    post:
      tags:
      - Guard
      summary: Set the manual join guard level
      description: "OFF, STRICT or LOCKDOWN. Lowering a level is not restricted. The\
        \ change is recorded with the actor. The proxy and the Discord bot set it\
        \ for a staff member named by onBehalfOf."
      operationId: setJoinGuardLevel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardLevelRequest"
        required: true
      responses:
        "200":
          description: The level is in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardStateResponse"
        "400":
          description: "The level is not OFF, STRICT or LOCKDOWN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardError"
        "409":
          description: The level could not be set; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardError"
  /guard/presence:
    post:
      tags:
      - Guard
      summary: Report the staff online on one proxy
      description: Sent by each proxy every 30 seconds. The answer carries the level
        in force.
      operationId: reportJoinGuardPresence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardPresenceRequest"
        required: true
      responses:
        "200":
          description: The presence is recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardPresenceResponse"
        "400":
          description: The proxy id or the count is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardPresenceError"
  /guard/settings:
    get:
      tags:
      - Guard
      summary: Read the join guard settings
      description: "The unattended level, the absence threshold, the night window\
        \ and its zone, with the next night window as epoch milliseconds."
      operationId: getJoinGuardSettings
      responses:
        "200":
          description: The settings in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettingsResponse"
    put:
      tags:
      - Guard
      summary: Replace the join guard settings
      description: Administrators only. The whole settings object is replaced and
        the change is audited. The new values take effect at the next evaluation tick.
      operationId: updateJoinGuardSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardSettingsRequest"
        required: true
      responses:
        "200":
          description: The settings are saved and in force from the next tick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettingsResponse"
        "400":
          description: A value is outside its bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettingsError"
  /guard/state:
    get:
      tags:
      - Guard
      summary: Read the join guard level
      description: "The manual level, the unattended level and the effective level,\
        \ which is the stricter of the two."
      operationId: getJoinGuard
      responses:
        "200":
          description: The guard state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardStateResponse"
  /inbox:
    get:
      tags:
      - Inbox
      summary: Inbox
      description: "What needs attention: appeal chats awaiting a team reply, open\
        \ appeals, open reports and open cases without an assignee. Each section has\
        \ its count and its oldest 10 items. changedByOthers lists the cases and appeals\
        \ whose latest change in the last 24 hours came from another verified staff\
        \ member."
      operationId: getInbox
      responses:
        "200":
          description: The four sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxResponse"
        "503":
          description: The inbox could not be read; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxError"
  /integration/registrations:
    get:
      tags:
      - Integration
      summary: List integration registrations
      description: "Every registration, enabled or not."
      operationId: listIntegrationRegistrations
      responses:
        "200":
          description: "The registrations, ordered by source system"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationDTO.Response"
    post:
      tags:
      - Integration
      summary: Register an integration
      description: "Registers a third-party detection source and the Entra client\
        \ ids allowed to report for it, with the kinds and the server scope. The client\
        \ secret is not sent: it stays in Entra. The write is audited."
      operationId: createIntegrationRegistration
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCreateRequest"
        required: true
      responses:
        "200":
          description: The stored registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Response"
        "400":
          description: The registration breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Error"
        "409":
          description: The source system or the client id is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Error"
  /integration/registrations/{id}:
    get:
      tags:
      - Integration
      summary: Get an integration registration
      operationId: getIntegrationRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: The registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Response"
        "404":
          description: There is no registration with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Error"
    patch:
      tags:
      - Integration
      summary: Update an integration registration
      description: "Replaces the display name, the enabled flag, the kinds and the\
        \ server scope. Setting enabled to false disables every client of the registration\
        \ at once. The write is audited."
      operationId: updateIntegrationRegistration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdateRequest"
        required: true
      responses:
        "200":
          description: The stored registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Response"
        "400":
          description: The registration breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Error"
        "404":
          description: There is no registration with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDTO.Error"
  /intel/allow-list:
    get:
      tags:
      - Intel
      summary: List the VPN and hosting exemptions
      description: "The exemptions, newest first, 50 per page by default. Each entry\
        \ says whether its expiry has passed. A permanent entry never expires. Holds\
        \ the owner hash, the reason and the actor only."
      operationId: listIntelAllowList
      parameters:
      - name: page
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: One page of exemptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListPage"
        "400":
          description: The page or the size is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
    post:
      tags:
      - Intel
      summary: Exempt a player from the VPN and hosting policy
      description: "A moderator may exempt for 1 to 90 days. Only an admin may leave\
        \ durationDays out, which makes the exemption permanent. The reason is required."
      operationId: addIntelAllowListEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowListCreateRequest"
        required: true
      responses:
        "200":
          description: The exemption is stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListResponse"
        "400":
          description: "The owner, the reason or the duration is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
        "403":
          description: "FORBIDDEN_DURATION: a moderator asked for a permanent exemption"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
  /intel/allow-list/{owner}:
    get:
      tags:
      - Intel
      summary: One VPN and hosting exemption
      description: "The exemption of one player by its owner hash, with the fields\
        \ of the list entry. Never a name or an address."
      operationId: getIntelAllowListEntry
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The exemption
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListEntry"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
        "404":
          description: "NOT_FOUND: the player has no exemption"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
    delete:
      tags:
      - Intel
      summary: Remove a player's VPN and hosting exemption
      description: Deletes the exemption so that the player is checked against the
        policy again at once. The removal is audited with the actor.
      operationId: removeIntelAllowListEntry
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The exemption is removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListRemoved"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
        "403":
          description: "FORBIDDEN_DURATION: a moderator asked to remove a permanent\
            \ exemption"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
        "404":
          description: "NOT_FOUND: the player has no exemption"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowListError"
  /intel/lists:
    get:
      tags:
      - Intel
      summary: Read the VPN and hosting list sources and their refresh status
      description: "Every configured source with its attribution and licence, last\
        \ attempt, last success and last error (shortened, without URL credentials),\
        \ entry and invalid counts. Status: FAILED when the last refresh returned\
        \ an error (the previous list stays in use); FRESH when the last success is\
        \ at most two refresh intervals old (12 hours at the default PT6H); otherwise\
        \ STALE, which includes a source never refreshed. The hosting ASNs from configuration\
        \ are listed read-only."
      operationId: listIntelListSources
      responses:
        "200":
          description: The sources and the hosting ASNs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStatusListing"
  /intel/login-check:
    post:
      tags:
      - Intel
      summary: "Verdict for one login: ALLOW, FLAG or DENY"
      description: "Called by the proxy after its ban check, with a short timeout.\
        \ Classifies the address offline and applies the policy. A FLAG or an allow-listed\
        \ match is recorded as a hit. Proxy tokens only."
      operationId: checkIntelLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCheckRequest"
        required: true
      responses:
        "200":
          description: The verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginCheckResponse"
        "400":
          description: The owner or the address is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginCheckError"
  /intel/names/{name}/owners:
    get:
      tags:
      - Intel
      summary: Find the accounts that used a name
      description: "The old-name lookup: the accounts that used this exact name, ignoring\
        \ case, at most 20, newest last seen first. Each entry names the account's\
        \ current name. A partial name finds nothing."
      operationId: findNameOwners
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The owners that used the name; empty when none did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameOwnersResponse"
        "400":
          description: The name is not a player name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameHistoryError"
        "404":
          description: blackhole.intel.enabled is false
  /intel/players/{owner}/hits:
    get:
      tags:
      - Intel
      summary: List the VPN and hosting hits of a player
      description: "The newest hits of one owner, at most 50. Shows the clear IP,\
        \ so staff only; a proxy may not read it."
      operationId: listIntelHitsOfPlayer
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HitPage"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HitError"
  /intel/players/{owner}/names:
    get:
      tags:
      - Intel
      summary: List the names a player account used
      description: "The names of one owner, newest last seen first, 50 per page by\
        \ default. Each name keeps its first and last login. The raw player UUID is\
        \ shown, so only staff and the proxy's staff command may read it."
      operationId: listPlayerNames
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: One page of names; an unknown owner is an empty page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameHistoryPage"
        "400":
          description: The owner or the page parameters are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NameHistoryError"
        "404":
          description: blackhole.intel.enabled is false
  /intel/players/{owner}/sessions:
    get:
      tags:
      - Intel
      summary: List the sessions of a player
      description: "The newest sessions of one owner, 50 per page by default. Shows\
        \ the raw IP and the player UUID, so only staff may read it; a proxy may not."
      operationId: listPlayerSessions
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: true
        explode: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: true
        explode: false
        schema:
          type: integer
