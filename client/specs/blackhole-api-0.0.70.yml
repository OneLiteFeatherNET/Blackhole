          format: int32
      description: The result of an admin delete.
    EvidenceError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/EvidenceErrorKind"
    EvidenceErrorKind:
      type: string
      description: "Why an evidence request failed in an expected way, so the controller\
        \ maps it 1:1 to a status. Evidence needs more statuses than the shared `ErrorKind`\
        \ offers (413, 415, 422, 503), and keeping them here leaves every other resource's\
        \ error schema untouched."
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - UNPROCESSABLE
      - FILE_FLAGGED
      - FILE_ACTIVE_CONTENT
      - QUOTA
      - UNAVAILABLE
      x-enum-descriptions:
      - The request is malformed or breaks a rule of its own (400).
      - "The punishment, evidence item or file does not exist (404)."
      - "The request conflicts with current state, for example an ambiguous short\
        \ id (409)."
      - The payload or the file is larger than the configured limit (413).
      - The detected file type is not on the allow-list (415).
      - "The content is understood but must not be stored: personal data in a payload,\
        \ malware (422)."
      - The chat upload was flagged by the virus scanner (422); the signature name
        is never shown.
      - The chat upload is a PDF that names active content or encryption (422).
      - "The appeal or case already holds as many chat files as the quota allows,\
        \ or as many are staged (409)."
      - "A dependency evidence needs (the virus scanner, the file store) is not available\
        \ (503)."
    EvidenceFile:
      required:
