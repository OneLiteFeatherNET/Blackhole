        freezeSource:
          type: string
          description: "`STAFF` or `LEAK` while frozen, `null` when not"
          nullable: true
    StepKind:
      type: string
      description: "What a template step does: a timed punishment, a kick (no duration),\
        \ or a warning (no duration, never active)."
      enum:
      - PUNISH
      - KICK
      - WARN
    TicketState:
      type: string
      description: Where a Discord ticket is in its life. Stored as text.
      enum:
      - PENDING_CHANNEL
      - OPEN
      - CLOSING
      - CLOSED
      - ARCHIVED
      - DELETED
      x-enum-descriptions:
      - The ticket exists on the case; the channel is not reported yet (a crash between
        the two steps lands here).
      - The channel exists and is in use.
      - "The bot started closing: locked, rescan running."
      - "Closed: normally with a verified transcript, after three failed rescans without.\
        \ Never re-opened."
      - Moved to the archive category; only with a stored protocol.
      - The channel is gone.
    WarningAcknowledgeRequest:
      required:
      - owner
      type: object
      properties:
        owner:
          type: string
          description: the hashed player the warning belongs to; a mismatch is refused
            like an unknown warning
      description: "The player confirms a warning. Only the proxy may send it, on\
        \ behalf of the player who clicked."
    WarningDTO:
      type: object
      description: "Warnings: told to a player in game, confirmed by the player once"
    WarningError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    WarningPending:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: the pending warnings
          items:
            $ref: "#/components/schemas/WarningResponse"
      description: "The warnings of one player that nobody has confirmed yet, oldest\
        \ first. At most the requested limit: a player with more sees the rest on\
        \ the next login."
    WarningResponse:
      required:
      - createdAt
      - id
      - owner
      - reason
      type: object
      properties:
        id:
          type: string
          description: the warning's Ban ID
        owner:
          type: string
          description: the hashed player
        reason:
          type: string
          description: "the template's reason, shown to the player; no UUID, IP address\
            \ or name beside the actor"
        actor:
          type: string
          description: "the display name of the staff member, if known"
          nullable: true
        createdAt:
          type: integer
          description: "when the warning was given, epoch milliseconds"
          format: int64
        acknowledgedAt:
          type: integer
          description: "when the player confirmed it, epoch milliseconds; `null` while\
            \ pending"
          format: int64
          nullable: true
      description: One warning and how far it got.
