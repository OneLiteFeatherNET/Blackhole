      - CHAT_LOG
      - LINK
      - FILE
      - TRANSCRIPT
      x-enum-descriptions:
      - A structured record of the check an anticheat flagged.
      - A link to a replay recording held by another system.
      - An excerpt of chat lines.
      - "Any other link, for example a message in a staff chat."
      - A screenshot or video uploaded to and stored by Blackhole.
      - "The protocol of an appeal, generated by the backend from the case events\
        \ and stored as a pair of files (text and JSON). System generated only: the\
        \ attach routes reject it, it is never marked `LIFTED` or `REVOKED` and it\
        \ is not part of the evidence count."
