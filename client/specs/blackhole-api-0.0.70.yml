          format: int32
        firstSeen:
          type: integer
          description: "Earliest sighting of the other owner on a shared address,\
            \ epoch millis"
          format: int64
        lastSeen:
          type: integer
          description: "Latest sighting of the other owner on a shared address, epoch\
            \ millis"
          format: int64
        via:
          description: "Which signal links them: IP, CLIENT (same client setup only,\
            \ a weak hint) or BOTH (the strong one)"
          allOf:
          - $ref: "#/components/schemas/EvasionSightingDTO.Via"
      description: One other owner seen on a shared hashed network address
    EvasionRecordDTO:
      required:
