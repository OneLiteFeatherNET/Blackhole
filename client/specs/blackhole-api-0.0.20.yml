      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        message:
          maxLength: 512
          minLength: 1
          type: string
    EloChatSignalResponse:
      required:
      - flagged
      - score
      type: object
      properties:
        flagged:
          type: boolean
        score:
          type: number
          format: double
    EloError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    EloEscalationInfo:
      required:
      - punishmentIdentifier
      - tier
      type: object
      properties:
        tier:
          type: string
        punishmentIdentifier:
          type: string
    EloEventResponse:
      required:
      - createdAt
      - delta
      - identifier
      - metaData
      - owner
      - reasonCode
      - resultingScore
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        owner:
          type: string
        section:
          type: string
          nullable: true
        delta:
          type: integer
          format: int32
        reasonCode:
          $ref: "#/components/schemas/EloReasonCode"
        sourceEvidenceId:
          type: string
          format: uuid
          nullable: true
        resultingScore:
          type: integer
          format: int32
        createdAt:
          type: integer
          format: int64
        metaData:
          type: object
          additionalProperties:
            type: object
    EloProfileResponse:
      required:
      - owner
      - sections
      type: object
      properties:
        owner:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/EloSectionScore"
    EloReasonCode:
      type: string
      enum:
      - TOXICITY_FLAG
      - ANTICHEAT_FLAG
      - REPORT_ACTIONED
      - MANUAL_ADJUSTMENT
      - DECAY_RECOVERY
      - THRESHOLD_BAN
      - PUNISHMENT_APPLIED
      - REPORT_REWARDED
      - PARDON_RESET
      - APPEAL_REFUND
    EloSectionScore:
      required:
      - baseScore
      - displayName
      - enforcement
      - pardonScore
      - permanentThreshold
      - score
      - section
      type: object
      properties:
        section:
          type: string
        displayName:
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        score:
          type: integer
          format: int32
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
    EnforcementKind:
      type: string
      enum:
      - MUTE
      - BAN
      - SERVER
    ErrorKind:
      type: string
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - UNAUTHORIZED
      - FORBIDDEN
      - INVALID_CODE
      - UNAVAILABLE
    ErrorResponse:
      type: object
      properties:
        The error message:
          type: string
      description: The error response when something went wrong on profile requests
    EvasionRecordDTO:
      required:
      - ip
      - owner
      type: object
      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        ip:
          minLength: 1
          type: string
    EvidenceCount:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          format: int64
    EvidenceCreateRequest:
      required:
      - kind
      - sourceSystem
      type: object
      properties:
        punishment:
          type: string
          nullable: true
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          nullable: true
          x-pattern-message: Owner must be a sha-512 hash
        correlationId:
          maxLength: 64
          minLength: 1
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        sourceSystem:
          maxLength: 64
          minLength: 1
          type: string
        capturedAt:
          type: integer
          format: int64
          nullable: true
        reference:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          nullable: true
        onBehalfOf:
          type: string
          format: uuid
          nullable: true
    EvidenceDeleteResponse:
      required:
      - deleted
      type: object
      properties:
        deleted:
          type: integer
          format: int32
    EvidenceError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/EvidenceErrorKind"
    EvidenceErrorKind:
      type: string
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - UNPROCESSABLE
      - UNAVAILABLE
    EvidenceFile:
      required:
      - contentType
      - name
      - sha256
      - size
      type: object
      properties:
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
    EvidenceKind:
      type: string
      enum:
      - ANTICHEAT
      - REPLAY
      - CHAT_LOG
      - LINK
      - FILE
    EvidencePage:
      required:
      - items
      - page
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalSize:
          type: integer
          format: int64
