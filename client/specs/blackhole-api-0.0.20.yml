openapi: 3.0.1
info:
  title: Blackhole API
  description: Simple ban management system
  contact:
    name: Management
    url: https://onelitefeather.net
    email: admin@onelitefeather.net
  license:
    name: Close Source
  version: 0.0.20
security:
- bearerAuth: []
paths:
  /admin/staff-actor/{oid}/anonymize:
    post:
      tags:
      - Auth
      summary: Anonymize a staff actor
      description: "Clears the stored display name of a staff principal (leaving staff,\
        \ erasure request). The object id and every record that references it stay.\
        \ The action is audited with the admin's own object id."
      operationId: anonymizeStaffActor
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The display name was cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorAnonymizeResponse"
        "404":
          description: Unknown staff actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffActorError"
  /admin/staff-link:
    get:
      tags:
      - Staff link
      summary: List staff links
      description: "Every staff member's linked Minecraft account, with the staff\
        \ member's display name."
      operationId: listStaffLinks
      responses:
        "200":
          description: "The links, oldest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkListResponse"
  /admin/staff-link/{oid}:
    delete:
      tags:
      - Staff link
      summary: Unlink a staff member
      description: Removes the link of any staff member. Actions already attributed
        to them stay attributed. Audited with the admin's own object id.
      operationId: unlinkStaffLink
      parameters:
      - name: oid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: That staff member has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /appeal:
    get:
      tags:
      - Appeal
      summary: Get all appeals
      description: Retrieves a paginated list of appeals
      operationId: getAppeals
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved appeals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealDTO"
    post:
      tags:
      - Appeal
      summary: Submit an appeal
      description: Submits an appeal against a punishment. Immediately evaluated against
        the eligibility checklist.
      operationId: submitAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionDTO"
        required: true
      responses:
        "200":
          description: Appeal submitted (status reflects whether it passed the eligibility
            checklist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Punishment not found
  /appeal/{identifier}/review:
    post:
      tags:
      - Appeal
      summary: Review an appeal
      description: Decides an eligible appeal. Rejects self-review (the caller's oid
        matching the punishment's source or the principal that recorded it) and full
        lifts of SEVERE punishments (duration reduction only).
      operationId: reviewAppeal
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealReviewDTO"
        required: true
      responses:
        "200":
          description: Appeal decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Appeal not found
        "400":
          description: "Invalid decision, or a full lift was attempted on a SEVERE\
            \ punishment"
        "403":
          description: The caller issued the punishment (self-review)
        "409":
          description: "Appeal is not awaiting review, or the punishment is no longer\
            \ active"
  /auth/me:
    get:
      tags:
      - Auth
      summary: Who am I
      description: "The object id, display name and internal roles of the caller.\
        \ Answers 200 with an empty role list when the token is valid but maps to\
        \ no role, so a client can show a no-access page."
      operationId: getCurrentCaller
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: "No valid token, or the token has no object id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /case:
    get:
      tags:
      - Case
      summary: List cases
      description: "Lists cases, newest activity first. Every filter is optional.\
        \ punishmentState is ACTIVE, EXPIRED or LIFTED."
      operationId: listCases
      parameters:
      - name: status
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
      - name: assignee
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: tag
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: priority
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CasePriority"
      - name: section
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: punishmentState
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      responses:
        "200":
          description: One page of cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListPage"
        "400":
          description: A filter is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}:
    get:
      tags:
      - Case
      summary: Get a case
      description: The case of a punishment with its metadata and up to 20 other punishments
        of the same player. A punishment without a case row reads as the default case
        (version 0); a read never creates one.
      operationId: getCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
    patch:
      tags:
      - Case
      summary: Change a case
      description: "Sets status, assignee, priority and tags. expectedVersion must\
        \ be the version that was read; a value equal to the current one changes nothing\
        \ and appends no event. Each change appends its event in the same statement."
      operationId: updateCase
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseUpdateRequest"
        required: true
      responses:
        "200":
          description: The case after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseResponse"
        "400":
          description: Invalid tags or no expectedVersion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: "The case was changed since expectedVersion, or the short id\
            \ is ambiguous"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "422":
          description: The assignee is not a known human staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes:
    post:
      tags:
      - Case
      summary: Add a note
      description: Adds an internal staff note of 1 to 4000 characters. It must not
        contain a UUID or an IP address.
      operationId: addCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}:
    put:
      tags:
      - Case
      summary: Edit a note
      description: Appends a new version of the note; the earlier versions stay. Only
        the verified author or an admin may edit.
      operationId: editCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteRequest"
        required: true
      responses:
        "200":
          description: The note was edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteResponse"
        "400":
          description: Invalid text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "403":
          description: The caller is neither the author nor an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/notes/{noteId}/redact:
    post:
      tags:
      - Case
      summary: Redact a note
      description: "Removes the text of every version of a note for data protection,\
        \ keeping type, time and actor, and appends a note.redacted event. The reason\
        \ is a code. Repeating it is harmless."
      operationId: redactCaseNote
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRedactRequest"
        required: true
      responses:
        "200":
          description: The note was redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseRedactResponse"
        "400":
          description: No reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment or note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /case/{reference}/timeline:
    get:
      tags:
      - Case
      summary: Read the timeline of a case
      description: "Events in timeline order (occurredAt, then seq), 50 per page by\
        \ default and at most 200. Follow nextCursor for the next page. type may repeat\
        \ and takes exact types or the groups note, appeal, evidence, case and punishment."
      operationId: getCaseTimeline
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          nullable: true
      - name: type
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: actorTrust
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: from
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: to
        in: query
        explode: false
        schema:
          type: integer
          format: int64
          nullable: true
      - name: order
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseTimelinePage"
        "400":
          description: A filter or the cursor is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseError"
  /cloudnet/catalogue:
    get:
      tags:
      - CloudNet
      summary: Get the CloudNet catalogue
      description: The merged view of all live proxy snapshots. available is false
        when none is known or the cache is down.
      operationId: getCloudNetCatalogue
      responses:
        "200":
          description: The merged catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueResponse"
    put:
      tags:
      - CloudNet
      summary: Report a proxy's CloudNet catalogue
      description: "Replaces the calling proxy's snapshot of CloudNet tasks, groups\
        \ and services. It expires after 15 minutes unless the proxy reports again.\
        \ Proxy tokens only."
      operationId: reportCloudNetCatalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueReportRequest"
        required: true
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueStored"
        "400":
          description: Invalid name or snapshot too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
        "503":
          description: "The shared cache is unavailable, retry later"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueError"
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Dashboard summary
      description: "Active punishments per section, open reports, pending appeals,\
        \ escalations of the last 7 days and the latest automatic permanent punishments"
      operationId: getDashboardSummary
      responses:
        "200":
          description: The current summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
  /elo/chat:
    post:
      tags:
      - Elo
      summary: Score a chat message for toxicity
      description: "Scores a chat message; if flagged, records evidence (a hash, never\
        \ the raw text) and applies a delta in the configured chat section"
      operationId: submitChatSignal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloChatSignalRequest"
        required: true
      responses:
        "200":
          description: Scoring result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloChatSignalResponse"
  /elo/{owner}:
    get:
      tags:
      - Elo
      summary: Get a player's current ELO standing
      description: The player's score in every enabled section with that section's
        thresholds. A section the player was never scored in reports its base score.
      operationId: getEloProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current ELO standing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloProfileResponse"
  /elo/{owner}/adjust:
    post:
      tags:
      - Elo
      summary: Adjust a player's score by hand
      description: "Applies a signed delta to the player's score in one section, recorded\
        \ as a MANUAL_ADJUSTMENT and subject to the same soft and permanent threshold\
        \ rules as any other delta. The adjusting staff member is the caller of the\
        \ token."
      operationId: adjustElo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloAdjustRequest"
        required: true
      responses:
        "200":
          description: The score change and any automatic punishment it caused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloAdjustResponse"
        "400":
          description: Invalid adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "404":
          description: Unknown section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "409":
          description: The section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
  /elo/{owner}/history:
    get:
      tags:
      - Elo
      summary: Get a player's ELO history
      description: "The audit trail of ELO changes for this owner, optionally restricted\
        \ to one section"
      operationId: getEloHistory
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: section
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated ELO event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloEventResponse"
  /evasion/record:
    post:
      tags:
      - Evasion
      summary: Record a login sighting for ban-evasion detection
      description: Computes a keyed hash of the IP (never stores it raw) and checks
        whether multiple distinct owners share it recently
      operationId: recordEvasionSighting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvasionRecordDTO"
        required: true
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
        "503":
          description: blackhole.evasion.ip-salt is not configured - evasion detection
            is disabled
  /evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of an owner
      description: "Lists every evidence item of an owner hash, for data-subject access\
        \ requests. Lifted and revoked evidence is hidden unless includeInactive is\
        \ true; asking for it is audited."
      operationId: listOwnerEvidence
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    post:
      tags:
      - Evidence
      summary: Attach evidence
      description: "Attaches an anticheat record, chat excerpt, replay link or other\
        \ link to a punishment, given by its identifier or short id, or sent ahead\
        \ of the punishment under an owner hash and a correlation id (pass the same\
        \ id as evidenceCorrelationId when applying the punishment). Files go through\
        \ /evidence/file."
      operationId: attachEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceCreateRequest"
        required: true
      responses:
        "200":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: "Invalid request, target or payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: The payload is larger than the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: The payload contains personal data (a UUID or IP address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/file:
    post:
      tags:
      - Evidence
      summary: Upload an evidence file
      description: "Uploads a screenshot (PNG, JPEG) or video (MP4, WebM) as multipart\
        \ form data. Send the text fields (punishment, or owner and correlationId;\
        \ sourceSystem; capturedAt; description; onBehalfOf) before the file part.\
        \ The type is detected from the file's bytes, images are re-encoded without\
        \ metadata, and the file is virus scanned before it is stored."
      operationId: uploadEvidenceFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                punishment:
                  type: string
                  nullable: true
                owner:
                  type: string
                  nullable: true
                correlationId:
                  type: string
                  nullable: true
                sourceSystem:
                  type: string
                  nullable: true
                capturedAt:
                  type: integer
                  format: int64
                  nullable: true
                description:
                  type: string
                  nullable: true
                onBehalfOf:
                  type: string
                  format: uuid
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: Invalid request or target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit for its type, or has too\
            \ many pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: The file's detected type is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "The virus scanner flagged the file, or it is not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/owner/{owner}:
    delete:
      tags:
      - Evidence
      summary: Delete all evidence of an owner
      description: Deletes every evidence item and file of an owner hash (data-subject
        erasure). Same required reason and per-item audit as deleting one item.
      operationId: deleteOwnerEvidence
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted; the count may be zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: "The reason is missing or invalid, or the owner is not a hash;\
            \ nothing was deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; deletion stopped at the first
            file it could not delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}:
    get:
      tags:
      - Evidence
      summary: Get one evidence item
      description: "The metadata and payload of one evidence item, whatever its status."
      operationId: getEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    delete:
      tags:
      - Evidence
      summary: Delete an evidence item
      description: "Deletes one item and its file. A reason (ERASURE_REQUEST, WRONG_EVIDENCE,\
        \ OTHER) is required and recorded, with the optional note, in the audit trail.\
        \ Nothing is erased automatically for data-subject requests: the operator\
        \ decides each one."
      operationId: deleteEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: The reason is missing or invalid; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; the item was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}/content:
    get:
      tags:
      - Evidence
      summary: Download an evidence file
      description: "Streams the stored file through the backend (there are no presigned\
        \ links). Supports a single HTTP Range so videos can be scrubbed. Sent with\
        \ nosniff, a sandboxing Content-Security-Policy and no-store; images and videos\
        \ are served inline, so the type is the detected one."
      operationId: downloadEvidenceFile
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Unknown evidence, or it has no file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "416":
          description: The range starts behind the end of the file
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /player/resolve/{name}:
    get:
      tags:
      - Player
      description: "Resolve a player name to a UUID via the configured resolver chain\
        \ (Otis, Mojang, NameMC)"
      operationId: resolvePlayer
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The player was resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveResponse"
        "404":
          description: No resolver could find a player with that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveError"
  /profile:
    get:
      tags:
      - PunishProfile
      description: Get all existing punishment profiles
      operationId: getProfiles
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishProfileResponse"
    post:
      tags:
      - PunishProfile
      description: Add a new profile for punishments
      operationId: addProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The profile which was added to the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /profile/delete/{owner}:
    delete:
      tags:
      - PunishProfile
      description: Delete a punish profile via uuid
      operationId: removeProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The deleted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/update/{owner}:
    post:
      tags:
      - PunishProfile
      description: Update a punishment profile
      operationId: updateProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}:
    get:
      tags:
      - PunishProfile
      description: Get a profile by id
      operationId: getById
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The profile which matches with the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileDTO"
        "404":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}/session:
    post:
      tags:
      - PunishProfile
      description: Records session telemetry (protocol version / client brand) for
        the dashboard
      operationId: updateSessionInfo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInfoDTO"
        required: true
      responses:
        "200":
          description: Session info recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /punishment:
    get:
      tags:
      - Punishment
      summary: Get all punishments
      description: Retrieves a paginated list of all punishment entries in the system
      operationId: getPunishments
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
  /punishment/apply:
    post:
      tags:
      - Punishment
      summary: Apply a punishment template
      description: "Applies a template to a player: creates a temporary punishment\
        \ in the template's section with the duration and ELO cost of the escalation\
        \ step the player has reached, deducts the cost, and reports the step, the\
        \ score before and after, and any permanent escalation it caused. The staff\
        \ member is the caller of the token; only the proxy may send onBehalfOf (the\
        \ in-game staff member's UUID)."
      operationId: applyPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: Punishment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentApplyResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/preview:
    post:
      tags:
      - Punishment
      summary: Preview applying a template
      description: "Answers what applying the template would do right now - the escalation\
        \ step, its cost, the resulting score and whether the player would be punished\
        \ permanently - without changing anything. Takes the same request as /punishment/apply\
        \ and fails with the same errors."
      operationId: previewPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: What applying the template would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentPreviewResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId, onBehalfOf from a caller that is not\
            \ the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/revoke:
    post:
      tags:
      - Punishment
      summary: Revoke the active punishment of a section
      description: Moves the player's active punishment in the section into history.
        Revoking a permanent punishment resets the player's score in that section
        to the section's pardon score.
      operationId: revokePunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentRevokeRequest"
        required: true
      responses:
        "200":
          description: Punishment revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentRevokeResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, onBehalfOf\
            \ from a caller that is not the proxy)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: The player has no active punishment in that section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/short/{shortId}:
    get:
      tags:
      - Punishment
      summary: Find punishments by short ID
      description: "Finds the punishments whose short ID (the # and eight hex characters\
        \ players are shown, e.g. #A1B2C3D4) matches. The # is optional and the case\
        \ is ignored. Short IDs are four bytes and can collide, so the result is a\
        \ list: empty if nothing matches, several if they collide."
      operationId: findPunishmentsByShortId
      parameters:
      - name: shortId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The matching punishments, possibly none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
        "400":
          description: "Not a short ID (exactly eight hex characters, optionally after\
            \ #)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/{reference}/evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of a punishment
      description: "Lists the evidence of a punishment (identifier or short id), oldest\
        \ first. Lifted and revoked evidence is hidden unless includeInactive is true;\
        \ asking for it is audited."
      operationId: listPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /punishment/{reference}/evidence/count:
    get:
      tags:
      - Evidence
      summary: Count the valid evidence of a punishment
      description: "The number of valid evidence items of a punishment: the only thing\
        \ a player may be told. Lifted and revoked evidence is not counted."
      operationId: countPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCount"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /report:
    get:
      tags:
      - Report
      summary: Get all reports
      description: Retrieves a paginated list of reports
      operationId: getReports
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDTO"
    post:
      tags:
      - Report
      summary: Submit a report
      description: Submits a player report. Rate-limited per reporterHash within a
        configurable time window.
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestDTO"
        required: true
      responses:
        "200":
          description: Report successfully submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "429":
          description: Rate limit exceeded for this reporter
  /report/{identifier}/resolve:
    post:
      tags:
      - Report
      summary: Resolve a report
      description: "Resolves a report, optionally applying a punishment template to\
        \ the reported player. The resolver and the punishment source are the caller\
        \ of the token."
      operationId: resolveReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolutionDTO"
        required: true
      responses:
        "200":
          description: Report successfully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "400":
          description: "A template was given for a report that is not ACTIONED, or\
            \ the template or its section does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "409":
          description: "The report is already resolved, the template's section is\
            \ disabled, or the player is already permanently punished there"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /section:
    get:
      tags:
      - Section
      summary: List punishment sections
      description: "All sections, enabled or not, sorted by key."
      operationId: listSections
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
    post:
      tags:
      - Section
      summary: Create a punishment section
      description: "Creates an enabled section with its own ELO score, thresholds\
        \ and enforcement kind. A SERVER section lists glob patterns (targetKind PATTERN,\
        \ the default) or exact CloudNet task, group or service names."
      operationId: createSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionCreateRequest"
        required: true
      responses:
        "200":
          description: Section created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "409":
          description: A section with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/update:
    post:
      tags:
      - Section
      summary: Update a punishment section
      description: "Replaces every editable field of an existing section, including\
        \ whether it is enabled."
      operationId: updateSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdateRequest"
        required: true
      responses:
        "200":
          description: Section updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}:
    get:
      tags:
      - Section
      summary: Get a punishment section
      operationId: getSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}/disable:
    post:
      tags:
      - Section
      summary: Disable a punishment section
      description: Rejects new template applications and score deltas for the section.
        Existing active punishments stay enforced until they expire or are lifted.
      operationId: disableSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Section disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /staff-link/by-minecraft/{uuid}:
    get:
      tags:
      - Staff link
      summary: Who is a Minecraft account
      description: "Called by the Velocity proxy for /blackhole whoami: whether the\
        \ account is linked and to which staff member."
      operationId: lookupStaffLinkByMinecraft
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: The link status of the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkLookupResponse"
  /staff-link/code:
    post:
      tags:
      - Staff link
      summary: Issue a Minecraft link code
      description: "Issues the signed-in staff member a short-lived, single-use code\
        \ (8 characters, shown as ABCD-EFGH) to type in game with /blackhole link.\
        \ A new code replaces the caller's previous one. Only a signed-in person can\
        \ link; a service principal gets 403. The code is returned only here and stored\
        \ only as a hash."
      operationId: issueStaffLinkCode
      responses:
        "200":
          description: The code and when it expires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkCodeResponse"
        "403":
          description: The caller is not a signed-in person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/confirm:
    post:
      tags:
      - Staff link
      summary: Confirm a link code
      description: "Called by the Velocity proxy only. Binds the Minecraft UUID in\
        \ onBehalfOf (the player who typed the code) to the staff member the code\
        \ was issued to, replacing any earlier link of either side. A wrong, expired\
        \ or already used code is answered identically with INVALID_CODE."
      operationId: confirmStaffLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLinkConfirmRequest"
        required: true
      responses:
        "200":
          description: The link now exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkConfirmResponse"
        "400":
          description: "onBehalfOf is missing, or the code is invalid, expired or\
            \ used (kind INVALID_CODE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
        "409":
          description: A concurrent confirmation took the account; try again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /staff-link/me:
    get:
      tags:
      - Staff link
      summary: Own Minecraft link status
      description: Whether the caller has a linked Minecraft account. Never contains
        a code.
      operationId: getOwnStaffLink
      responses:
        "200":
          description: The link status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkStatusResponse"
    delete:
      tags:
      - Staff link
      summary: Unlink own Minecraft account
      description: Removes the caller's link. Actions already attributed to the caller
        stay attributed.
      operationId: unlinkOwnStaffLink
      responses:
        "200":
          description: The link was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkRemovedResponse"
        "404":
          description: The caller has no link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLinkError"
  /template:
    get:
      tags:
      - Punishment Templates
      summary: Get all punishment templates
      description: Retrieves a paginated list of all punishment templates in the system
      operationId: getAllTemplates
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplatePage"
    post:
      tags:
      - Punishment Templates
      summary: Create punishment template
      description: Creates a temporary punishment template in a section. The escalation
        group defaults to the key.
      operationId: addTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateCreateRequest"
        required: true
      responses:
        "200":
          description: Template successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: "Invalid template (also when an identifier is supplied, or\
            \ the section is unknown)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: A template with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/delete/{identifier}:
    delete:
      tags:
      - Punishment Templates
      summary: Delete punishment template
      description: Deletes a punishment template by its identifier
      operationId: deleteTemplate
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: At least one punishment still references this template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/update:
    post:
      tags:
      - Punishment Templates
      summary: Update punishment template
      description: Replaces every editable field of an existing template.
      operationId: updateTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateUpdateRequest"
        required: true
      responses:
        "200":
          description: Template successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: Invalid template (also when the identifier is missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: Another template already uses this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/{identifier}:
    get:
      tags:
      - Punishment Templates
      summary: Get punishment template by ID
      description: Retrieves a specific punishment template by its identifier
      operationId: getTemplateById
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
components:
  schemas:
    ActorTrust:
      type: string
      enum:
      - VERIFIED
      - UNVERIFIED
      - SYSTEM
    AppealDTO:
      required:
      - appellantHash
      - createdAt
      - eligibilityCheckResult
      - evidenceCount
      - identifier
      - metaData
      - punishmentIdentifier
      - statement
      - status
      - updatedAt
      - verified
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        punishmentIdentifier:
          type: string
        appellantHash:
          type: string
        statement:
          type: string
        status:
          $ref: "#/components/schemas/AppealStatus"
        eligibilityCheckResult:
          type: object
          additionalProperties:
            type: object
        decidedBy:
          type: string
          format: uuid
          nullable: true
        recordedByOid:
          type: string
          format: uuid
          nullable: true
        verified:
          type: boolean
        decisionNote:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        evidenceCount:
          type: integer
          format: int64
        metaData:
          type: object
          additionalProperties:
            type: object
    AppealReviewDTO:
      required:
      - decision
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/AppealStatus"
        decisionNote:
          maxLength: 2000
          type: string
          nullable: true
        newExpirationAt:
          type: integer
          format: int64
          nullable: true
    AppealStatus:
      type: string
      enum:
      - SUBMITTED
      - ELIGIBLE_PENDING_REVIEW
      - IN_REVIEW
      - GRANTED_FULL_LIFT
      - GRANTED_DURATION_REDUCTION
      - DENIED
      - INELIGIBLE
    AppealSubmissionDTO:
      required:
      - appellantHash
      - punishmentIdentifier
      - statement
      type: object
      properties:
        punishmentIdentifier:
          minLength: 1
          type: string
        appellantHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: appellantHash must be a sha-512 hash
        statement:
          maxLength: 2000
          minLength: 1
          type: string
    AuthError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    AuthMeResponse:
      required:
      - oid
      - roles
      type: object
      properties:
        oid:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
    CaseActorInfo:
      required:
      - trust
      type: object
      properties:
        oid:
          type: string
          description: "the person, if known"
          format: uuid
          nullable: true
        name:
          type: string
          description: the display name from the staff actor; null when unknown or
            anonymized
          nullable: true
        trust:
          $ref: "#/components/schemas/ActorTrust"
      description: Who caused an event.
    CaseError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/CaseErrorKind"
    CaseErrorKind:
      type: string
      enum:
      - VALIDATION
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - UNPROCESSABLE
    CaseEventOrigin:
      type: string
      enum:
      - LIVE
      - BACKFILLED
      - RECONSTRUCTED
    CaseListItem:
      required:
      - lastActivityAt
      - priority
      - punishmentCreatedAt
      - punishmentIdentifier
      - punishmentState
      - shortId
      - status
      - tags
      type: object
      properties:
        punishmentIdentifier:
          type: string
        shortId:
          type: string
        section:
          type: string
          nullable: true
        punishmentState:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        assigneeOid:
          type: string
          format: uuid
          nullable: true
        assigneeName:
          type: string
          nullable: true
        priority:
          $ref: "#/components/schemas/CasePriority"
        tags:
          type: array
          items:
            type: string
        punishmentCreatedAt:
          type: integer
          format: int64
        lastActivityAt:
          type: integer
          format: int64
      description: One row of the case list.
    CaseListPage:
      required:
      - items
      - page
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseListItem"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalSize:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      description: One page of the case list.
    CaseNoteRequest:
      required:
      - text
      type: object
      properties:
        text:
          type: string
          description: "1 to 4000 characters, without a UUID or IP address"
      description: "Adds or edits a note. Any visibility in the body is ignored: notes\
        \ are staff only."
    CaseNoteResponse:
      required:
      - noteId
      - seq
      type: object
      properties:
        noteId:
          type: string
          description: the id of the note; the same across its edits
        seq:
          type: integer
          description: the sequence number of the event that was appended
          format: int64
      description: The result of adding or editing a note.
    CasePriority:
      type: string
      enum:
      - LOW
      - NORMAL
      - HIGH
      - URGENT
    CaseRedactRequest:
      required:
      - reason
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/NoteRedactionReason"
      description: Redacts every version of a note.
    CaseRedactResponse:
      required:
      - noteId
      - redactedVersions
      type: object
      properties:
        noteId:
          type: string
        redactedVersions:
          type: integer
          format: int32
      description: The result of a redaction.
    CaseRelated:
      required:
      - caseStatus
      - createdAt
      - identifier
      - punishmentState
      - shortId
      type: object
      properties:
        identifier:
          type: string
        shortId:
          type: string
        section:
          type: string
          nullable: true
        punishmentState:
          type: string
        caseStatus:
          type: string
        createdAt:
          type: integer
          format: int64
      description: Another punishment of the same player.
    CaseResponse:
      required:
      - ownerPrefix
      - permanent
      - priority
      - punishmentCreatedAt
      - punishmentIdentifier
      - punishmentState
      - related
      - shortId
      - status
      - tags
      - version
      type: object
      properties:
        punishmentIdentifier:
          type: string
        shortId:
          type: string
        ownerPrefix:
          type: string
          description: "the first characters of the player's hash, never the whole\
            \ hash"
        section:
          type: string
          nullable: true
        punishmentState:
          type: string
          description: "`ACTIVE`, `EXPIRED` or `LIFTED` (revoked or lifted by an appeal)"
        permanent:
          type: boolean
        punishmentCreatedAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/CaseStatus"
        assigneeOid:
          type: string
          format: uuid
          nullable: true
        assigneeName:
          type: string
          description: the assignee's display name; null when none or anonymized
          nullable: true
        priority:
          $ref: "#/components/schemas/CasePriority"
        tags:
          type: array
          items:
            type: string
        version:
          type: integer
          description: the optimistic version to send as `expectedVersion`; 0 for
            a case that has no row yet
          format: int64
        related:
          type: array
          description: "up to 20 other punishments of the same player, newest first"
          items:
            $ref: "#/components/schemas/CaseRelated"
      description: A case.
    CaseStatus:
      type: string
      enum:
      - OPEN
      - IN_REVIEW
      - WAITING
      - CLOSED
    CaseTimelineItem:
      required:
      - actor
      - identifier
      - occurredAt
      - origin
      - payload
      - payloadVersion
      - seq
      - type
      - visibility
      type: object
      properties:
        seq:
          type: integer
          description: the order within the case and part of the cursor
          format: int64
        identifier:
          type: string
          format: uuid
        type:
          type: string
          description: the dotted type such as `note.added`; unknown types are returned
            as they are
        payloadVersion:
          type: integer
          format: int32
        occurredAt:
          type: integer
          format: int64
        origin:
          $ref: "#/components/schemas/CaseEventOrigin"
        visibility:
          type: string
        actor:
          $ref: "#/components/schemas/CaseActorInfo"
        subjectId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          description: the type's body; empty after a redaction
        redactedAt:
          type: integer
          description: set when a note version was redacted
          format: int64
          nullable: true
      description: One timeline event.
    CaseTimelinePage:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseTimelineItem"
        nextCursor:
          type: string
          description: pass it as `cursor` for the next page; null on the last page
          nullable: true
      description: A page of the timeline.
    CaseUpdateRequest:
      required:
      - clearAssignee
      - expectedVersion
      type: object
      properties:
        expectedVersion:
          type: integer
          description: the `version` the caller read; a newer case answers 409
          format: int64
        status:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CaseStatus"
        assigneeOid:
          type: string
          description: "the staff member to assign: a known human `staff_actor`"
          format: uuid
          nullable: true
        clearAssignee:
          type: boolean
          description: removes the assignee (an absent `assigneeOid` cannot say that)
        priority:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CasePriority"
        tags:
          type: array
          description: "the full new tag list: at most 10 slugs of `[a-z0-9-]{1,32}`"
          nullable: true
          items:
            type: string
      description: Changes the staff metadata. Every field but `expectedVersion` is
        optional; a field that is absent or equals the current value changes nothing.
    CatalogueError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    CatalogueReportRequest:
      required:
      - proxyId
      type: object
      properties:
        proxyId:
          minLength: 1
          type: string
        tasks:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CatalogueTask"
        groups:
          type: array
          nullable: true
          items:
            type: string
        services:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CatalogueServiceReport"
      description: "A full snapshot, never a delta"
    CatalogueResponse:
      required:
      - available
      - groups
      - proxies
      - services
      - tasks
      type: object
      properties:
        available:
          type: boolean
        reportedAt:
          type: string
          format: date-time
          nullable: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueTask"
        groups:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueService"
        proxies:
          type: array
          items:
            type: string
      description: The merged view of every live proxy snapshot; available is false
        when none exists
    CatalogueService:
      required:
      - name
      - running
      type: object
      properties:
        name:
          type: string
        task:
          type: string
          nullable: true
        running:
          type: boolean
    CatalogueServiceReport:
      required:
      - name
      - running
      type: object
      properties:
        name:
          type: string
        task:
          type: string
          nullable: true
        groups:
          type: array
          nullable: true
          items:
            type: string
        running:
          type: boolean
    CatalogueStored:
      required:
      - proxyId
      - reportedAt
      type: object
      properties:
        proxyId:
          type: string
        reportedAt:
          type: string
          format: date-time
    CatalogueTask:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        groups:
          type: array
          nullable: true
          items:
            type: string
    DashboardEscalation:
      required:
      - identifier
      - owner
      - section
      type: object
      properties:
        identifier:
          type: string
        owner:
          type: string
          description: Hashed owner; open the player detail with it
        section:
          type: string
        createdAt:
          type: integer
          description: Creation time in epoch millis
          format: int64
        lifted:
          type: boolean
          description: Whether it has been revoked or lifted since
      description: An automatic permanent punishment
    DashboardSectionCount:
      required:
      - active
      - section
      type: object
      properties:
        section:
          type: string
        active:
          type: integer
          format: int64
      description: Active punishments held in one section
    DashboardSummaryResponse:
      required:
      - activePunishmentsBySection
      - latestEscalations
      type: object
      properties:
        activePunishmentsBySection:
          type: array
          description: Active punishments per section sorted by key; enabled sections
            are zero-filled
          items:
            $ref: "#/components/schemas/DashboardSectionCount"
        openReports:
          type: integer
          description: Reports that are OPEN or UNDER_REVIEW
          format: int64
        pendingAppeals:
          type: integer
          description: "Appeals that are submitted, eligible or in review"
          format: int64
        escalationsLast7Days:
          type: integer
          description: Automatic permanent punishments created in the last 7 days
          format: int64
        latestEscalations:
          type: array
          description: "Most recent automatic permanent punishments, newest first"
          items:
            $ref: "#/components/schemas/DashboardEscalation"
    EloAdjustRequest:
      required:
      - delta
      - section
      type: object
      properties:
        section:
          minLength: 1
          type: string
        delta:
          type: integer
          format: int32
        note:
          maxLength: 500
          type: string
          nullable: true
    EloAdjustResponse:
      required:
      - scoreAfter
      - scoreBefore
      - section
      type: object
      properties:
        section:
          type: string
        scoreBefore:
          type: integer
          format: int32
        scoreAfter:
          type: integer
          format: int32
        escalation:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EloEscalationInfo"
    EloChatSignalRequest:
      required:
      - message
      - owner
