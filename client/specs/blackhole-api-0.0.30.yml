      - text
      type: object
      properties:
        seq:
          type: integer
          description: the order and the paging cursor
          format: int64
        occurredAt:
          type: string
          description: an ISO instant
        kind:
          type: string
          description: "`MESSAGE`, or a marker: `APPEAL_FILED`, `APPEAL_DECIDED`,\
