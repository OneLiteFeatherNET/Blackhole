          type: integer
          description: how many imported punishments have no template
          format: int32
        groups:
          type: array
          description: "the groups, the largest first"
          items:
            $ref: "#/components/schemas/ImportedPunishmentGroup"
      description: "Imported punishments without a template, grouped by their original\
        \ reason."
    ImportedPunishmentRetemplateRequest:
      required:
