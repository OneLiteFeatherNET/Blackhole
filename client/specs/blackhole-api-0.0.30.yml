        author:
          $ref: "#/components/schemas/PublicConversationDTO.Author"
        messageId:
          type: string
          description: "the message, the same across its edits; null for a marker"
          nullable: true
        text:
          type: string
          description: the current text with every edit folded in; null for a marker
