      - unchanged
      type: object
      properties:
        templateKey:
          type: string
          description: the template they were linked to
        matched:
          type: integer
          description: the punishments the request selected
          format: int32
        retemplated:
          type: integer
          description: linked to the template now
          format: int32
        unchanged:
          type: integer
          description: already linked to this template
          format: int32
        skipped:
          type: integer
          description: "left alone: not an imported punishment, linked to another\
            \ template, or in another section than the template"
          format: int32
      description: "What a bulk link did. Running the same request again links nothing:\
        \ those already linked are `unchanged`."
    NoteRedactionReason:
      type: string
      description: "Why an admin redacted a note: a code, never free text (the reason\
