    SectionUpdateRequest:
      required:
      - baseScore
      - decayPerDay
      - displayName
      - enabled
      - enforcement
      - key
      - pardonScore
      - permanentReason
      - permanentThreshold
      type: object
      properties:
        key:
          minLength: 1
          type: string
        displayName:
          minLength: 1
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        targetKind:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ServerTargetKind"
        servers:
          type: array
          nullable: true
          items:
            type: string
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        softDuration:
          type: string
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
