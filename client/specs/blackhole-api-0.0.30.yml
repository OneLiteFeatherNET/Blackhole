      type: object
      properties:
        templateKey:
          minLength: 1
          type: string
          description: the template to link them to; it must not be in a mute section
        reason:
          maxLength: 1000
          type: string
          description: link every imported punishment without a template whose original
            reason is this text
          nullable: true
        identifiers:
          maxItems: 500
          type: array
          description: |-
            link exactly these punishments (at most

            ```
            #MAX_SELECTION
            ```

            )
          nullable: true
          items:
            type: string
      description: Links imported punishments to a template. Exactly one of `reason`
        and `identifiers` is required.
    ImportedPunishmentRetemplateResponse:
      required:
