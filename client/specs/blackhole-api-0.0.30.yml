          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    PunishTemplatePage:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        content:
          type: array
          description: the templates of this page
          items:
            $ref: "#/components/schemas/PunishTemplateResponse"
        totalSize:
          type: integer
          description: the number of templates across all pages
          format: int64
        totalPages:
          type: integer
          description: the number of pages
          format: int32
        pageNumber:
          type: integer
          description: the zero-based number of this page
          format: int32
        size:
          type: integer
          description: the requested page size
          format: int32
        offset:
          type: integer
          description: the index of the first template of this page
          format: int64
        numberOfElements:
          type: integer
          description: the number of templates on this page
          format: int32
        empty:
          type: boolean
          description: whether this page has no templates
      description: "Documents the body of `GET /template`: the JSON Micronaut Data's\
        \ `Page` serialises to, with the templates under `content`. Never instantiated\
        \ - the controller returns the `Page` itself, so this exists only to give\
        \ the published spec the real shape instead of a bare array."
    PunishTemplateResponse:
      required:
      - escalationGroup
      - identifier
      - key
      - metaData
      - reason
      - section
      - steps
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        key:
          type: string
        reason:
          type: string
        section:
          type: string
        escalationGroup:
          type: string
        escalationWindow:
          type: string
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PunishTemplateStep"
        metaData:
          type: object
          additionalProperties:
            type: object
    PunishTemplateStep:
      required:
      - duration
      - eloCost
      type: object
      properties:
        duration:
          minLength: 1
          type: string
        eloCost:
          type: integer
          format: int32
    PunishTemplateUpdateRequest:
      required:
      - identifier
      - key
      - reason
      - section
      - steps
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        key:
          minLength: 1
          type: string
        reason:
          minLength: 1
          type: string
        section:
          minLength: 1
          type: string
        escalationGroup:
          type: string
          nullable: true
        escalationWindow:
          type: string
          nullable: true
        steps:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PunishTemplateStep"
        metaData:
          type: object
          additionalProperties:
            type: object
          nullable: true
    PunishmentApplyRequest:
      required:
      - owner
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        templateKey:
          type: string
          nullable: true
        templateId:
          type: string
          format: uuid
          nullable: true
        onBehalfOf:
          type: string
          description: the Minecraft UUID of the in-game staff member the proxy acts
            for; accepted only from the `PROXY` role (HTTP 400 otherwise)
          format: uuid
          nullable: true
        evidenceCorrelationId:
          maxLength: 64
          type: string
          description: the key evidence was sent under before this punishment existed;
            the pending evidence of this owner with that key is attached to the new
            punishment
          nullable: true
      description: Apply a template to a player. Exactly one of `templateKey` and
        `templateId` is required. The staff member is the caller of the verified token;
        there is no client-supplied source.
    PunishmentApplyResponse:
      required:
      - enforcement
      - punishment
      - scoreAfter
      - scoreBefore
      - section
      - step
      - stepCount
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        section:
          type: string
          description: the section it belongs to
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        step:
          type: integer
          description: "the escalation step that was applied, starting at 1"
          format: int32
        stepCount:
          type: integer
          description: how many steps the template has
          format: int32
        scoreBefore:
          type: integer
          description: the section score before the ELO cost
          format: int32
        scoreAfter:
          type: integer
          description: the section score after the ELO cost
          format: int32
        escalation:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PunishmentEscalation"
      description: The result of applying a template.
    PunishmentError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    PunishmentEscalation:
      required:
      - punishment
      - resultingScore
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        resultingScore:
          type: integer
          description: the section score that triggered it
          format: int32
      description: A permanent punishment the system applied because a deduction left
        the score too low.
    PunishmentLookupRequest:
      type: object
      properties:
        banId:
          type: string
          description: "the Ban ID as typed, with or without `#`, in any case; a credential,\
            \ so it is a body field and is never printed"
          nullable: true
      description: Staff look up a punishment by the Ban ID a player quotes.
    PunishmentLookupResponse:
      required:
      - punishment
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
    PunishmentPreviewResponse:
      required:
      - duration
      - eloCost
      - enforcement
      - escalatesToPermanent
      - permanentThreshold
      - scoreAfter
      - scoreBefore
      - section
      - step
      - stepCount
      type: object
      properties:
        section:
          type: string
          description: the section the template belongs to
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        step:
          type: integer
          description: "the escalation step that would apply, starting at 1"
          format: int32
        stepCount:
          type: integer
          description: how many steps the template has
          format: int32
        duration:
          type: string
          description: the ISO-8601 duration of the step
        eloCost:
          type: integer
          description: the ELO the step would deduct
          format: int32
        scoreBefore:
          type: integer
          description: the section score now
          format: int32
        scoreAfter:
          type: integer
          description: the section score after the deduction
          format: int32
        permanentThreshold:
          type: integer
          description: the section's permanent threshold
          format: int32
        escalatesToPermanent:
          type: boolean
          description: whether the deduction would leave the score below that threshold
      description: "What applying a template would do right now, without doing it:\
        \ the escalation step the server selects, its cost and whether the cost would\
        \ push the player into a permanent punishment."
    PunishmentRevokeRequest:
      required:
      - owner
      - section
      type: object
      properties:
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
        section:
          minLength: 1
          type: string
        onBehalfOf:
          type: string
          description: the Minecraft UUID of the in-game staff member the proxy acts
            for; accepted only from the `PROXY` role (HTTP 400 otherwise)
          format: uuid
          nullable: true
      description: Revoke the active punishment of a section. The revoking staff member
        is the caller of the verified token.
    PunishmentRevokeResponse:
      required:
      - punishment
      - section
      type: object
      properties:
        punishment:
          $ref: "#/components/schemas/PunishEntryDTO"
        section:
          type: string
          description: the section it belonged to
        scoreReset:
          type: integer
          description: "the section score after a permanent punishment was pardoned,\
            \ else `null`"
          format: int32
          nullable: true
      description: The result of revoking a section's active punishment.
    ReportCategory:
      type: string
      description: What kind of behavior a report is about.
      enum:
      - CHAT_ABUSE
      - CHEATING
      - GRIEFING
      - OTHER
    ReportDTO:
      required:
      - category
      - createdAt
      - metaData
      - reportedHash
      - reporterHash
      - updatedAt
      - verified
      type: object
      properties:
        identifier:
          type: string
          description: "the identifier of the report, `null` when submitting"
          format: uuid
          nullable: true
        reporterHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reporting player
          x-pattern-message: reporterHash must be a sha-512 hash
        reportedHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reported player
          x-pattern-message: reportedHash must be a sha-512 hash
        category:
          $ref: "#/components/schemas/ReportCategory"
        description:
          maxLength: 1000
          type: string
          description: a bounded free-text description
          nullable: true
        evidenceReferences:
          type: array
          description: optional references to `PunishmentEvidenceEntity` entries
          nullable: true
          items:
            type: string
            format: uuid
        status:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ReportStatus"
        createdAt:
          type: integer
          description: epoch millis when the report was submitted
          format: int64
        updatedAt:
          type: integer
          description: epoch millis of the last status change
          format: int64
        resolvedBy:
          type: string
          description: "the staff identity that resolved this report, if resolved:\
            \ the resolver's `oid` for reports resolved with a token, whatever was\
            \ stored before SSO otherwise"
          format: uuid
          nullable: true
        recordedByOid:
          type: string
          description: "the `oid` of the verified principal that resolved it, `null`\
            \ while open and for reports resolved before SSO"
          format: uuid
          nullable: true
        verified:
          type: boolean
          description: whether the resolution is attributed to a verified principal;
            `false` for an open report and for one resolved before SSO
        resolutionNote:
          maxLength: 1000
          type: string
          description: "a note explaining the resolution, if resolved"
          nullable: true
        metaData:
          type: object
          additionalProperties:
            type: object
          description: extensible metadata
      description: A player report. `status`/`createdAt`/`updatedAt`/`resolvedBy`/
        `resolutionNote` are server-controlled - a submission simply leaves them unset/default.
    ReportErrorDTO:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
          description: what went wrong
        kind:
          $ref: "#/components/schemas/ErrorKind"
      description: "The body of a failed report resolution, so every expected failure\
        \ is distinguishable by its message and kind instead of a bare status code."
    ReportFeedbackList:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: the messages that have not expired
          items:
            $ref: "#/components/schemas/ReportFeedbackResponse"
      description: "The messages waiting for one reporter, oldest first."
    ReportFeedbackResponse:
      required:
      - category
      - createdAt
      - expiresAt
      - identifier
      - outcome
      - reportIdentifier
      type: object
      properties:
        identifier:
          type: string
          description: "the message, which the proxy acknowledges after showing it"
          format: uuid
        reportIdentifier:
          type: string
          description: the report it is about
          format: uuid
        category:
          $ref: "#/components/schemas/ReportCategory"
        outcome:
          $ref: "#/components/schemas/ReportStatus"
        createdAt:
          type: integer
          description: "when the report was resolved, epoch millis"
          format: int64
        expiresAt:
          type: integer
          description: "when the message is dropped if nobody acknowledged it, epoch\
            \ millis"
          format: int64
      description: One waiting message.
    ReportRequestDTO:
      required:
      - category
      - metaData
      - reportedHash
      - reporterHash
      type: object
      properties:
        reporterHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reporting player
          x-pattern-message: reporterHash must be a sha-512 hash
        reportedHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: SHA-512 hash of the reported player
          x-pattern-message: reportedHash must be a sha-512 hash
        category:
          $ref: "#/components/schemas/ReportCategory"
        description:
          maxLength: 1000
          type: string
          description: a bounded free-text description
          nullable: true
        evidenceReferences:
          type: array
          description: optional references to `PunishmentEvidenceEntity` entries
          nullable: true
          items:
            type: string
            format: uuid
        metaData:
          type: object
          additionalProperties:
            type: object
          description: extensible metadata
      description: "Request body for submitting a player report. `status`/`createdAt`/\
        \ `updatedAt`/`resolvedBy`/`resolutionNote` are server-controlled and have\
        \ no place here - see ReportDTO, the response type, for those."
    ReportResolutionDTO:
      required:
      - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
        resolutionNote:
          maxLength: 1000
          type: string
          description: an optional note explaining the decision
          nullable: true
        punishmentTemplateId:
          type: string
          description: an optional template to apply to the reported player
          format: uuid
          nullable: true
      description: "Request body for resolving a report. Providing `punishmentTemplateId`\
        \ applies that template to the reported player as part of the same resolution\
        \ - the report system's actual integration point with punishments. The resolver,\
        \ and the source of an applied punishment, is the caller of the verified token;\
        \ the request carries no actor."
    ReportStatus:
      type: string
      description: The lifecycle state of a report.
      enum:
      - OPEN
      - UNDER_REVIEW
      - ACTIONED
      - DISMISSED
    SectionCreateRequest:
