          format: int64
        lastSeen:
          type: integer
          description: "Latest sighting of the other owner on a shared address, epoch\
            \ millis"
          format: int64
      description: One other owner seen on a shared hashed network address
    EvasionRecordDTO:
      required:
      - ip
      - owner
      type: object
      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        ip:
          minLength: 1
          type: string
    EvasionSightingsError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    EvasionSightingsResponse:
      required:
      - linkedOwners
      type: object
      properties:
        detectionEnabled:
          type: boolean
          description: "False when blackhole.evasion.ip-salt is unset: nothing is\
            \ recorded, so an empty list means nothing"
        windowDays:
          type: integer
          description: Length of the detection window in days; only sightings inside
            it are correlated
          format: int32
        linkedOwners:
          type: array
          description: "Linked owners, most recently seen first, at most 50"
          items:
            $ref: "#/components/schemas/EvasionLinkedOwner"
        truncated:
          type: boolean
          description: True when more owners matched than are listed
    EvidenceCount:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          format: int64
      description: "The number of valid evidence items: the only thing a player may\
        \ learn."
    EvidenceCreateRequest:
      required:
      - kind
      - sourceSystem
      type: object
      properties:
        punishment:
          type: string
          description: "the punishment's identifier or short id, e.g. `#A1B2C3D4`"
          nullable: true
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: "the hashed owner, for evidence that precedes its punishment"
          nullable: true
          x-pattern-message: Owner must be a sha-512 hash
        correlationId:
          maxLength: 64
          minLength: 1
          type: string
          description: the client-chosen key the punishment claims the evidence with
          nullable: true
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        sourceSystem:
          maxLength: 64
          minLength: 1
          type: string
          description: the (unverified) system that sends the evidence
        capturedAt:
          type: integer
          description: "when the evidence was captured, epoch millis"
          format: int64
          nullable: true
        reference:
          type: string
          description: the absolute http(s) URL of a REPLAY or LINK
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          description: the kind's structured content; a REPLAY or LINK takes only
            a `description`
          nullable: true
        onBehalfOf:
          type: string
          description: the Minecraft UUID of the in-game staff member attaching the
            evidence; accepted only from the `PROXY` role (HTTP 400 otherwise). The
            caller of the token is always recorded.
          format: uuid
          nullable: true
      description: Attaches structured or link evidence. The target is either `punishment`
        (full identifier or short id) or `owner` together with `correlationId` (evidence
        sent before the punishment exists); exactly one form is valid.
    EvidenceDeleteResponse:
      required:
      - deleted
      type: object
      properties:
        deleted:
          type: integer
          format: int32
      description: The result of an admin delete.
    EvidenceError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/EvidenceErrorKind"
    EvidenceErrorKind:
      type: string
      description: "Why an evidence request failed in an expected way, so the controller\
        \ maps it 1:1 to a status. Evidence needs more statuses than the shared `ErrorKind`\
        \ offers (413, 415, 422, 503), and keeping them here leaves every other resource's\
        \ error schema untouched."
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - UNPROCESSABLE
      - UNAVAILABLE
      x-enum-descriptions:
      - The request is malformed or breaks a rule of its own (400).
      - "The punishment, evidence item or file does not exist (404)."
      - "The request conflicts with current state, for example an ambiguous short\
        \ id (409)."
      - The payload or the file is larger than the configured limit (413).
      - The detected file type is not on the allow-list (415).
      - "The content is understood but must not be stored: personal data in a payload,\
        \ malware (422)."
      - "A dependency evidence needs (the virus scanner, the file store) is not available\
        \ (503)."
    EvidenceFile:
      required:
      - contentType
      - name
      - sha256
      - size
      type: object
      properties:
        name:
          type: string
          description: the sanitised display name
        contentType:
          type: string
          description: the content type detected from the file's magic bytes
        size:
          type: integer
          description: the stored size in bytes
          format: int64
        sha256:
          type: string
          description: the SHA-256 of the stored bytes
      description: Metadata of a stored file.
    EvidenceKind:
      type: string
      description: "What an evidence item is. Stored as the ordinal in a `smallint`\
        \ column, so new kinds are only ever appended."
      enum:
      - ANTICHEAT
      - REPLAY
      - CHAT_LOG
      - LINK
      - FILE
      x-enum-descriptions:
      - A structured record of the check an anticheat flagged.
      - A link to a replay recording held by another system.
      - An excerpt of chat lines.
      - "Any other link, for example a message in a staff chat."
      - A screenshot or video uploaded to and stored by Blackhole.
    EvidencePage:
      required:
      - items
      - page
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalSize:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      description: One page of evidence items.
    EvidenceResponse:
      required:
      - createdAt
      - identifier
      - kind
      - owner
      - sourceSystem
      - status
      - verified
      type: object
      properties:
        identifier:
          type: string
          description: the evidence id
          format: uuid
        punishmentIdentifier:
          type: string
          description: "the punishment, or `null` while the item waits for one"
          nullable: true
        owner:
          type: string
          description: the hashed owner
        correlationId:
          type: string
          description: "the pending claim key, while pending"
          nullable: true
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        sourceSystem:
          type: string
          description: the (unverified) system that sent it
        capturedAt:
          type: integer
          description: "when it was captured, epoch millis"
          format: int64
          nullable: true
        createdAt:
          type: integer
          description: "when it was attached, epoch millis"
          format: int64
        createdBy:
          type: string
          description: "the attributed actor: the caller's `oid`, the in-game staff\
            \ UUID the proxy vouched for, or whatever was stored before SSO"
          format: uuid
          nullable: true
        recordedByOid:
          type: string
          description: "the `oid` of the verified principal that attached it, `null`\
            \ before SSO"
          format: uuid
          nullable: true
        verified:
          type: boolean
          description: whether `recordedByOid` is present
        actorOid:
          type: string
          description: "the staff member the in-game `createdBy` was linked to when\
            \ it was attached, `null` for web writes and unlinked UUIDs"
          format: uuid
          nullable: true
        reference:
          type: string
          description: the URL of a REPLAY or LINK
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          description: the structured content
          nullable: true
        file:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EvidenceFile"
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        statusChangedAt:
          type: integer
          description: when it became REVOKED or LIFTED
          format: int64
          nullable: true
        liftedByAppeal:
          type: string
          description: the appeal that lifted the punishment
          format: uuid
          nullable: true
      description: One evidence item.
    EvidenceStatus:
      type: string
      description: "Whether an evidence item still supports a current punishment.\
        \ Stored as the ordinal in a `smallint` column. Only #VALID items are counted\
        \ and listed by default."
      enum:
      - VALID
      - REVOKED
      - LIFTED
      x-enum-descriptions:
      - The punishment it belongs to stands (or the item is still pending a punishment).
      - The punishment was revoked by staff. The evidence is kept.
      - The punishment was lifted by a granted full-lift appeal. The evidence is kept.
    ImportedPunishmentError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
      description: The request was refused and nothing changed.
    ImportedPunishmentGroup:
      required:
