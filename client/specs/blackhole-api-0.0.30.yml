        servers:
          type: array
          items:
            type: string
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        softDuration:
          type: string
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
        permanentReason:
          type: string
        decayPerDay:
          type: integer
          format: int32
        enabled:
