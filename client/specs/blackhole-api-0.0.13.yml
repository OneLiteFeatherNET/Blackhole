openapi: 3.0.1
info:
  title: Blackhole API
  description: Simple ban management system
  contact:
    name: Management
    url: https://onelitefeather.net
    email: admin@onelitefeather.net
  license:
    name: Close Source
  version: 0.0.13
paths:
  /appeal:
    get:
      tags:
      - Appeal
      summary: Get all appeals
      description: Retrieves a paginated list of appeals
      operationId: getAppeals
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved appeals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppealDTO"
    post:
      tags:
      - Appeal
      summary: Submit an appeal
      description: Submits an appeal against a punishment. Immediately evaluated against
        the eligibility checklist.
      operationId: submitAppeal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealSubmissionDTO"
        required: true
      responses:
        "200":
          description: Appeal submitted (status reflects whether it passed the eligibility
            checklist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Punishment not found
  /appeal/{identifier}/review:
    post:
      tags:
      - Appeal
      summary: Review an appeal
      description: Decides an eligible appeal. Rejects self-review (reviewerId matching
        the punishment's own source) and full lifts of SEVERE punishments (duration
        reduction only).
      operationId: reviewAppeal
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealReviewDTO"
        required: true
      responses:
        "200":
          description: Appeal decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealDTO"
        "404":
          description: Appeal not found
        "400":
          description: "Invalid decision, or a full lift was attempted on a SEVERE\
            \ punishment"
        "403":
          description: reviewerId matches the punishment's original source (self-review)
        "409":
          description: "Appeal is not awaiting review, or the punishment is no longer\
            \ active"
  /dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Dashboard summary
      description: "Active punishments per section, open reports, pending appeals,\
        \ escalations of the last 7 days and the latest automatic permanent punishments"
      operationId: getDashboardSummary
      responses:
        "200":
          description: The current summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
  /elo/chat:
    post:
      tags:
      - Elo
      summary: Score a chat message for toxicity
      description: "Scores a chat message; if flagged, records evidence (a hash, never\
        \ the raw text) and applies a delta in the configured chat section"
      operationId: submitChatSignal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloChatSignalRequest"
        required: true
      responses:
        "200":
          description: Scoring result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloChatSignalResponse"
  /elo/{owner}:
    get:
      tags:
      - Elo
      summary: Get a player's current ELO standing
      description: The player's score in every enabled section with that section's
        thresholds. A section the player was never scored in reports its base score.
      operationId: getEloProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Current ELO standing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloProfileResponse"
  /elo/{owner}/adjust:
    post:
      tags:
      - Elo
      summary: Adjust a player's score by hand
      description: "Applies a signed delta to the player's score in one section, recorded\
        \ as a MANUAL_ADJUSTMENT and subject to the same soft and permanent threshold\
        \ rules as any other delta."
      operationId: adjustElo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EloAdjustRequest"
        required: true
      responses:
        "200":
          description: The score change and any automatic punishment it caused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloAdjustResponse"
        "400":
          description: Invalid adjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "404":
          description: Unknown section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
        "409":
          description: The section is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloError"
  /elo/{owner}/history:
    get:
      tags:
      - Elo
      summary: Get a player's ELO history
      description: "The audit trail of ELO changes for this owner, optionally restricted\
        \ to one section"
      operationId: getEloHistory
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: section
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated ELO event history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloEventResponse"
  /evasion/record:
    post:
      tags:
      - Evasion
      summary: Record a login sighting for ban-evasion detection
      description: Computes a keyed hash of the IP (never stores it raw) and checks
        whether multiple distinct owners share it recently
      operationId: recordEvasionSighting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvasionRecordDTO"
        required: true
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
        "503":
          description: blackhole.evasion.ip-salt is not configured - evasion detection
            is disabled
  /evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of an owner
      description: "Lists every evidence item of an owner hash, for data-subject access\
        \ requests. Lifted and revoked evidence is hidden unless includeInactive is\
        \ true; asking for it is audited."
      operationId: listOwnerEvidence
      parameters:
      - name: owner
        in: query
        required: true
        explode: false
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "400":
          description: The owner is not a SHA-512 hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    post:
      tags:
      - Evidence
      summary: Attach evidence
      description: "Attaches an anticheat record, chat excerpt, replay link or other\
        \ link to a punishment, given by its identifier or short id, or sent ahead\
        \ of the punishment under an owner hash and a correlation id (pass the same\
        \ id as evidenceCorrelationId when applying the punishment). Files go through\
        \ /evidence/file."
      operationId: attachEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceCreateRequest"
        required: true
      responses:
        "200":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: "Invalid request, target or payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments; the message lists
            them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: The payload is larger than the configured limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: The payload contains personal data (a UUID or IP address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/file:
    post:
      tags:
      - Evidence
      summary: Upload an evidence file
      description: "Uploads a screenshot (PNG, JPEG) or video (MP4, WebM) as multipart\
        \ form data. Send the text fields (punishment, or owner and correlationId;\
        \ sourceSystem; capturedAt; description; source) before the file part. The\
        \ type is detected from the file's bytes, images are re-encoded without metadata,\
        \ and the file is virus scanned before it is stored."
      operationId: uploadEvidenceFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                punishment:
                  type: string
                  nullable: true
                owner:
                  type: string
                  nullable: true
                correlationId:
                  type: string
                  nullable: true
                sourceSystem:
                  type: string
                  nullable: true
                capturedAt:
                  type: integer
                  format: int64
                  nullable: true
                description:
                  type: string
                  nullable: true
                source:
                  type: string
                  format: uuid
                  nullable: true
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: File stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          description: Invalid request or target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "413":
          description: "The file is larger than the limit for its type, or has too\
            \ many pixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "415":
          description: The file's detected type is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "422":
          description: "The virus scanner flagged the file, or it is not a valid image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The virus scanner or the file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/owner/{owner}:
    delete:
      tags:
      - Evidence
      summary: Delete all evidence of an owner
      description: Deletes every evidence item and file of an owner hash (data-subject
        erasure). Same required reason and per-item audit as deleting one item.
      operationId: deleteOwnerEvidence
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      responses:
        "200":
          description: Deleted; the count may be zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: "The reason is missing or invalid, or the owner is not a hash;\
            \ nothing was deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; deletion stopped at the first
            file it could not delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}:
    get:
      tags:
      - Evidence
      summary: Get one evidence item
      description: "The metadata and payload of one evidence item, whatever its status."
      operationId: getEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      responses:
        "200":
          description: The evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
    delete:
      tags:
      - Evidence
      summary: Delete an evidence item
      description: "Deletes one item and its file. A reason (ERASURE_REQUEST, WRONG_EVIDENCE,\
        \ OTHER) is required and recorded, with the optional note, in the audit trail.\
        \ Nothing is erased automatically for data-subject requests: the operator\
        \ decides each one."
      operationId: deleteEvidence
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reason
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: note
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDeleteResponse"
        "400":
          description: The reason is missing or invalid; nothing was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "404":
          description: Unknown evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "503":
          description: The file store is unavailable; the item was not deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /evidence/{identifier}/content:
    get:
      tags:
      - Evidence
      summary: Download an evidence file
      description: "Streams the stored file through the backend (there are no presigned\
        \ links). Supports a single HTTP Range so videos can be scrubbed. Sent with\
        \ nosniff, a sandboxing Content-Security-Policy and no-store; images and videos\
        \ are served inline, so the type is the detected one."
      operationId: downloadEvidenceFile
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Range
        in: header
        schema:
          type: string
          nullable: true
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      responses:
        "200":
          description: The whole file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: "Unknown evidence, or it has no file"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "416":
          description: The range starts behind the end of the file
        "503":
          description: The file store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /player/resolve/{name}:
    get:
      tags:
      - Player
      description: "Resolve a player name to a UUID via the configured resolver chain\
        \ (Otis, Mojang, NameMC)"
      operationId: resolvePlayer
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The player was resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveResponse"
        "404":
          description: No resolver could find a player with that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResolveError"
  /profile:
    get:
      tags:
      - PunishProfile
      summary: Get all punishment profiles.
      description: Get all existing punishment profiles
      operationId: getProfiles
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishProfileResponse"
    post:
      tags:
      - PunishProfile
      summary: Add a new punishment profile.
      description: Add a new profile for punishments
      operationId: addProfile
      requestBody:
        description: the profile to add
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The profile which was added to the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /profile/delete/{owner}:
    delete:
      tags:
      - PunishProfile
      summary: Delete a punishment profile by the owner.
      description: Delete a punish profile via uuid
      operationId: removeProfile
      parameters:
      - name: owner
        in: path
        description: the owner of the profile
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The deleted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/update/{owner}:
    post:
      tags:
      - PunishProfile
      summary: Get a punishment profile by the owner.
      description: Update a punishment profile
      operationId: updateProfile
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        description: the profile to get
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishProfileRequestDTO"
        required: true
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
        "400":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}:
    get:
      tags:
      - PunishProfile
      summary: Get a punishment profile by the owner.
      description: Get a profile by id
      operationId: getById
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      responses:
        "200":
          description: The profile which matches with the given id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileDTO"
        "404":
          description: Error message when there is no profile linked to the given
            id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/{owner}/session:
    post:
      tags:
      - PunishProfile
      summary: "Records session telemetry (Phase 7's dashboard enrichment: Java/Bedrock\
        \ protocol version and client brand) into the profile's existing metaData,\
        \ so the already-existing profile listing/get endpoints surface it without\
        \ a separate dashboard endpoint."
      description: Records session telemetry (protocol version / client brand) for
        the dashboard
      operationId: updateSessionInfo
      parameters:
      - name: owner
        in: path
        required: true
        schema:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: Owner must be a sha-512 hash
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInfoDTO"
        required: true
      responses:
        "200":
          description: Session info recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishProfileResponse"
  /punishment:
    get:
      tags:
      - Punishment
      summary: Get all punishments
      description: Retrieves a paginated list of all punishment entries in the system
      operationId: getPunishments
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
  /punishment/apply:
    post:
      tags:
      - Punishment
      summary: Apply a punishment template
      description: "Applies a template to a player: creates a temporary punishment\
        \ in the template's section with the duration and ELO cost of the escalation\
        \ step the player has reached, deducts the cost, and reports the step, the\
        \ score before and after, and any permanent escalation it caused."
      operationId: applyPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: Punishment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentApplyResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/preview:
    post:
      tags:
      - Punishment
      summary: Preview applying a template
      description: "Answers what applying the template would do right now - the escalation\
        \ step, its cost, the resulting score and whether the player would be punished\
        \ permanently - without changing anything. Takes the same request as /punishment/apply\
        \ and fails with the same errors."
      operationId: previewPunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentApplyRequest"
        required: true
      responses:
        "200":
          description: What applying the template would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentPreviewResponse"
        "400":
          description: "Invalid request (owner must be a SHA-512 hash, exactly one\
            \ of templateKey and templateId)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "409":
          description: "The template's section is disabled, or the player is already\
            \ permanently punished in it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/revoke:
    post:
      tags:
      - Punishment
      summary: Revoke the active punishment of a section
      description: Moves the player's active punishment in the section into history.
        Revoking a permanent punishment resets the player's score in that section
        to the section's pardon score.
      operationId: revokePunishment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishmentRevokeRequest"
        required: true
      responses:
        "200":
          description: Punishment revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentRevokeResponse"
        "400":
          description: Invalid request (owner must be a SHA-512 hash)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
        "404":
          description: The player has no active punishment in that section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/short/{shortId}:
    get:
      tags:
      - Punishment
      summary: Find punishments by short ID
      description: "Finds the punishments whose short ID (the # and eight hex characters\
        \ players are shown, e.g. #A1B2C3D4) matches. The # is optional and the case\
        \ is ignored. Short IDs are four bytes and can collide, so the result is a\
        \ list: empty if nothing matches, several if they collide."
      operationId: findPunishmentsByShortId
      parameters:
      - name: shortId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The matching punishments, possibly none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishEntryDTO"
        "400":
          description: "Not a short ID (exactly eight hex characters, optionally after\
            \ #)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishmentError"
  /punishment/{reference}/evidence:
    get:
      tags:
      - Evidence
      summary: List the evidence of a punishment
      description: "Lists the evidence of a punishment (identifier or short id), oldest\
        \ first. Lifted and revoked evidence is hidden unless includeInactive is true;\
        \ asking for it is audited."
      operationId: listPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      - name: includeInactive
        in: query
        required: true
        explode: false
        schema:
          type: boolean
          default: false
      - name: source
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: One page of evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /punishment/{reference}/evidence/count:
    get:
      tags:
      - Evidence
      summary: Count the valid evidence of a punishment
      description: "The number of valid evidence items of a punishment: the only thing\
        \ a player may be told. Lifted and revoked evidence is not counted."
      operationId: countPunishmentEvidence
      parameters:
      - name: reference
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCount"
        "404":
          description: Unknown punishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
        "409":
          description: The short id matches several punishments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceError"
  /report:
    get:
      tags:
      - Report
      summary: Get all reports
      description: Retrieves a paginated list of reports
      operationId: getReports
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDTO"
    post:
      tags:
      - Report
      summary: Submit a report
      description: Submits a player report. Rate-limited per reporterHash within a
        configurable time window.
      operationId: submitReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestDTO"
        required: true
      responses:
        "200":
          description: Report successfully submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "429":
          description: Rate limit exceeded for this reporter
  /report/{identifier}/resolve:
    post:
      tags:
      - Report
      summary: Resolve a report
      description: "Resolves a report, optionally applying a punishment template to\
        \ the reported player"
      operationId: resolveReport
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolutionDTO"
        required: true
      responses:
        "200":
          description: Report successfully resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDTO"
        "404":
          description: There is no report with this identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "400":
          description: "punishmentSource is missing, a template was given for a report\
            \ that is not ACTIONED, or the template or its section does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
        "409":
          description: "The report is already resolved, the template's section is\
            \ disabled, or the player is already permanently punished there"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportErrorDTO"
  /section:
    get:
      tags:
      - Section
      summary: List punishment sections
      description: "All sections, enabled or not, sorted by key."
      operationId: listSections
      responses:
        "200":
          description: The sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectionResponse"
    post:
      tags:
      - Section
      summary: Create a punishment section
      description: "Creates an enabled section with its own ELO score, thresholds\
        \ and enforcement kind."
      operationId: createSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionCreateRequest"
        required: true
      responses:
        "200":
          description: Section created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "409":
          description: A section with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/update:
    post:
      tags:
      - Section
      summary: Update a punishment section
      description: "Replaces every editable field of an existing section, including\
        \ whether it is enabled."
      operationId: updateSection
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionUpdateRequest"
        required: true
      responses:
        "200":
          description: Section updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "400":
          description: Invalid section definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}:
    get:
      tags:
      - Section
      summary: Get a punishment section
      operationId: getSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /section/{key}/disable:
    post:
      tags:
      - Section
      summary: Disable a punishment section
      description: Rejects new template applications and score deltas for the section.
        Existing active punishments stay enforced until they expire or are lifted.
      operationId: disableSection
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Section disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "404":
          description: Section not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionError"
  /template:
    get:
      tags:
      - Punishment Templates
      summary: Get all punishment templates
      description: Retrieves a paginated list of all punishment templates in the system
      operationId: getAllTemplates
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Successfully retrieved punishment templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PunishTemplateResponse"
    post:
      tags:
      - Punishment Templates
      summary: Create punishment template
      description: Creates a temporary punishment template in a section. The escalation
        group defaults to the key.
      operationId: addTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateCreateRequest"
        required: true
      responses:
        "200":
          description: Template successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: "Invalid template (also when an identifier is supplied, or\
            \ the section is unknown)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: A template with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/delete/{identifier}:
    delete:
      tags:
      - Punishment Templates
      summary: Delete punishment template
      description: Deletes a punishment template by its identifier
      operationId: deleteTemplate
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: At least one punishment still references this template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/update:
    post:
      tags:
      - Punishment Templates
      summary: Update punishment template
      description: Replaces every editable field of an existing template.
      operationId: updateTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PunishTemplateUpdateRequest"
        required: true
      responses:
        "200":
          description: Template successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "400":
          description: Invalid template (also when the identifier is missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
        "409":
          description: Another template already uses this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
  /template/{identifier}:
    get:
      tags:
      - Punishment Templates
      summary: Get punishment template by ID
      description: Retrieves a specific punishment template by its identifier
      operationId: getTemplateById
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Template successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateResponse"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PunishTemplateError"
components:
  schemas:
    AppealDTO:
      required:
      - appellantHash
      - createdAt
      - eligibilityCheckResult
      - evidenceCount
      - identifier
      - metaData
      - punishmentIdentifier
      - statement
      - status
      - updatedAt
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        punishmentIdentifier:
          type: string
        appellantHash:
          type: string
        statement:
          type: string
        status:
          $ref: "#/components/schemas/AppealStatus"
        eligibilityCheckResult:
          type: object
          additionalProperties:
            type: object
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decisionNote:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        evidenceCount:
          type: integer
          description: "how many valid evidence items the appealed punishment has:\
            \ the only thing about evidence an appeal response carries, never its\
            \ content, references or files"
          format: int64
        metaData:
          type: object
          additionalProperties:
            type: object
      description: An appeal as it appears in responses.
    AppealReviewDTO:
      required:
      - decision
      - reviewerId
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/AppealStatus"
        decisionNote:
          maxLength: 2000
          type: string
          description: an optional note explaining the decision
          nullable: true
        reviewerId:
          type: string
          description: the staff/system identity making this decision; rejected if
            it matches the punishment's own `source` (self-review exclusion)
          format: uuid
        newExpirationAt:
          type: integer
          description: "required when `decision` is `GRANTED_DURATION_REDUCTION` -\
            \ the new, sooner expiration timestamp (epoch millis)"
          format: int64
          nullable: true
    AppealStatus:
      type: string
      description: The lifecycle state of an appeal.
      enum:
      - SUBMITTED
      - ELIGIBLE_PENDING_REVIEW
      - IN_REVIEW
      - GRANTED_FULL_LIFT
      - GRANTED_DURATION_REDUCTION
      - DENIED
      - INELIGIBLE
    AppealSubmissionDTO:
      required:
      - appellantHash
      - punishmentIdentifier
      - statement
      type: object
      properties:
        punishmentIdentifier:
          minLength: 1
          type: string
        appellantHash:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: appellantHash must be a sha-512 hash
        statement:
          maxLength: 2000
          minLength: 1
          type: string
    DashboardEscalation:
      required:
      - identifier
      - owner
      - section
      type: object
      properties:
        identifier:
          type: string
        owner:
          type: string
          description: Hashed owner; open the player detail with it
        section:
          type: string
        createdAt:
          type: integer
          description: Creation time in epoch millis
          format: int64
        lifted:
          type: boolean
          description: Whether it has been revoked or lifted since
      description: An automatic permanent punishment
    DashboardSectionCount:
      required:
      - active
      - section
      type: object
      properties:
        section:
          type: string
        active:
          type: integer
          format: int64
      description: Active punishments held in one section
    DashboardSummaryResponse:
      required:
      - activePunishmentsBySection
      - latestEscalations
      type: object
      properties:
        activePunishmentsBySection:
          type: array
          description: Active punishments per section sorted by key; enabled sections
            are zero-filled
          items:
            $ref: "#/components/schemas/DashboardSectionCount"
        openReports:
          type: integer
          description: Reports that are OPEN or UNDER_REVIEW
          format: int64
        pendingAppeals:
          type: integer
          description: "Appeals that are submitted, eligible or in review"
          format: int64
        escalationsLast7Days:
          type: integer
          description: Automatic permanent punishments created in the last 7 days
          format: int64
        latestEscalations:
          type: array
          description: "Most recent automatic permanent punishments, newest first"
          items:
            $ref: "#/components/schemas/DashboardEscalation"
    EloAdjustRequest:
      required:
      - delta
      - section
      - source
      type: object
      properties:
        section:
          minLength: 1
          type: string
        delta:
          type: integer
          format: int32
        note:
          maxLength: 500
          type: string
          nullable: true
        source:
          type: string
          format: uuid
    EloAdjustResponse:
      required:
      - scoreAfter
      - scoreBefore
      - section
      type: object
      properties:
        section:
          type: string
        scoreBefore:
          type: integer
          format: int32
        scoreAfter:
          type: integer
          format: int32
        escalation:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EloEscalationInfo"
      description: "Result of an adjustment: the score change and the punishment the\
        \ system applied because of it."
    EloChatSignalRequest:
      required:
      - message
      - owner
      type: object
      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        message:
          maxLength: 512
          minLength: 1
          type: string
    EloChatSignalResponse:
      required:
      - flagged
      - score
      type: object
      properties:
        flagged:
          type: boolean
        score:
          type: number
          format: double
    EloError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/ErrorKind"
    EloEscalationInfo:
      required:
      - punishmentIdentifier
      - tier
      type: object
      properties:
        tier:
          type: string
          description: '`SOFT` (temporary) or `PERMANENT`'
        punishmentIdentifier:
          type: string
          description: the created punishment
      description: An automatic punishment caused by a score change.
    EloEventResponse:
      required:
      - createdAt
      - delta
      - identifier
      - metaData
      - owner
      - reasonCode
      - resultingScore
      type: object
      properties:
        identifier:
          type: string
          format: uuid
        owner:
          type: string
        section:
          type: string
          nullable: true
        delta:
          type: integer
          format: int32
        reasonCode:
          $ref: "#/components/schemas/EloReasonCode"
        sourceEvidenceId:
          type: string
          format: uuid
          nullable: true
        resultingScore:
          type: integer
          format: int32
        createdAt:
          type: integer
          format: int64
        metaData:
          type: object
          additionalProperties:
            type: object
    EloProfileResponse:
      required:
      - owner
      - sections
      type: object
      properties:
        owner:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/EloSectionScore"
    EloReasonCode:
      type: string
      description: |-
        Why an `EloEventEntity` happened. This is the audit trail that lets a reviewer (or a future Phase 6 appeal) tell an algorithmic decision apart from a human one.

        Stored by ordinal: only ever append new codes at the end.
      enum:
      - TOXICITY_FLAG
      - ANTICHEAT_FLAG
      - REPORT_ACTIONED
      - MANUAL_ADJUSTMENT
      - DECAY_RECOVERY
      - THRESHOLD_BAN
      - PUNISHMENT_APPLIED
      - REPORT_REWARDED
      - PARDON_RESET
      - APPEAL_REFUND
      x-enum-descriptions:
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""
      - ""
      - A permanent punishment was lifted and the section score reset to the section's
        pardon score.
      - A granted appeal gave back the ELO cost of a staff temporary punishment.
    EloSectionScore:
      required:
      - baseScore
      - displayName
      - enforcement
      - pardonScore
      - permanentThreshold
      - score
      - section
      type: object
      properties:
        section:
          type: string
        displayName:
          type: string
        enforcement:
          $ref: "#/components/schemas/EnforcementKind"
        score:
          type: integer
          format: int32
        baseScore:
          type: integer
          format: int32
        softThreshold:
          type: integer
          format: int32
          nullable: true
        permanentThreshold:
          type: integer
          format: int32
        pardonScore:
          type: integer
          format: int32
      description: "One section's score of a player, with the thresholds that decide\
        \ what happens when it drops."
    EnforcementKind:
      type: string
      description: "How a section's punishments are enforced. The kinds are an enum,\
        \ not data, because the proxy has to implement each of them: a new section\
        \ of an existing kind needs no code change, a new kind does."
      enum:
      - MUTE
      - BAN
      - SERVER
      x-enum-descriptions:
      - The player cannot chat.
      - The player cannot join the network.
      - The player cannot connect to backend servers matching the section's patterns.
    ErrorKind:
      type: string
      description: "Why an expected failure happened, carried by a resource's `Error`\
        \ variant so a controller can map it 1:1 to a status without re-deriving the\
        \ cause."
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      x-enum-descriptions:
      - The request is malformed or breaks a business rule of its own (400).
      - The addressed resource does not exist (404).
      - The request is valid but conflicts with current state (409).
    ErrorResponse:
      type: object
      properties:
        The error message:
          type: string
          description: the error message
      description: The error response when something went wrong on profile requests
    EvasionRecordDTO:
      required:
      - ip
      - owner
      type: object
      properties:
        owner:
          minLength: 1
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          x-pattern-message: owner must be a sha-512 hash
        ip:
          minLength: 1
          type: string
    EvidenceCount:
      required:
      - count
      type: object
      properties:
        count:
          type: integer
          format: int64
      description: "The number of valid evidence items: the only thing a player may\
        \ learn."
    EvidenceCreateRequest:
      required:
      - kind
      - sourceSystem
      type: object
      properties:
        punishment:
          type: string
          description: "the punishment's identifier or short id, e.g. `#A1B2C3D4`"
          nullable: true
        owner:
          pattern: "^[a-fA-F0-9]{128}$"
          type: string
          description: "the hashed owner, for evidence that precedes its punishment"
          nullable: true
          x-pattern-message: Owner must be a sha-512 hash
        correlationId:
          maxLength: 64
          minLength: 1
          type: string
          description: the client-chosen key the punishment claims the evidence with
          nullable: true
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        sourceSystem:
          maxLength: 64
          minLength: 1
          type: string
          description: the (unverified) system that sends the evidence
        capturedAt:
          type: integer
          description: "when the evidence was captured, epoch millis"
          format: int64
          nullable: true
        reference:
          type: string
          description: the absolute http(s) URL of a REPLAY or LINK
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          description: the kind's structured content; a REPLAY or LINK takes only
            a `description`
          nullable: true
        source:
          type: string
          description: the (unverified) UUID of the actor attaching the evidence
          format: uuid
          nullable: true
      description: Attaches structured or link evidence. The target is either `punishment`
        (full identifier or short id) or `owner` together with `correlationId` (evidence
        sent before the punishment exists); exactly one form is valid.
    EvidenceDeleteResponse:
      required:
      - deleted
      type: object
      properties:
        deleted:
          type: integer
          format: int32
      description: The result of an admin delete.
    EvidenceError:
      required:
      - errorMessage
      - kind
      type: object
      properties:
        errorMessage:
          type: string
        kind:
          $ref: "#/components/schemas/EvidenceErrorKind"
    EvidenceErrorKind:
      type: string
      description: "Why an evidence request failed in an expected way, so the controller\
        \ maps it 1:1 to a status. Evidence needs more statuses than the shared `ErrorKind`\
        \ offers (413, 415, 422, 503), and keeping them here leaves every other resource's\
        \ error schema untouched."
      enum:
      - VALIDATION
      - NOT_FOUND
      - CONFLICT
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - UNPROCESSABLE
      - UNAVAILABLE
      x-enum-descriptions:
      - The request is malformed or breaks a rule of its own (400).
      - "The punishment, evidence item or file does not exist (404)."
      - "The request conflicts with current state, for example an ambiguous short\
        \ id (409)."
      - The payload or the file is larger than the configured limit (413).
      - The detected file type is not on the allow-list (415).
      - "The content is understood but must not be stored: personal data in a payload,\
        \ malware (422)."
      - "A dependency evidence needs (the virus scanner, the file store) is not available\
        \ (503)."
    EvidenceFile:
      required:
      - contentType
      - name
      - sha256
      - size
      type: object
      properties:
        name:
          type: string
          description: the sanitised display name
        contentType:
          type: string
          description: the content type detected from the file's magic bytes
        size:
          type: integer
          description: the stored size in bytes
          format: int64
        sha256:
          type: string
          description: the SHA-256 of the stored bytes
      description: Metadata of a stored file.
    EvidenceKind:
      type: string
      description: "What an evidence item is. Stored as the ordinal in a `smallint`\
        \ column, so new kinds are only ever appended."
      enum:
      - ANTICHEAT
      - REPLAY
      - CHAT_LOG
      - LINK
      - FILE
      x-enum-descriptions:
      - A structured record of the check an anticheat flagged.
      - A link to a replay recording held by another system.
      - An excerpt of chat lines.
      - "Any other link, for example a message in a staff chat."
      - A screenshot or video uploaded to and stored by Blackhole.
    EvidencePage:
      required:
      - items
      - page
      - size
      - totalPages
      - totalSize
      type: object
      properties:
        items:
          type: array
