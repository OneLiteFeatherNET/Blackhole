      - identifier
      - kind
      - owner
      - sourceSystem
      - status
      type: object
      properties:
        identifier:
          type: string
          description: the evidence id
          format: uuid
        punishmentIdentifier:
          type: string
          description: "the punishment, or `null` while the item waits for one"
          nullable: true
        owner:
          type: string
          description: the hashed owner
        correlationId:
          type: string
          description: "the pending claim key, while pending"
          nullable: true
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        sourceSystem:
          type: string
          description: the (unverified) system that sent it
        capturedAt:
          type: integer
          description: "when it was captured, epoch millis"
          format: int64
          nullable: true
        createdAt:
          type: integer
          description: "when it was attached, epoch millis"
          format: int64
        createdBy:
          type: string
          description: "the (unverified) actor, if given"
          format: uuid
          nullable: true
        reference:
          type: string
          description: the URL of a REPLAY or LINK
          nullable: true
        payload:
          type: object
          additionalProperties:
            type: object
          description: the structured content
          nullable: true
        file:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/EvidenceFile"
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        statusChangedAt:
          type: integer
          description: when it became REVOKED or LIFTED
          format: int64
          nullable: true
        liftedByAppeal:
          type: string
          description: the appeal that lifted the punishment
          format: uuid
          nullable: true
      description: One evidence item.
    EvidenceStatus:
      type: string
      description: "Whether an evidence item still supports a current punishment.\
        \ Stored as the ordinal in a `smallint` column. Only #VALID items are counted\
        \ and listed by default."
      enum:
      - VALID
      - REVOKED
      - LIFTED
      x-enum-descriptions:
      - The punishment it belongs to stands (or the item is still pending a punishment).
      - The punishment was revoked by staff. The evidence is kept.
      - The punishment was lifted by a granted full-lift appeal. The evidence is kept.
