# Test fixture: the dev environment. One replica, internal HTTPRoutes instead of tunnel Ingresses, no
# external API host, the scanner of another namespace, and an image tag written by image automation.
global:
  environment: dev
  image:
    tag: main-1790000000-abcdef1

database:
  existingSecret: blackhole-db
redis:
  existingSecret: blackhole-redis
nats:
  existingSecret: blackhole-nats
s3:
  endpoint: http://s3.example.invalid:80
  bucket: blackhole-evidence-dev
  existingSecret: blackhole-s3
keys:
  existingSecret: blackhole-keys

auth:
  tenantId: 00000000-0000-0000-0000-000000000000
  apiClientId: 11111111-1111-1111-1111-111111111111
  roles:
    admin: 20000000-0000-0000-0000-000000000001
    moderator: 20000000-0000-0000-0000-000000000002
    viewer: 20000000-0000-0000-0000-000000000003
    metrics: 20000000-0000-0000-0000-000000000004

backend:
  replicaCount: 1
  config:
    BLACKHOLE_DOCS_ENABLED: "true"

# security.txt is off in this fixture: no contact, no route.
securityTxt:
  contact: ""

web:
  replicaCount: 1
  oidc:
    clientId: 33333333-3333-3333-3333-333333333333
    apiScope: api://11111111-1111-1111-1111-111111111111/access_as_user
  httpRoute:
    enabled: true
    hostnames:
      - blackhole-dev.apps.onelite.feather

portal:
  replicaCount: 1
  origin: https://appeal-dev.apps.onelite.feather
  httpRoute:
    enabled: true
    hostnames:
      - appeal-dev.apps.onelite.feather

discord:
  existingSecret: blackhole-discord
  clientId: 44444444-4444-4444-4444-444444444444
  panelUrl: https://blackhole-dev.apps.onelite.feather
  ids:
    guildId: "100000000000000001"
    teamChannelId: "100000000000000002"
    staffRoleId: "100000000000000003"
    ticketCategoryId: "100000000000000004"
    archiveCategoryId: "100000000000000005"

clamav:
  enabled: false
  externalHost: blackhole-clamav.blackhole.svc
