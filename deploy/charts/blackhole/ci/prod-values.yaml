# Test fixture: a production-like install with every component and every exposure switched on.
# Only placeholders: no real tenant, client or channel ids and no secret values (Secrets are referenced by
# name). The hosts are the decided public hosts of the chart defaults.
global:
  environment: prod
  imagePullSecrets:
    - name: harbor-pull
  priorityClassName: feather-standard

database:
  existingSecret: blackhole-db
redis:
  existingSecret: blackhole-redis
nats:
  existingSecret: blackhole-nats
  stream:
    replicas: 3
s3:
  endpoint: http://s3.example.invalid:80
  bucket: blackhole-evidence
  existingSecret: blackhole-s3
keys:
  existingSecret: blackhole-keys

auth:
  tenantId: 00000000-0000-0000-0000-000000000000
  apiClientId: 11111111-1111-1111-1111-111111111111
  roles:
    admin: 20000000-0000-0000-0000-000000000001
    moderator: 20000000-0000-0000-0000-000000000002
    viewer: 20000000-0000-0000-0000-000000000003
    metrics: 20000000-0000-0000-0000-000000000004

backend:
  replicaCount: 2
  secretRevision: "3"
  metrics:
    serviceMonitor:
      enabled: true
      oauth2:
        existingSecret: blackhole-metrics
  externalApi:
    enabled: true

securityTxt:
  # Placeholder contact (.invalid never resolves): the real mailbox is set by the operator, not in the repository.
  contact: mailto:security@example.invalid
  expires: "2027-06-30T12:00:00Z"

web:
  replicaCount: 2
  origin: https://blackhole.onelitefeather.net
  oidc:
    clientId: 33333333-3333-3333-3333-333333333333
    apiScope: api://11111111-1111-1111-1111-111111111111/access_as_user
  ingress:
    enabled: true

portal:
  replicaCount: 2
  origin: https://appeal.onelitefeather.net
  ingress:
    enabled: true

discord:
  existingSecret: blackhole-discord
  clientId: 44444444-4444-4444-4444-444444444444
  panelUrl: https://blackhole.onelitefeather.net
  ids:
    guildId: "100000000000000001"
    teamChannelId: "100000000000000002"
    staffRoleId: "100000000000000003"
    ticketCategoryId: "100000000000000004"
    archiveCategoryId: "100000000000000005"
  metrics:
    podMonitor:
      enabled: true

clamav:
  enabled: true
  persistence:
    storageClass: ceph-rbd-fr01
