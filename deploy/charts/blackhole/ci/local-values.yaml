# Test fixture: local values (a kind cluster or a laptop). The portal origin may be plain http here, and
# only the backend, the portal and the scanner are rendered.
global:
  environment: local

database:
  existingSecret: blackhole-db
redis:
  existingSecret: blackhole-redis
nats:
  existingSecret: blackhole-nats
s3:
  endpoint: http://s3.example.invalid:80
  bucket: blackhole-evidence
  existingSecret: blackhole-s3
keys:
  existingSecret: blackhole-keys

auth:
  tenantId: 00000000-0000-0000-0000-000000000000
  apiClientId: 11111111-1111-1111-1111-111111111111
  roles:
    admin: 20000000-0000-0000-0000-000000000001
    moderator: 20000000-0000-0000-0000-000000000002
    viewer: 20000000-0000-0000-0000-000000000003
    metrics: 20000000-0000-0000-0000-000000000004

backend:
  replicaCount: 1

# security.txt is off in this fixture: no contact, no route.
securityTxt:
  contact: ""

web:
  enabled: false
portal:
  replicaCount: 1
  origin: http://localhost:8082
discord:
  enabled: false
clamav:
  enabled: true
