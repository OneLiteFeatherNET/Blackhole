{{- if .Values.backend.enabled }}
{{- $v := .Values.backend }}
{{- $d := dict "ctx" . "component" "backend" "values" $v }}
{{- $name := include "blackhole.fullname" $d }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blackhole.labels" $d | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blackhole.labels" $d | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  strategy:
    {{- toYaml $v.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "blackhole.selectorLabels" $d | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blackhole.podLabels" $d | nindent 8 }}
      annotations:
        {{- include "blackhole.podAnnotations" (dict "values" $v "extra" (dict "checksum/config" (include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum))) | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "blackhole.podDefaults" . | nindent 6 }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "blackhole.image" (dict "ctx" . "image" $v.image "app" true) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $v.service.port }}
              protocol: TCP
          # Secrets only ever by reference; everything else is in the ConfigMap (envFrom below) or in
          # backend.env. Flyway migrates on start: the startupProbe allows ten minutes for it.
          env:
            {{- include "blackhole.secretEnv" (dict "name" "JDBC_URL" "secret" .Values.database.existingSecret "key" "JDBC_URL") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "JDBC_USER" "secret" .Values.database.existingSecret "key" "JDBC_USER") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "JDBC_PASSWORD" "secret" .Values.database.existingSecret "key" "JDBC_PASSWORD") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "REDIS_URI" "secret" .Values.redis.existingSecret "key" "REDIS_URI") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "BLACKHOLE_BANID_KEY" "secret" .Values.keys.existingSecret "key" "BLACKHOLE_BANID_KEY") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "BLACKHOLE_EVASION_IP_SALT" "secret" .Values.keys.existingSecret "key" "BLACKHOLE_EVASION_IP_SALT") | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "BLACKHOLE_EVIDENCE_S3_ACCESS_KEY" "secret" .Values.s3.existingSecret "key" .Values.s3.accessKeyKey) | nindent 12 }}
            {{- include "blackhole.secretEnv" (dict "name" "BLACKHOLE_EVIDENCE_S3_SECRET_KEY" "secret" .Values.s3.existingSecret "key" .Values.s3.secretKeyKey) | nindent 12 }}
            {{- include "blackhole.env" $v.env | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
            {{- include "blackhole.envFrom" $v.envFrom | nindent 12 }}
          startupProbe:
            {{- toYaml $v.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $v.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $v.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            # The root file system is read-only; the JVM and multipart uploads need a temp dir.
            - name: tmp
              mountPath: /tmp
            - name: nats
              mountPath: {{ .Values.nats.credsMountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: nats
          secret:
            secretName: {{ include "blackhole.natsSecret" (dict "ctx" . "values" $v) }}
            items:
              - key: {{ include "blackhole.natsCredsKey" (dict "ctx" . "values" $v) }}
                path: {{ include "blackhole.natsCredsKey" (dict "ctx" . "values" $v) }}
      {{- include "blackhole.scheduling" (dict "ctx" . "component" "backend" "values" $v "spread" true) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blackhole.labels" $d | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "blackhole.selectorLabels" $d | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
{{- if and $v.pdb.enabled (gt (int $v.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "blackhole.labels" $d | nindent 4 }}
spec:
  maxUnavailable: {{ $v.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "blackhole.selectorLabels" $d | nindent 6 }}
{{- end }}
{{- end }}
