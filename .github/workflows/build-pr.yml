name: Build PR
on: [pull_request]
jobs:
  build_pr:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build Pull Request Branch
    runs-on: ${{ matrix.os }}
    env:
      ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
      ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build on ${{ matrix.os }}
        run: ./gradlew clean build

  web_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the admin web UI image
        run: docker build -f web/Dockerfile -t blackhole-web:pr .
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Smoke-check the admin web UI image
        run: node web/scripts/smoke.mjs blackhole-web:pr

  portal_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build portal image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the appeal portal image
        run: docker build -f portal/Dockerfile -t blackhole-portal:pr .
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Smoke-check the appeal portal image
        run: node portal/scripts/smoke.mjs blackhole-portal:pr

  discord_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build Discord bot image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the Discord bot image
        run: docker build -f discord/Dockerfile -t blackhole-discord:pr .
      - name: Smoke-check the Discord bot image
        # Without configuration the bot must refuse to start with exit code 2 and name what is missing,
        # and it must not run as root.
        run: |
          set +e
          out=$(docker run --rm blackhole-discord:pr 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q "DISCORD_TOKEN is missing"
          test "$(docker run --rm --entrypoint id blackhole-discord:pr -u)" != "0"

  chart:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Lint and render the Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install the pinned chart tools
        # Helm, yq and kubeconform with exact versions and checksums (one place: the script). They go into
        # RUNNER_TEMP and onto PATH, not into /usr/local/bin: no sudo, nothing outside the job is touched.
        run: |
          .github/scripts/install-chart-tools.sh "${RUNNER_TEMP}/chart-tools"
          echo "${RUNNER_TEMP}/chart-tools" >> "${GITHUB_PATH}"
      - name: Lint the chart
        run: |
          for values in deploy/charts/blackhole/ci/*-values.yaml; do
            helm lint deploy/charts/blackhole -f "${values}"
          done
      - name: Render the chart and check the values schema
        # render.sh renders every ci/*-values.yaml and runs the negative checks: the schema must reject unknown
        # keys, missing required values, literal secrets and RabbitMQ settings, and each failure message has
        # to name the value it guards. workloads.sh, exposure.sh and psa.sh assert the rendered manifests
        # (secret wiring, probes, the API host route table with the cloudflared path semantics, the
        # restricted Pod Security fields).
        run: deploy/charts/blackhole/tests/run-all.sh
      - name: Validate the rendered manifests with kubeconform
        # -strict, no -ignore-missing-schemas: a kind without a schema fails the run. The three CRDs
        # (ServiceMonitor, PodMonitor, HTTPRoute) use the Datree catalog pinned to a commit.
        run: deploy/charts/blackhole/tests/kubeconform.sh
      - name: Test the version script
        run: .github/scripts/chart-version.test.sh
      - name: Check the Kubernetes runbook against the code
        # Every environment variable the runbook names exists, relative links resolve, and no key material or
        # undecided hostname is pasted into the page.
        run: .github/scripts/check-kubernetes-doc.sh
      - name: The chart packages
        run: helm package deploy/charts/blackhole --destination "${RUNNER_TEMP}/chart-package"
