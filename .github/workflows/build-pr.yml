name: Build PR
on: [pull_request]
jobs:
  build_pr:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build Pull Request Branch
    runs-on: ${{ matrix.os }}
    env:
      ONELITEFEATHER_MAVEN_USERNAME: ${{ secrets.ONELITEFEATHER_MAVEN_USERNAME }}
      ONELITEFEATHER_MAVEN_PASSWORD: ${{ secrets.ONELITEFEATHER_MAVEN_PASSWORD }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build on ${{ matrix.os }}
        run: ./gradlew clean build

  web_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the admin web UI image
        run: docker build -f web/Dockerfile -t blackhole-web:pr .
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Smoke-check the admin web UI image
        run: node web/scripts/smoke.mjs blackhole-web:pr

  portal_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build portal image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the appeal portal image
        run: docker build -f portal/Dockerfile -t blackhole-portal:pr .
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Smoke-check the appeal portal image
        run: node portal/scripts/smoke.mjs blackhole-portal:pr

  discord_image:
    if: github.repository_owner == 'OneLiteFeatherNET'
    name: Build Discord bot image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the Discord bot image
        run: docker build -f discord/Dockerfile -t blackhole-discord:pr .
      - name: Smoke-check the Discord bot image
        # Without configuration the bot must refuse to start with exit code 2 and name what is missing,
        # and it must not run as root.
        run: |
          set +e
          out=$(docker run --rm blackhole-discord:pr 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q "DISCORD_TOKEN is missing"
          test "$(docker run --rm --entrypoint id blackhole-discord:pr -u)" != "0"
