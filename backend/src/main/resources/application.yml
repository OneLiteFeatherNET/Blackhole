# Redis mirrors active-punishment state for Velocity proxies (net.onelitefeather.blackhole.backend.punishment)
# - RedisSyncConsumer is the sole writer, bridging the domain event bus (punishment.created/
# expired/revoked, appeal.resolved) onto Redis keys + a pub/sub channel so every proxy in a
# multi-proxy network sees the same state without hitting this API on every login/chat message.
redis:
  uri: ${REDIS_URI:`redis://localhost:6379`}

# Datasource - PostgreSQL is the only supported database. Defaults match docker/docker-compose.yml.
datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://127.0.0.1:5432/blackhole`}
    password: ${JDBC_PASSWORD:`blackhole`}
    username: ${JDBC_USER:`blackhole`}
    driver-class-name: ${JDBC_DRIVER:`org.postgresql.Driver`}
# JPA
jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: validate
        show_sql: false

# Flyway is the sole owner of the schema; Hibernate only validates it at startup
# (hbm2ddl.auto=validate) and never creates or alters tables. Migrations are append-only
# V<n>__<description>.sql files in db/migration: never edit an applied one, add the next
# version instead. A mismatch between an entity and the schema fails startup.
flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

# Operational endpoints. /health is public (orchestrator probes) and shows the status only, no
# component details. /prometheus is protected: it needs the METRICS role (see the intercept-url-map
# under micronaut.security below), so a scraper authenticates with a client-credentials token.
# Every other management endpoint (beans, routes, threaddump, flyway, info, metrics, refresh) is off:
# a sensitive endpoint is open to any signed-in caller, even one without a role.
endpoints:
  all:
    enabled: false
  health:
    enabled: true
    details-visible: NEVER
  prometheus:
    enabled: true
    sensitive: false

blackhole:
  staff:
    avatar:
      # HMAC secret that derives the public avatar key from a Minecraft UUID (staff-profile). The key is what a
      # player's browser sees, so the UUID cannot be recovered from it. SECRET: the default is for local
      # development only; production must set BLACKHOLE_STAFF_AVATAR_KEY. Changing it changes every avatar key.
      key: ${BLACKHOLE_STAFF_AVATAR_KEY:local-dev-only-staff-avatar-secret}
      # Session server that serves a linked account's skin. Must be an https URL (checked at startup). The skin
      # texture is always fetched from the fixed texture host, whatever this points at.
      source-url: ${BLACKHOLE_STAFF_AVATAR_SOURCE_URL:`https://sessionserver.mojang.com`}
      # When the cached heads of linked staff accounts are refreshed (cron, weekly by default).
      refresh-cron: ${BLACKHOLE_STAFF_AVATAR_REFRESH_CRON:0 30 3 * * MON}
  # NATS JetStream backs the domain event bus: events go to the subjects blackhole.events.<event type> and are
  # captured by the stream BLACKHOLE_EVENTS (see net.onelitefeather.blackhole.backend.events). The backend creates
  # or updates the stream and its durable consumer blackhole-redis-sync at startup. An unreachable server or an
  # unreadable credentials file is logged and never stops the application: the bus is an additive side channel.
  events:
    nats:
      # Server URL(s), comma separated. In feather-core: nats://nats.nats.svc:4222
      url: ${NATS_URL:`nats://localhost:4222`}
      # Path of the .creds file of the NATS user. Empty means no authentication (local development only).
      creds-file: ${NATS_CREDS_FILE:}
      # The name this client shows on the NATS server.
      connection-name: ${NATS_CONNECTION_NAME:blackhole-backend}
      # How long one connection attempt may take. The client reconnects forever and never blocks a request.
      connect-timeout: ${NATS_CONNECT_TIMEOUT:5s}
      # Replicas of the stream: 1 for a single local server, 3 in the feather-core cluster.
      stream-replicas: ${NATS_STREAM_REPLICAS:1}
      # How long an event is kept (ISO-8601 duration). Replaces the 7 day queue TTL of the old broker.
      stream-max-age: ${NATS_EVENTS_MAX_AGE:P7D}
      # Upper bound of the stream's size in bytes (default 2 GiB); the oldest events are dropped beyond it.
      stream-max-bytes: ${NATS_EVENTS_MAX_BYTES:2147483648}

  # Authentication: every route needs an Entra ID (OIDC) access token as "Authorization: Bearer",
  # except GET /health. Tokens are verified against the issuer's published keys (JWKS); the
  # backend keeps no session and sets no cookie. There is no setting that turns authentication off.
  # The defaults below point at the local mock OIDC server (docker/docker-compose.yml, dev only);
  # for a real tenant set the BLACKHOLE_AUTH_* variables, nothing else.
  security:
    # The Entra tenant (directory) id; a token whose "tid" claim differs is refused. Required outside
    # the dev and test environments (StartupRequirementsGuard); empty is accepted only there.
    tenant-id: ${BLACKHOLE_AUTH_TENANT_ID:}
    # Where the issuer publishes its signing keys. Entra: https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys
    jwks-url: ${BLACKHOLE_AUTH_JWKS_URL:`http://localhost:18090/blackhole/jwks`}
    # Seconds of clock difference tolerated between the issuer and this backend when checking a
    # token's exp and nbf. Bounded to 0..60: a larger value stops the backend from starting, so
    # expiry cannot be silently widened (RFC 8725). It can only be lowered.
    clock-skew-seconds: ${BLACKHOLE_AUTH_CLOCK_SKEW_SECONDS:60}
    # The backend refuses to start with a plain http or localhost issuer outside the dev and test
    # environments (so the mock-server defaults never reach production). Only set this to true for a
    # deliberate exception, e.g. an internal http identity provider on a private network.
    allow-insecure-issuer: ${BLACKHOLE_AUTH_ALLOW_INSECURE_ISSUER:false}
    # Linking a staff member's Minecraft account to their sign-in (/blackhole link <code> in game).
    # A code is single use and valid for this long (ISO-8601 duration). There is deliberately no
    # failed-attempt cap: guessing is bounded by the code's 40 bits, this lifetime, and by granting
    # the proxy permission blackhole.link to staff groups only. Rate limiting belongs to the infra.
    staff-link:
      ttl: ${BLACKHOLE_STAFF_LINK_TTL:PT5M}
    # How token claims become roles. The token kind selects the claim: delegated tokens (a signed-in
    # user, they carry "scp") are read from claim-human; app-only tokens (client credentials) from
    # claim-machine. ADMIN implies MODERATOR implies VIEWER. Values are comma separated.
    roles:
      claim-human: ${BLACKHOLE_AUTH_ROLES_CLAIM_HUMAN:groups}
      claim-machine: ${BLACKHOLE_AUTH_ROLES_CLAIM_MACHINE:roles}
      # Entra GROUP OBJECT IDS (not group names) of the security groups that grant each role on
      # delegated tokens. The defaults are fake ids that match docker/mock-oauth/config.json. With
      # Entra ID P1 you can switch to app-role assignment: set claim-human to "roles" and these to
      # the app role values, no code change.
      admin: ${BLACKHOLE_AUTH_ROLE_ADMIN:5d0c0a00-0000-4000-8000-000000000001}
      moderator: ${BLACKHOLE_AUTH_ROLE_MODERATOR:5d0c0a00-0000-4000-8000-000000000002}
      viewer: ${BLACKHOLE_AUTH_ROLE_VIEWER:5d0c0a00-0000-4000-8000-000000000003}
      metrics: ${BLACKHOLE_AUTH_ROLE_METRICS:5d0c0a00-0000-4000-8000-000000000004}
      # App role values (not group ids) that grant PROXY (the Velocity plugin) and METRICS (the
      # Prometheus scraper) on app-only tokens.
      machine-proxy: ${BLACKHOLE_AUTH_MACHINE_ROLE_PROXY:Blackhole.Proxy}
      machine-metrics: ${BLACKHOLE_AUTH_MACHINE_ROLE_METRICS:Blackhole.Metrics}
      # The Discord bot (discord module) acts with this app role; it only reaches /discord/**.
      machine-discord: ${BLACKHOLE_AUTH_MACHINE_ROLE_DISCORD:Blackhole.Discord}
      # Client ids (the azp claim, never appid) allowed to act with each machine role. An app-only
      # token with the role value but another azp gets no role. Comma separated; empty means nobody,
      # so production must set these. The dev defaults are in application-dev.yml.
      machine-clients:
        proxy: ${BLACKHOLE_AUTH_MACHINE_CLIENTS_PROXY:}
        metrics: ${BLACKHOLE_AUTH_MACHINE_CLIENTS_METRICS:}
        discord: ${BLACKHOLE_AUTH_MACHINE_CLIENTS_DISCORD:}
  # Ban ID: the 8 character credential a player opens the appeal portal with. It is stored only as an
  # HMAC (login lookup) and an AES-GCM ciphertext (staff reveal), both derived from this one secret:
  # 32 random bytes, base64 (openssl rand -base64 32). Unset is allowed
  # in the dev and test environments only: the backend then uses a random key for that run and logs a
  # warning, so Ban IDs do not survive a restart. Elsewhere it refuses to start without the key. Losing or changing the
  # key makes every Ban ID unreadable and unusable, so back it up like any other secret. The backfill
  # issues Ban IDs to punishments that have none (right after start, then periodically).
  # Public ban list (publicbans/). The key derives the entry hash of each listed sanction; the guard requires it
  # outside dev and test only when ban-list clients are configured. Rotating it changes every entry hash.
  public-bans:
    key: ${BLACKHOLE_PUBLIC_BAN_KEY:}
    # Ended entries (revoked or expired) stay listed this long after they end. Active entries are always listed.
    retention: ${BLACKHOLE_PUBLIC_BANS_RETENTION:P90D}
    # Summary counts below this minimum are withheld, so a single entry cannot be read off the summary.
    summary-min-count: ${BLACKHOLE_PUBLIC_BANS_SUMMARY_MIN_COUNT:5}
  # Named ban-list clients (Basic Auth). Comma-separated names; each needs one file in secrets-dir holding its
  # Argon2id PHC hash. Clients are read once at startup: a rotation or a change is a restart.
  ban-list:
    clients: ${BLACKHOLE_BAN_LIST_CLIENTS:}
    secrets-dir: ${BLACKHOLE_BAN_LIST_SECRETS_DIR:/etc/blackhole/ban-list}
    # The ingress addresses or CIDR blocks whose X-Forwarded-Proto is believed. Empty trusts none, so the list then answers
    # 403 HTTPS_REQUIRED to every request that does not arrive over TLS in this process.
    trusted-ingress: ${BLACKHOLE_BAN_LIST_TRUSTED_INGRESS:}
  banid:
    key: ${BLACKHOLE_BANID_KEY:}
    # Key rotation recovery. After BLACKHOLE_BANID_KEY was replaced, set this to true for ONE start: the
    # backend then reissues a new Ban ID to every punishment the new key cannot read (batched, idempotent,
    # resumable, logs counts only), revokes their player sessions and records ban_id.reissued with the
    # reason KEY_ROTATION. Off by default and never implied by a key change; switch it off afterwards.
    reissue-all: ${BLACKHOLE_BANID_REISSUE_ALL:false}
  # Discord bot integration. Linking a staff member or player to their Discord account: the person gets
  # a one-time code (panel, or /blackhole discord in game) and types /link <code> in Discord. A code is
  # single use and valid for this long (ISO-8601 duration). No failed-attempt cap in the app (infra
  # owns rate limiting). The Discord user id is personal data, stored only in the erasable link row.
  discord:
    link:
      ttl: ${BLACKHOLE_DISCORD_LINK_TTL:PT10M}
    # Discord appeal tickets (/discord/tickets, role DISCORD only). These bound what one request carries or
    # returns; they are not rate limits (infra owns those: a global limit on POST /discord/tickets and
    # POST /discord/leak-check at the edge, see the discord module's docs). Everything the bot needs to resume
    # (tickets, message links, cursors) lives in the database, so these are the only backend settings.
    # A staff member's role snapshot (staff_actor.roles) is trusted for Discord actions this long after their last
    # verified request. A removed MODERATOR keeps Discord access until then (proposed 24 hours; the team may shorten it).
    staff-role-max-age: ${BLACKHOLE_DISCORD_STAFF_ROLE_MAX_AGE:PT24H}
    ticket:
      # Events one outbox read returns when the bot names no limit, and the most it may ask for.
      outbox-page-size: ${BLACKHOLE_DISCORD_OUTBOX_PAGE_SIZE:50}
      outbox-max-page-size: ${BLACKHOLE_DISCORD_OUTBOX_MAX_PAGE_SIZE:200}
      # The most tickets one listing returns (the bot reads them at start).
      list-limit: ${BLACKHOLE_DISCORD_LIST_LIMIT:200}
      # The most messages (and deletes) one ingest request may carry; the bot posts history in batches of 100.
      max-batch-items: ${BLACKHOLE_DISCORD_MAX_BATCH_ITEMS:200}
      # A longer message text is cut to this many characters (Discord allows 4000 with Nitro). The text is
      # stored complete otherwise: the transcript must equal the channel.
      max-text-length: ${BLACKHOLE_DISCORD_MAX_TEXT_LENGTH:4000}
      # The most Ban ID candidates one leak check examines.
      max-leak-candidates: ${BLACKHOLE_DISCORD_MAX_LEAK_CANDIDATES:5}
  # Public API for the appeal portal (/public/**). Only the portal's backend-for-frontend calls it, with a
  # player session token (Authorization: Bearer) that a good Ban ID login returns once; no staff token is
  # accepted there and a player session reaches nothing outside /public. Rate limiting is NOT done here:
  # the operator limits POST /public/session (the Ban ID guess) and the write routes at the edge, see the
  # portal deployment notes. The app only counts logins in blackhole.public.login{result}.
  # Request bodies carry the Ban ID: nothing in this application logs them, and the HTTP server loggers
  # stay at INFO in logback.xml - never raise them to DEBUG/TRACE on a deployment that serves /public.
  public:
    session:
      # A session ends after this long without a request (sliding) ...
      idle: ${BLACKHOLE_PUBLIC_SESSION_IDLE:PT30M}
      # ... and this long after the login however busy it is (also the cookie lifetime of the portal).
      absolute: ${BLACKHOLE_PUBLIC_SESSION_ABSOLUTE:PT4H}
      # How often sessions past either limit are deleted.
      sweep-interval: ${BLACKHOLE_PUBLIC_SESSION_SWEEP_INTERVAL:PT1M}
    message:
      # The longest player message and appeal statement, in characters (never above 2000, the cap of
      # every conversation message).
      max-length: ${BLACKHOLE_PUBLIC_MESSAGE_MAX_LENGTH:2000}
    conversation:
      # How many entries one GET /public/conversation page holds at most; the portal polls with the
      # last seq it saw.
      page-size: ${BLACKHOLE_PUBLIC_CONVERSATION_PAGE_SIZE:200}
  # The appeal chat. Messages are stored as the Markdown source that was written and parsed on every read into
  # a sanitised block tree (module markdown): http(s) links only, nothing is fetched or previewed.
  chat:
    links:
      # Comma separated. A link to one of these domains or a true subdomain of one (appeal.onelitefeather.net,
      # not evilonelitefeather.net) opens directly; every other link goes through the "Leave" page of the portal
      # and the panel. An empty value makes every link external.
      trusted-domains: ${BLACKHOLE_CHAT_LINKS_TRUSTED_DOMAINS:onelitefeather.net}
    # Files in the appeal conversation, in both directions. They go through the evidence upload pipeline (virus scan first,
    # fail closed; the type is decided from the bytes, never from the client's type or name; PNG and JPEG are re-encoded,
    # WebP is stripped of EXIF and XMP and never animated, a PDF with active content or encryption is refused, text must be
    # strict UTF-8 and not a markup document). A file is staged first and only a message that names it makes it visible.
    # The limits bound stored state (size, count, quota); none of them is a rate limit, the edge owns rates.
    attachments:
      # Largest chat file, in bytes (HTTP 413).
      max-bytes: ${BLACKHOLE_CHAT_ATTACHMENTS_MAX_BYTES:10485760}
      # Most files one message may name (HTTP 400).
      max-per-message: ${BLACKHOLE_CHAT_ATTACHMENTS_MAX_PER_MESSAGE:5}
      # Detected content types a chat accepts. Remove one to refuse it (HTTP 415); video is never a chat type.
      allowed-types: ${BLACKHOLE_CHAT_ATTACHMENTS_ALLOWED_TYPES:image/png,image/jpeg,image/webp,application/pdf,text/plain}
      # Most files one appeal (a case, for staff files) may hold, staged and sent together (HTTP 409 QUOTA).
      max-files-per-appeal: ${BLACKHOLE_CHAT_ATTACHMENTS_MAX_FILES_PER_APPEAL:50}
      # Most files that may wait for a message at once in one appeal (HTTP 409 QUOTA). A file nobody sends is deleted
      # after blackhole.evidence.pending-ttl.
      max-staged: ${BLACKHOLE_CHAT_ATTACHMENTS_MAX_STAGED:10}
    share:
      # Most lines of a chat capture one share may show to the player; there is no "share all".
      max-lines: ${BLACKHOLE_CHAT_SHARE_MAX_LINES:20}
    # Live updates of the chat over Server-Sent Events (the player's stream and the case's stream). A stream holds state on this
    # replica, so these bound that state; none of them is a rate limit. Until the bus adapter exists, a change raised on another
    # replica reaches a stream here only through the client's 30 second safety poll.
    live:
      # Most open live streams on this replica, players and staff together. Beyond it a new stream answers 503 and the client polls.
      max-streams: ${BLACKHOLE_CHAT_LIVE_MAX_STREAMS:2000}
      # How often a keep-alive comment is sent on an open stream, and how often a player's session is checked. Keep it well below the
      # idle timeout of the tunnel and the proxies (about 100 seconds on Cloudflare).
      keep-alive: ${BLACKHOLE_CHAT_LIVE_KEEP_ALIVE:PT15S}
      # How long a stream may stay open before the server ends it and the client reconnects with its Last-Event-ID.
      max-lifetime: ${BLACKHOLE_CHAT_LIVE_MAX_LIFETIME:PT30M}
  # Swagger / OpenAPI views are only served when enabled (default off; on in the dev profile) and
  # then need the VIEWER role.
  docs:
    enabled: ${BLACKHOLE_DOCS_ENABLED:false}
  # Report submission is rate-limited per reporterHash within this rolling window, so reporting
  # itself can't become a griefing vector. reporterHash is client-supplied (no per-player identity
  # exists yet), so max-reports-network-wide is an additional aggregate backstop that still caps
  # abuse even if a caller varies reporterHash on every request.
  report:
    rate-limit:
      max-reports: ${BLACKHOLE_REPORT_RATE_LIMIT_MAX:5}
      max-reports-network-wide: ${BLACKHOLE_REPORT_RATE_LIMIT_MAX_NETWORK_WIDE:50}
      window: ${BLACKHOLE_REPORT_RATE_LIMIT_WINDOW:PT10M}
    # Feedback to the reporter: resolving a report queues a short message (action taken / no action,
    # never the punishment) that the proxy shows at once or at the reporter's next login. A message
    # nobody picks up is deleted after ttl; the sweeper runs every sweep-interval.
    feedback:
      ttl: ${BLACKHOLE_REPORT_FEEDBACK_TTL:P14D}
      sweep-interval: ${BLACKHOLE_REPORT_FEEDBACK_SWEEP_INTERVAL:PT1H}
  # Staff audit log. retention is how long an entry is kept (one year by default, a team decision still open);
  # AuditRetentionSweeper deletes older entries every sweep-interval, in batches.
  audit:
    retention: ${BLACKHOLE_AUDIT_RETENTION:P365D}
    sweep-interval: ${BLACKHOLE_AUDIT_SWEEP_INTERVAL:PT1H}
  # PunishmentExpirySweeper periodically moves expired active bans/mutes into a profile's
  # history, so expiry is an active background process rather than something only noticed the
  # next time a profile happens to be read. sweep-interval controls how often that scan runs -
  # shortened via env var for testing, 1 minute by default in production.
  punishment:
    expiry:
      sweep-interval: ${BLACKHOLE_PUNISHMENT_EXPIRY_SWEEP_INTERVAL:1m}
    # Escalating staff templates: the step of a template is chosen by how many of the player's earlier,
    # not-lifted punishments in the template's escalation group were created within this window
    # (ISO-8601). A template can carry its own window; this is the fallback for templates without one.
    # Warnings (WARN steps) count towards escalation within the escalation window unless a template sets
    # its own warnWindow; no env var is involved, the window is per template.
    escalation:
      default-window: ${BLACKHOLE_PUNISHMENT_ESCALATION_DEFAULT_WINDOW:P365D}
  # Kicks: how long a kick waits for a proxy to acknowledge it (ISO-8601). The backend never waits in
  # a request; the deadline is stored with the kick and its status is derived when read: PENDING before
  # it, NOT_ONLINE (NO_PROXY_ANSWER for a mass kick) at or after it when no proxy answered positively.
  kick:
    ack-timeout: ${BLACKHOLE_KICK_ACK_TIMEOUT:PT5S}
  # Staff rollback (add-staff-rollback). preview-ttl is how long a frozen preview stays startable (ISO-8601);
  # max-items caps how many punishments one preview may freeze, so one job and its NATS burst stay bounded.
  # lease is how long a runner keeps a job before another replica may take it over after a crash (ISO-8601);
  # tick-interval is how often the runner looks for work (Micronaut duration).
  rollback:
    preview-ttl: ${BLACKHOLE_ROLLBACK_PREVIEW_TTL:PT1H}
    max-items: ${BLACKHOLE_ROLLBACK_MAX_ITEMS:5000}
    lease: ${BLACKHOLE_ROLLBACK_LEASE:PT2M}
    tick-interval: ${BLACKHOLE_ROLLBACK_TICK_INTERVAL:5s}
  # Punishment case: an append-only timeline of what happens to each punishment. The flows record
  # their events after their own write; a failed recording is counted in
  # blackhole.case.record.failures and never fails the write. CaseReconciler repairs lost recordings
  # from the authoritative rows (origin RECONSTRUCTED, dated by the source row). interval is how
  # often it runs (ISO-8601 or Micronaut duration; "0" switches the reconciler off); look-back is how
  # far back it looks for punishments, appeals and evidence without their event.
  case:
    reconcile:
      interval: ${BLACKHOLE_CASE_RECONCILE_INTERVAL:10m}
      look-back: ${BLACKHOLE_CASE_RECONCILE_LOOK_BACK:P2D}
      # A source row younger than this is not reconstructed: its live recording may still be in
      # flight, and a repair would wrongly label it RECONSTRUCTED. ISO-8601 duration.
      grace-period: ${BLACKHOLE_CASE_RECONCILE_GRACE_PERIOD:PT5M}
  # Appeal protocol: when an appeal is decided, its conversation is turned into a protocol (a text and a
  # JSON file generated from the stored case events only) and stored as evidence of kind TRANSCRIPT,
  # versioned and kept as long as the punishment. ProtocolReconciler finishes purges after a redaction,
  # creates missing protocols and regenerates a protocol whose conversation changed after it was stored.
  protocol:
    # How often the reconciler runs (ISO-8601 or Micronaut duration; "0" switches it off).
    reconcile-interval: ${BLACKHOLE_PROTOCOL_RECONCILE_INTERVAL:PT5M}
    # The most appeals one reconciler run looks at.
    reconcile-batch: ${BLACKHOLE_PROTOCOL_RECONCILE_BATCH:200}
    # A changed conversation is regenerated by the reconciler only once it was quiet for this long
    # (ISO-8601 duration, on the injected clock). The decision and a redaction force it at once.
    settle-delay: ${BLACKHOLE_PROTOCOL_SETTLE_DELAY:PT1M}
    # How often one generation looks again when a concurrent run took its version number.
    retries: ${BLACKHOLE_PROTOCOL_RETRIES:3}
    # Largest generated file (text or JSON), in bytes. A larger protocol is not stored, not truncated:
    # generation fails with a metric and a log line.
    max-bytes: ${BLACKHOLE_PROTOCOL_MAX_BYTES:16777216}
  # ELO scoring is per punishment section (chat and network ship by default; operators add more via
  # /section). A section owns its base score, soft and permanent thresholds, soft duration, pardon
  # score and decay rate - they are data managed through the API, not config. Crossing below a
  # section's soft threshold applies an automatic temporary punishment, falling below its permanent
  # threshold an automatic permanent one; no template or operator configuration is involved.
  # decay.interval-ms controls the "day" length pending decay is measured in - shortened via env var
  # for testing, 1 real day (86400000ms) in production.
  elo:
    decay:
      interval-ms: ${BLACKHOLE_ELO_DECAY_INTERVAL_MS:86400000}
      sweep-cron: ${BLACKHOLE_ELO_DECAY_SWEEP_CRON:`0 0 3 * * *`}
    chat:
      # The section a flagged chat message is scored in.
      section: ${BLACKHOLE_ELO_CHAT_SECTION:chat}
      flag-delta: ${BLACKHOLE_ELO_CHAT_FLAG_DELTA:-50}
      evidence-retention-days: ${BLACKHOLE_ELO_CHAT_EVIDENCE_RETENTION_DAYS:60}
      toxicity:
        # OFF never calls the scorer, SHADOW counts and logs would-be flags without any ELO change,
        # ENFORCE applies the flag. Changing the mode needs a restart.
        mode: ${BLACKHOLE_ELO_CHAT_TOXICITY_MODE:OFF}
        # A message is flagged when its score (the highest matched category weight) reaches this.
        flag-threshold: ${BLACKHOLE_ELO_CHAT_TOXICITY_FLAG_THRESHOLD:0.5}
        # Comma-separated game phrases that are never matched, for example "kill the dragon".
        allow-list: ${BLACKHOLE_ELO_CHAT_TOXICITY_ALLOW_LIST:kill the dragon,bed wars}
        # Comma-separated words and phrases per category (INSULT, THREAT, SEXUAL, HATE, SPAM).
        # The repository ships no word list. Empty defaults mean nothing is matched until the deployment
        # fills these in via the env vars.
        terms:
          insult: ${BLACKHOLE_ELO_CHAT_TOXICITY_TERMS_INSULT:}
          threat: ${BLACKHOLE_ELO_CHAT_TOXICITY_TERMS_THREAT:}
          sexual: ${BLACKHOLE_ELO_CHAT_TOXICITY_TERMS_SEXUAL:}
          hate: ${BLACKHOLE_ELO_CHAT_TOXICITY_TERMS_HATE:}
          spam: ${BLACKHOLE_ELO_CHAT_TOXICITY_TERMS_SPAM:}
        # Weight of each category in [0, 1]. A category's weight is its ELO strength.
        weights:
          threat: ${BLACKHOLE_ELO_CHAT_TOXICITY_WEIGHTS_THREAT:1.0}
          hate: ${BLACKHOLE_ELO_CHAT_TOXICITY_WEIGHTS_HATE:0.9}
          sexual: ${BLACKHOLE_ELO_CHAT_TOXICITY_WEIGHTS_SEXUAL:0.8}
          insult: ${BLACKHOLE_ELO_CHAT_TOXICITY_WEIGHTS_INSULT:0.6}
          spam: ${BLACKHOLE_ELO_CHAT_TOXICITY_WEIGHTS_SPAM:0.5}
    report:
      actioned-delta: ${BLACKHOLE_ELO_REPORT_ACTIONED_DELTA:-100}
      # Awarded to the reporter when their report is resolved ACTIONED with an actual
      # punishment applied to the reported player.
      reward-delta: ${BLACKHOLE_ELO_REPORT_REWARD_DELTA:50}
      # The section each report category scores in when a report is resolved ACTIONED. A blank
      # value means that category has no ELO effect.
      category-sections:
        CHAT_ABUSE: ${BLACKHOLE_ELO_REPORT_SECTION_CHAT_ABUSE:chat}
        CHEATING: ${BLACKHOLE_ELO_REPORT_SECTION_CHEATING:network}
        GRIEFING: ${BLACKHOLE_ELO_REPORT_SECTION_GRIEFING:network}
        OTHER: ${BLACKHOLE_ELO_REPORT_SECTION_OTHER:}
  # Appeal workflow (Phase 6): min-days-auto is deliberately shorter than min-days-manual - the
  # whole point of ELO auto-bans is saving moderator time, so reversing one shouldn't cost MORE
  # of it via a longer wait. repeat-appeal-cooldown-days blocks a new appeal on the same
  # punishment shortly after a prior one was denied/ineligible.
  appeal:
    min-days-manual: ${BLACKHOLE_APPEAL_MIN_DAYS_MANUAL:14}
    min-days-auto: ${BLACKHOLE_APPEAL_MIN_DAYS_AUTO:3}
    repeat-appeal-cooldown-days: ${BLACKHOLE_APPEAL_REPEAT_COOLDOWN_DAYS:7}
  # Ban-evasion detection (Phase 7): ip-salt gates the whole feature - POST /evasion/record
  # returns 503 rather than silently computing a weak unsalted-equivalent hash if it's unset.
  # See IpCorrelationService's javadoc for the salt rotation tradeoff before ever rotating this.
  # Player sessions (net.onelitefeather.blackhole.backend.intel): one record per login attempt, with the clear IP and
  # the raw UUID, kept for retention-days and then deleted. Off means /intel answers 404 and Velocity's reports are dropped.
  intel:
    enabled: ${BLACKHOLE_INTEL_ENABLED:true}
    retention-days: ${BLACKHOLE_INTEL_RETENTION_DAYS:90}
    retention-sweep-cron: ${BLACKHOLE_INTEL_RETENTION_SWEEP_CRON:`0 45 3 * * *`}
    # Name history (intel/names): the names an account logged in with, kept longer than the sessions on purpose so that
    # "first seen" stays meaningful. Deleted when not seen for name-retention-days; erasure removes them at once.
    name-retention-days: ${BLACKHOLE_INTEL_NAME_RETENTION_DAYS:180}
    name-retention-sweep-cron: ${BLACKHOLE_INTEL_NAME_RETENTION_SWEEP_CRON:`0 0 4 * * *`}
    # MaxMind DB files mounted read-only into the pod (refreshed by a CronJob). Missing files store sessions without enrichment.
    geoip:
      asn-path: ${BLACKHOLE_INTEL_GEOIP_ASN_PATH:/data/geoip/asn.mmdb}
      city-path: ${BLACKHOLE_INTEL_GEOIP_CITY_PATH:/data/geoip/city.mmdb}
    # VPN and hosting detection (openspec add-vpn-proxy-detection). Classification is offline: the hosting ASNs below and
    # the enabled list sources. Sources are configuration only; the panel cannot change a URL. Each source stays off until
    # an admin has checked a refresh. Attribution is shown in the panel; the X4BNet lists are MIT licensed.
    hosting-asns: ${BLACKHOLE_INTEL_HOSTING_ASNS:}   # comma-separated AS numbers; empty by default, set per network
    hit-retention: ${BLACKHOLE_INTEL_HIT_RETENTION:P90D}   # how long a VPN or hosting hit (it holds the clear address) is kept
    login-check:
      # Read by the Velocity proxy, which owns the call timeout. A timed-out or failed check lets the login through.
      timeout: ${BLACKHOLE_INTEL_LOGIN_CHECK_TIMEOUT:PT1S}
    lists:
      # How often each enabled source is downloaded, and the delay before the first download after start-up.
      refresh-interval: ${BLACKHOLE_INTEL_LISTS_REFRESH_INTERVAL:PT6H}
      refresh-initial-delay: ${BLACKHOLE_INTEL_LISTS_REFRESH_INITIAL_DELAY:PT1M}
      # How often a replica checks the active generations and reloads its in-memory classifier when they changed.
      reload-interval: ${BLACKHOLE_INTEL_LISTS_RELOAD_INTERVAL:PT5M}
      sweep-cron: ${BLACKHOLE_INTEL_LISTS_SWEEP_CRON:`0 20 * * * *`}
      sources:
        # X4BNet lists_vpn, MIT, copyright 2024 X4B (Mathew Heard). output/vpn is known VPN networks.
        x4bnet-vpn:
          kind: VPN
          url: ${BLACKHOLE_INTEL_LISTS_X4BNET_VPN_URL:`https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt`}
          enabled: ${BLACKHOLE_INTEL_LISTS_X4BNET_VPN_ENABLED:false}
          attribution: "X4BNet lists_vpn, MIT, copyright 2024 X4B (Mathew Heard), https://github.com/X4BNet/lists_vpn"
        # X4BNet lists_vpn. output/datacenter is VPN and datacenter ranges, so it is classified as hosting.
        x4bnet-datacenter:
          kind: HOSTING
          url: ${BLACKHOLE_INTEL_LISTS_X4BNET_DATACENTER_URL:`https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/datacenter/ipv4.txt`}
          enabled: ${BLACKHOLE_INTEL_LISTS_X4BNET_DATACENTER_ENABLED:false}
          attribution: "X4BNet lists_vpn, MIT, copyright 2024 X4B (Mathew Heard), https://github.com/X4BNet/lists_vpn"
  evasion:
    ip-salt: ${BLACKHOLE_EVASION_IP_SALT:}
    detection-window-days: ${BLACKHOLE_EVASION_DETECTION_WINDOW_DAYS:7}
    retention-days: ${BLACKHOLE_EVASION_RETENTION_DAYS:90}
    retention-sweep-cron: ${BLACKHOLE_EVASION_RETENTION_SWEEP_CRON:`0 30 3 * * *`}
    # Client fingerprint signal (needs blackhole.clientrules.fingerprint-key). A weaker signal than the IP,
    # so it has its own, shorter windows. A fingerprint shared by more than max-owners owners inside the
    # window (all vanilla clients, a popular modpack) is common and links nobody.
    fingerprint:
      window-days: ${BLACKHOLE_EVASION_FINGERPRINT_WINDOW_DAYS:14}
      max-owners: ${BLACKHOLE_EVASION_FINGERPRINT_MAX_OWNERS:5}
      retention-days: ${BLACKHOLE_EVASION_FINGERPRINT_RETENTION_DAYS:30}
      retention-sweep-cron: ${BLACKHOLE_EVASION_FINGERPRINT_RETENTION_SWEEP_CRON:`0 50 3 * * *`}
  # Shared cache (net.onelitefeather.blackhole.backend.cache), stored in the Redis-protocol server
  # above (Dragonfly in production) so every replica reads and evicts the same entries. Each
  # entry expires after its per-resource TTL, so a missed eviction only causes bounded staleness.
  # timeout caps how long one cache call may block a request; past it, or on any error, the call
  # is treated as a miss and the database answers instead - the cache is never a source of truth.
  cache:
    timeout: ${BLACKHOLE_CACHE_TIMEOUT:PT0.2S}
    profile:
      ttl: ${BLACKHOLE_CACHE_PROFILE_TTL:PT30S}
    elo:
      ttl: ${BLACKHOLE_CACHE_ELO_TTL:PT30S}
    template:
      ttl: ${BLACKHOLE_CACHE_TEMPLATE_TTL:PT5M}
    section:
      ttl: ${BLACKHOLE_CACHE_SECTION_TTL:PT5M}
    # The enabled client rules proxies read; every rule write evicts it.
    client-rule:
      ttl: ${BLACKHOLE_CACHE_CLIENT_RULE_TTL:PT5M}
  # Client rules (net.onelitefeather.blackhole.backend.clientrule): the proxy evaluates the rules,
  # the backend stores them. The catalogue only feeds the rule editor's suggestions; a brand or
  # channel is listed only when at least min-players distinct players showed it, so a rare value
  # that could identify one person is never stored. Nothing in enforcement depends on it.
  # hit-retention-days: a hit (rule key, hashed owner, time, action, server; never a client trait) is
  # deleted after this many days; the rule keeps its running total. The sweep runs daily.
  clientrules:
    # The client fingerprint key (32 random bytes, base64: openssl rand -base64 32). A key of its own, not the
    # IP salt and not the Ban ID key. Unset outside dev and test: fingerprinting is off and POST
    # /evasion/fingerprint answers 503. Unset in dev and test: a random key for this run, with a warning.
    # Treat it as unrotatable in place: a new key cannot be correlated with fingerprints of the old one.
    fingerprint-key: ${BLACKHOLE_FINGERPRINT_KEY:}
    hit-retention-days: ${BLACKHOLE_CLIENTRULES_HIT_RETENTION_DAYS:30}
    hit-retention-sweep-cron: ${BLACKHOLE_CLIENTRULES_HIT_RETENTION_SWEEP_CRON:`0 45 3 * * *`}
    catalogue:
      ttl: ${BLACKHOLE_CLIENTRULES_CATALOGUE_TTL:PT24H}
      min-players: ${BLACKHOLE_CLIENTRULES_CATALOGUE_MIN_PLAYERS:3}
  # SignedVelocity state per proxy (net.onelitefeather.blackhole.backend.proxy). A proxy reports at a heartbeat of
  # five minutes; a report older than stale-after (default twice that) is shown as unknown, not as present.
  proxy:
    capabilities:
      stale-after: ${BLACKHOLE_PROXY_CAPABILITIES_STALE_AFTER:PT10M}
  # Punishment evidence (net.onelitefeather.blackhole.backend.evidence): anticheat records, replay
  # links, chat excerpts, links and uploaded screenshots/videos attached to punishments. There is
  # NO time-based expiry: evidence lives as long as its punishment record, and is deleted only with
  # it or by an admin (DELETE /evidence, reason required, audited). Never use S3 lifecycle rules to
  # delete evidence - that would leave the database and the audit trail inconsistent.
  evidence:
    # Largest accepted structured payload (ANTICHEAT / CHAT_LOG / descriptions), in bytes -> HTTP 413.
    max-payload-bytes: ${BLACKHOLE_EVIDENCE_MAX_PAYLOAD_BYTES:32768}
    # Most lines one CHAT_LOG item may carry.
    max-chat-lines: ${BLACKHOLE_EVIDENCE_MAX_CHAT_LINES:50}
    # Evidence posted with an owner + correlationId before its punishment exists is deleted
    # (reason UNCLAIMED_EXPIRED) when no punishment claims it within this ISO-8601 duration.
    pending-ttl: ${BLACKHOLE_EVIDENCE_PENDING_TTL:P1D}
    # Pending evidence that belongs to a report (correlation id starting with "report:") waits this long
    # instead, because a report can stay open for weeks. Resolving the report with a template attaches
    # it to the punishment; after a dismissal it expires like other unclaimed evidence.
    report-pending-ttl: ${BLACKHOLE_EVIDENCE_REPORT_PENDING_TTL:P30D}
    # Audit rows are kept indefinitely unless the operator sets a retention (ISO-8601 duration).
    # Leave empty to keep them.
    audit-retention: ${BLACKHOLE_EVIDENCE_AUDIT_RETENTION:}
    housekeeping:
      # How often the sweep runs: deletes unclaimed pending evidence after pending-ttl, blobs
      # without a database row older than one day, and (only if audit-retention is set) old audit
      # rows. It never deletes evidence that belongs to a punishment.
      interval: ${BLACKHOLE_EVIDENCE_HOUSEKEEPING_INTERVAL:PT1H}
    files:
      # Where uploaded files are stored: s3 (any S3-compatible service, the default) or local
      # (a directory; for tiny single-replica setups, or a shared volume).
      storage: ${BLACKHOLE_EVIDENCE_FILES_STORAGE:s3}
      # Size caps per type, in bytes. Uploads are streamed to a bounded temp file, never held in memory.
      max-image-bytes: ${BLACKHOLE_EVIDENCE_FILES_MAX_IMAGE_BYTES:10485760}
      max-video-bytes: ${BLACKHOLE_EVIDENCE_FILES_MAX_VIDEO_BYTES:104857600}
      # Images with more pixels are rejected before decoding (decompression-bomb guard).
      max-image-pixels: ${BLACKHOLE_EVIDENCE_FILES_MAX_IMAGE_PIXELS:50000000}
      # The type is detected from the file's magic bytes; the client's MIME type is ignored.
      # Remove video/* to disable video uploads (their container metadata is not stripped).
      allowed-types: ${BLACKHOLE_EVIDENCE_FILES_ALLOWED_TYPES:image/png,image/jpeg,video/mp4,video/webm}
      local:
        path: ${BLACKHOLE_EVIDENCE_FILES_LOCAL_PATH:evidence-files}
      s3:
        # Leave the endpoint empty for AWS S3; set it for SeaweedFS, Ceph, R2, B2, ... (path-style).
        endpoint: ${BLACKHOLE_EVIDENCE_S3_ENDPOINT:`http://localhost:8333`}
        bucket: ${BLACKHOLE_EVIDENCE_S3_BUCKET:blackhole-evidence}
        region: ${BLACKHOLE_EVIDENCE_S3_REGION:us-east-1}
        access-key: ${BLACKHOLE_EVIDENCE_S3_ACCESS_KEY:blackhole}
        secret-key: ${BLACKHOLE_EVIDENCE_S3_SECRET_KEY:blackhole-secret}
        path-style: ${BLACKHOLE_EVIDENCE_S3_PATH_STYLE:true}
    scan:
      # Antivirus scan of uploads through a ClamAV clamd (INSTREAM). Fails closed: while enabled,
      # an infected file is rejected (422) and an unreachable scanner rejects the upload (503).
      # ClamAV needs about 1 GB RAM and downloads its signatures on first start. Only disable this
      # explicitly, in deployments that scan uploads elsewhere.
      enabled: ${BLACKHOLE_EVIDENCE_SCAN_ENABLED:true}
      clamd:
        host: ${BLACKHOLE_EVIDENCE_SCAN_CLAMD_HOST:localhost}
        port: ${BLACKHOLE_EVIDENCE_SCAN_CLAMD_PORT:3310}
        timeout: ${BLACKHOLE_EVIDENCE_SCAN_CLAMD_TIMEOUT:PT30S}
  # Player-name resolution, so moderators can tab-complete and target an OFFLINE player by name
  # (punishment enforcement is already fully UUID-driven at login - see PlayerLoginListener on
  # the Velocity side - so resolving a name to a UUID is the only missing piece). Resolvers are
  # tried in a fixed priority order (Otis, then Mojang, then NameMC) and the chain stops at the
  # first hit; disabling one is a config change only, not a code change. Hits are kept in the
  # shared cache for ttl; misses are never cached.
  player-resolver:
    cache:
      ttl: ${BLACKHOLE_PLAYER_RESOLVER_CACHE_TTL:PT5M}
    # Otis is the team's own in-house player master-data service - the primary, most trustworthy
    # resolver. base-url has no default: it's a per-deployment private service address, unlike
    # Mojang's fixed public API below, so the resolver bean only loads once it's actually set.
    otis:
      enabled: ${BLACKHOLE_PLAYER_RESOLVER_OTIS_ENABLED:true}
      base-url: ${BLACKHOLE_PLAYER_RESOLVER_OTIS_BASE_URL:}
    # Mojang's official name->UUID API - no auth, but rate-limited, so kept as a fallback rather
    # than the primary source.
    mojang:
      enabled: ${BLACKHOLE_PLAYER_RESOLVER_MOJANG_ENABLED:true}
      # Overridable so tests can point the client at a local fake instead of the public host.
      base-url: ${BLACKHOLE_PLAYER_RESOLVER_MOJANG_BASE_URL:https://api.mojang.com}
    # NameMC has no official public API - only undocumented endpoints that "may change or
    # disappear at any time" per every third-party wrapper. Lowest priority, and disabled by
    # default: an operator has to explicitly opt into that instability.
    namemc:
      enabled: ${BLACKHOLE_PLAYER_RESOLVER_NAMEMC_ENABLED:false}

micronaut:
  application:
    name: Blackhole API
  # Resource server only: bearer tokens, no login flow, no session. A route with no @Secured rule is
  # rejected. The token must be signed by the issuer's JWKS (blackhole.security.jwks-url), come from
  # the issuer and be meant for this API (audience); expiry is always checked.
  security:
    authentication: bearer
    endpoints:
      # The library's /token_info route is not needed (GET /auth/me describes the caller).
      introspection:
        enabled: false
    token:
      jwt:
        claims-validators:
          # Entra v2 tokens: https://login.microsoftonline.com/<tenant>/v2.0
          issuer: ${BLACKHOLE_AUTH_ISSUER:`http://localhost:18090/blackhole`}
          # The API app registration's application (client) id GUID, as it appears in the token's
          # "aud" claim (a plain GUID for v2 tokens). The default "blackhole-api" is a local-dev
          # placeholder, not a real Entra value; it is accepted only in dev and test, anywhere else
          # StartupRequirementsGuard refuses to start unless this is the GUID. The chart sets it from auth.apiClientId.
          audience: ${BLACKHOLE_AUTH_AUDIENCE:blackhole-api}
          # exp and nbf are checked by TimeClaimsValidator, which applies the bounded clock skew
          # (blackhole.security.clock-skew-seconds). The library validators have no leeway, so they
          # are switched off here.
          expiration: false
          not-before: false
    intercept-url-map:
      - pattern: /health/**
        access:
          - isAnonymous()
      - pattern: /prometheus
        access:
          - METRICS
      - pattern: /swagger/**
        access:
          - VIEWER
      - pattern: /swagger-ui/**
        access:
          - VIEWER
  serde:
    jackson:
      parser-features:

  # Server
  server:
    port: ${PORT:8080}
    # Evidence file uploads are multipart and as large as the biggest allowed video, so the default
    # 10 MB request / 1 MB file caps are raised: the file cap follows max-video-bytes, the request
    # cap must stay above it (headroom for the form fields) - raise both if you raise the video
    # limit. The evidence layer enforces the real per-type limits while streaming; structured
    # evidence is capped separately by blackhole.evidence.max-payload-bytes.
    max-request-size: ${BLACKHOLE_MAX_REQUEST_SIZE:110MB}
    multipart:
      max-file-size: ${BLACKHOLE_EVIDENCE_FILES_MAX_VIDEO_BYTES:104857600}

# OpenAPI
  router:
    static-resources:
      swagger:
        enabled: ${blackhole.docs.enabled}
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        enabled: ${blackhole.docs.enabled}
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
    # API versioning (see docs.micronaut.io/latest/guide/#apiVersioning): resolved from the
    # X-API-VERSION header or an api-version/v query parameter, not a URI prefix. default-version
    # keeps existing callers that send neither working - they're routed to @Version("1") as if
    # they'd asked for it explicitly. Bump default-version only once v1 callers are gone; until
    # then, adding a v2 means new @Version("2") methods alongside the existing v1 ones.
    versioning:
      enabled: true
      default-version: ${BLACKHOLE_API_DEFAULT_VERSION:1}
      header:
        enabled: true
        names:
          - 'X-API-VERSION'
      parameter:
        enabled: true
        names:
          - 'v'
          - 'api-version'
  # micronaut-openapi's own toggle (distinct from micronaut.router.versioning.enabled above):
  # by default it documents the version header/parameter as an explicit operation parameter,
  # which the OpenAPI-generated client then surfaces as an extra required method argument on
  # every single call. Disabled here so routing stays version-aware but the generated client API
  # doesn't leak the version knob into every call site.
  openapi:
    versioning:
      enabled: false

# OpenTelemetry — tracing is disabled unless OTEL_TRACES_EXPORTER=otlp is set
# (do this in the Docker/prod container). Metrics stay on Prometheus/Micrometer.
otel:
  service:
    name: ${OTEL_SERVICE_NAME:blackhole}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
    # Head sampler. parentbased_always_on keeps every trace so the Alloy tail policy sees all spans;
    # lowering it below 1.0 would hide slow and failed traces from that policy. OTEL_TRACES_SAMPLER_ARG
    # is read by the SDK directly and is only needed for the ratio samplers.
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_always_on}
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:`http://localhost:4317`}
  exclusions:
    - /health
    - /health/.*
    - /prometheus
    - /swagger
    - /swagger/.*
    - /swagger-ui/.*
