# docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: 'postgres_blackhole'
    ports:
      - "5432:5432"
    shm_size: 128mb
    environment:
      POSTGRES_USER: blackhole
      POSTGRES_PASSWORD: blackhole
      POSTGRES_DB: blackhole
    volumes:
      - ./postgres/data/:/var/lib/postgresql/data
    networks:
      - blackhole_go_net
  rabbitmq:
    image: rabbitmq:4-management
    container_name: 'rabbitmq_blackhole'
    networks:
      - blackhole_go_net
    shm_size: 128mb
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
  redis:
    image: redis:8-alpine
    container_name: 'redis_blackhole'
    networks:
      - blackhole_go_net
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data/:/data

networks:
  blackhole_go_net:
    driver: bridge
