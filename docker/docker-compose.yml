# docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: 'postgres_blackhole'
    ports:
      - "5432:5432"
    shm_size: 128mb
    environment:
      POSTGRES_USER: blackhole
      POSTGRES_PASSWORD: blackhole
      POSTGRES_DB: blackhole
    volumes:
      - ./postgres/data/:/var/lib/postgresql/data
    networks:
      - blackhole_go_net
  # NATS with JetStream carries the domain event bus (subjects blackhole.events.<type>, stream
  # BLACKHOLE_EVENTS). The tag matches the server of the feather-core NATS chart (2.15.1). Local
  # development runs without authentication. 4222 is the client port, 8222 the monitoring port
  # (http://localhost:8222/jsz reports the JetStream state).
  nats:
    image: nats:2.15.2-alpine
    container_name: 'nats_blackhole'
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks:
      - blackhole_go_net
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats/data/:/data
  # Dragonfly is wire-compatible with Redis, so REDIS_URI (proxy sync + shared cache) is unchanged.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: 'dragonfly_blackhole'
    ulimits:
      memlock: -1
    networks:
      - blackhole_go_net
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data/:/data

  # Evidence files (screenshots, videos) in an S3-compatible store. SeaweedFS is Apache-2.0; its S3
  # gateway listens on 8333. The credentials and the bucket match the application.yml defaults
  # (BLACKHOLE_EVIDENCE_S3_*). Local development only: change the credentials anywhere else.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: 'seaweedfs_blackhole'
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${BLACKHOLE_EVIDENCE_S3_ACCESS_KEY:-blackhole}
      AWS_SECRET_ACCESS_KEY: ${BLACKHOLE_EVIDENCE_S3_SECRET_KEY:-blackhole-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - blackhole_go_net
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs/data/:/data

  # Creates the evidence bucket once SeaweedFS is up, then exits. Safe to run again.
  seaweedfs-init:
    image: amazon/aws-cli:2.38.6
    container_name: 'seaweedfs_init_blackhole'
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${BLACKHOLE_EVIDENCE_S3_ACCESS_KEY:-blackhole}
      AWS_SECRET_ACCESS_KEY: ${BLACKHOLE_EVIDENCE_S3_SECRET_KEY:-blackhole-secret}
      AWS_DEFAULT_REGION: ${BLACKHOLE_EVIDENCE_S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${BLACKHOLE_EVIDENCE_S3_BUCKET:-blackhole-evidence}
        || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${BLACKHOLE_EVIDENCE_S3_BUCKET:-blackhole-evidence}
    networks:
      - blackhole_go_net

  # Virus scanner for uploaded evidence (the backend fails closed: no scanner, no upload). It needs
  # about 1 GB of RAM and downloads its signature database on first start, which takes a few minutes
  # and needs internet access; the container reports healthy only after that. The size limits are
  # raised above the 100 MiB video cap of the backend, otherwise clamd rejects large videos.
  clamav:
    image: clamav/clamav:1.5.4
    container_name: 'clamav_blackhole'
    environment:
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 220M
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    networks:
      - blackhole_go_net
    ports:
      - "3310:3310"
    volumes:
      - ./clamav/data/:/var/lib/clamav

  # Stand-in for Microsoft Entra ID in local development (never use it anywhere else). Issuer:
  # http://localhost:18090/blackhole, which matches the BLACKHOLE_AUTH_* defaults of application.yml.
  # Interactive sign-in at /blackhole/authorize: log in as admin, moderator, viewer or nogroup (the
  # user name picks the claims, see mock-oauth/config.json). Client-credentials tokens for the proxy
  # and the metrics scraper come from client_id blackhole-proxy / blackhole-metrics. The issuer in a
  # token follows the host the caller used, so always reach it as localhost:18090.
  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    container_name: 'mock_oauth_blackhole'
    environment:
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - "127.0.0.1:18090:8080"
    volumes:
      - ./mock-oauth/config.json:/config/config.json:ro
    networks:
      - blackhole_go_net

  # The admin web UI at http://localhost:8081, a Node (Nitro) server that serves the built files and
  # forwards /api/ to the backend; the image's own healthcheck probes /healthz. Staff sign in in the
  # browser (OIDC, see below) and the backend verifies every call. The backend is expected on the host
  # (./gradlew :backend:run); point BLACKHOLE_BACKEND_URL elsewhere to use another one.
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: 'web_blackhole'
    environment:
      BLACKHOLE_BACKEND_URL: ${BLACKHOLE_BACKEND_URL:-http://host.docker.internal:8080}
      # Sign-in against the mock OIDC server above; the browser reaches it as localhost:18090. Point these at
      # Entra ID for a real tenant (see web/README.md).
      BLACKHOLE_UI_OIDC_AUTHORITY: ${BLACKHOLE_UI_OIDC_AUTHORITY:-http://localhost:18090/blackhole}
      BLACKHOLE_UI_OIDC_CLIENT_ID: ${BLACKHOLE_UI_OIDC_CLIENT_ID:-blackhole-web}
      BLACKHOLE_UI_API_SCOPE: ${BLACKHOLE_UI_API_SCOPE:-blackhole-api/access_as_user}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - blackhole_go_net

  # The Discord bot (discord module). It sits behind the compose profile "discord", so a plain
  # `docker compose up` does not start it: it needs a real Discord bot and the Entra client of
  # docs/entra-setup.sh (role Blackhole.Discord). Set the variables (placeholders only, never commit real
  # values; see docs/discord-bot.md and discord/README.md) and run
  # `docker compose --profile discord up -d discord`. An unset required value stops the bot at start with
  # exit code 2 and names it. The bot is stateless; its health endpoint is on 8082 (internal use only).
  discord:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: discord/Dockerfile
    container_name: 'discord_blackhole'
    depends_on:
      - nats
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_TEAM_CHANNEL_ID: ${DISCORD_TEAM_CHANNEL_ID:-}
      DISCORD_STAFF_ROLE_ID: ${DISCORD_STAFF_ROLE_ID:-}
      DISCORD_TICKET_CATEGORY_ID: ${DISCORD_TICKET_CATEGORY_ID:-}
      DISCORD_ARCHIVE_CATEGORY_ID: ${DISCORD_ARCHIVE_CATEGORY_ID:-}
      # Optional; empty means "not set" and the bot's default applies.
      DISCORD_APPEAL_CHANNEL_ID: ${DISCORD_APPEAL_CHANNEL_ID:-}
      DISCORD_ARCHIVE_DELETE_AFTER: ${DISCORD_ARCHIVE_DELETE_AFTER:-}
      DISCORD_SYNC_INTERVAL: ${DISCORD_SYNC_INTERVAL:-}
      DISCORD_STAFF_RECONCILE_INTERVAL: ${DISCORD_STAFF_RECONCILE_INTERVAL:-}
      DISCORD_LEAK_SCAN: ${DISCORD_LEAK_SCAN:-}
      DISCORD_LEAK_SCAN_CHANNELS: ${DISCORD_LEAK_SCAN_CHANNELS:-}
      BLACKHOLE_BACKEND_URL: ${BLACKHOLE_BACKEND_URL:-http://host.docker.internal:8080}
      BLACKHOLE_PANEL_URL: ${BLACKHOLE_PANEL_URL:-http://localhost:8081}
      # Local NATS has no authentication; set NATS_CREDS_FILE (and mount the file) for a server that needs it.
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_CREDS_FILE: ${NATS_CREDS_FILE:-}
      BLACKHOLE_DISCORD_TENANT_ID: ${BLACKHOLE_DISCORD_TENANT_ID:-}
      BLACKHOLE_DISCORD_CLIENT_ID: ${BLACKHOLE_DISCORD_CLIENT_ID:-}
      BLACKHOLE_DISCORD_CLIENT_SECRET: ${BLACKHOLE_DISCORD_CLIENT_SECRET:-}
      BLACKHOLE_DISCORD_AUTH_SCOPE: ${BLACKHOLE_DISCORD_AUTH_SCOPE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - blackhole_go_net

networks:
  blackhole_go_net:
    driver: bridge
